# Per-plugin deployment manifest.
# Used by the reusable GitHub Actions workflow to determine deployment order.

platform:
  path: {{PLATFORM_DEPLOY_PATH}}
  name: {{PLATFORM_STACK_NAME}}

plugins:
  - name: {{PLUGIN_1_NAME}}
    path: {{PLUGIN_1_DEPLOY_PATH}}
    depends-on: []

