packages:
  - 'packages/*'
  - 'rescript/*'
  - 'reventless/*'
  - 'examples/**'

# pnpm 10 blocks postinstall scripts by default; allowlist the ones we need.
# Keep this list in sync with the set of deps that ship native binaries or
# install-time codegen.
onlyBuiltDependencies:
  - '@pulumi/aws-native'
  - core-js
  - core-js-pure
  - cpu-features
  - esbuild
  - nx
  - protobufjs
  - rescript-relay
  - ssh2
  - sury-ppx
