# Local dev users for the in-memory platform — TEMPLATE.
#
# `scripts/setup.mjs` copies this to `.reventless/users.yaml` (which is
# gitignored, so your real local users never get committed). You can also copy
# it by hand:
#
#   cp users.example.yaml .reventless/users.yaml
#
# The in-memory auth adapter loads `.reventless/users.yaml` (relative to the
# process cwd) at startup. Each entry: username, password, groups[] (required;
# [] = unprivileged), userId? (defaults to username). "Admin" grants
# platform/admin access; "User" is a regular shopper. Restart the server after
# editing.
#
# `pnpm run seed` reads the same file: it offers these accounts as the login to
# seed as, first as the default, and takes the password from here.
#
# Log in via POST http://localhost:4000/__inmemory/login or the host-shell
# LoginPage. THESE ARE THROWAWAY DEV CREDENTIALS — never reuse them anywhere real.

- username: admin
  password: admin
  groups: [Admin, User]
  userId: local-admin

- username: user
  password: user
  groups: [User]
  userId: local-user
