# Local dev users for the in-memory platform — TEMPLATE.
#
# `scripts/setup.mjs` copies this to `.reventless/users.yaml` (which is
# gitignored, so your real local users never get committed). You can also copy
# it by hand:
#
#   cp users.example.yaml .reventless/users.yaml
#
# The in-memory auth adapter loads `.reventless/users.yaml` (relative to the
# process cwd) at startup. Each entry: username, password, groups[] (required;
# [] = unprivileged), userId? (defaults to username). Restart the server after
# editing.
#
# The shop's four roles, and what makes them different from each other:
#
#   Shopper       browses the catalog and places their own orders. Reads are
#                 owner-scoped, so this account sees its own orders and nobody
#                 else's.
#   Merchandiser  maintains the catalog — products, categories, prices, images,
#                 and the demand view. An operator role that needs NO elevation:
#                 nothing it touches records an owner, so there is nothing to
#                 scope it out of.
#   Fulfilment    works the order board and ships orders. The job is reading
#                 orders that belong to other people, so it needs the exemption
#                 from owner scoping — and does not have it yet; see below.
#   Admin         everything, including the platform's own admin surfaces.
#
# Merchandiser and Fulfilment are the pair worth keeping: they show that "which
# surfaces does this role use" and "does this role read across owners" are
# separate questions. `Storefront.elevatedGroups` answers only the second, and
# today it names Admin alone.
#
# Fulfilment is absent from it deliberately and temporarily. Being elevated also
# decides where the host UI looks for its surfaces — an elevated caller is sent
# to the admin API, which is gated on the group Admin specifically — so a role
# elevated by any other name is routed to a door it cannot open. Until those two
# questions come apart, this account reads its own orders like anybody else,
# which makes the order board it is meant to work look empty.
#
# Log in via POST http://localhost:4000/__inmemory/login or the host-shell
# LoginPage. THESE ARE THROWAWAY DEV CREDENTIALS — never reuse them anywhere real.

- username: admin
  password: admin
  groups: [Admin, Shopper]
  userId: local-admin

- username: shopper
  password: shopper
  groups: [Shopper]
  userId: local-shopper

- username: merch
  password: merch
  groups: [Merchandiser, Shopper]
  userId: local-merch

- username: fulfil
  password: fulfil
  groups: [Fulfilment, Shopper]
  userId: local-fulfil
