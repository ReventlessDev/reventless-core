name: Setup reventless-ppx (from source)
description: >
  Build the native reventless-ppx binary from source and stage it at the
  local-fallback path that packages/reventless-ppx/bin resolves BEFORE the
  published per-platform package. With .npmrc's node-linker=hoisted the installed
  per-platform package lands at the workspace root, which the bin resolver only
  reaches on its final ancestor-directory walk — so a from-source binary at this
  path outranks it in every in-repo build. That makes a PPX source change ship in
  a single commit: the tree compiles the new PPX without waiting for the
  per-platform republish + optionalDependencies pin. Idempotent and cheap on a
  warm dune-cache. Linux runners only (the workflows that use it all run on
  ubuntu-latest).

inputs:
  ocaml-compiler:
    description: OCaml compiler version to build the PPX with.
    required: false
    default: "5.2.x"
  source-dir:
    description: Directory holding the PPX dune project (the build's working directory).
    required: false
    default: packages/reventless-ppx/src
  output-path:
    description: >
      Repository-relative path to stage the compiled binary at. Must be the
      Linux local-fallback name the bin resolver looks for (ppx-linux.exe).
    required: false
    default: packages/reventless-ppx/ppx-linux.exe

runs:
  using: composite
  steps:
    # Both steps below fetch from hosts nobody here controls — the OCaml
    # toolchain from opam's repositories and GitHub releases, the dependencies
    # from opam again — so their availability, not this repository's state,
    # decides whether they pass. On 2026-08-12 a `dune` 503 plus apt-mirror 404s
    # failed a release and a deploy within minutes of each other, and the release
    # half published packages without recording their versions in git.
    #
    # One retry after a pause is the whole fix: it turns that class of outage
    # into a slower job rather than a red one, and a genuine failure still fails
    # twice and stops. Retrying here rather than at the four call sites keeps it
    # in one place.
    - name: Setup OCaml
      id: ocaml
      continue-on-error: true
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
        dune-cache: true

    - name: Pause before retrying the OCaml toolchain
      if: steps.ocaml.outcome == 'failure'
      shell: bash
      run: |
        echo "OCaml setup failed; the usual cause is a transient upstream fetch. Retrying once."
        sleep 45

    - name: Setup OCaml (retry)
      if: steps.ocaml.outcome == 'failure'
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ inputs.ocaml-compiler }}
        dune-cache: true

    - name: Build reventless-ppx from source
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        set -euo pipefail
        # Same reasoning as the toolchain above: the dependency solve fetches
        # sources, so it fails on someone else's outage. The build itself is
        # local and is not retried — a compile error is not transient.
        for attempt in 1 2; do
          if opam install . --deps-only --yes; then
            break
          fi
          if [ "$attempt" = 2 ]; then
            echo "::error::opam could not install the PPX dependencies after two attempts"
            exit 1
          fi
          echo "opam install failed; retrying once in 45s"
          sleep 45
        done
        opam exec -- dune build

    - name: Stage binary at the local-fallback path
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        # Absolute paths so this is correct regardless of the caller's cwd. The
        # staged .exe matches *.exe in .gitignore, so it survives the release
        # workflow's `git reset --hard` / `git clean -fd` and reaches the build.
        cp "$SOURCE_DIR/_build/default/bin/bin.exe" "$GITHUB_WORKSPACE/$OUTPUT_PATH"
        chmod +x "$GITHUB_WORKSPACE/$OUTPUT_PATH"
        echo "Staged from-source PPX at $OUTPUT_PATH"
