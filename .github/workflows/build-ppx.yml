name: Build Reventless PPX

# Build-once-per-version workflow for the native reventless-ppx binaries.
#
# Triggered ONLY by changes to the PPX *source* (or manual dispatch) — never by a
# normal framework build. Every other CI job and every developer consumes the
# published, version-pinned package from the registry cache and never compiles
# the PPX.
#
# Publishing model (esbuild/swc style): each platform binary ships as its own
# package @reventlessdev/reventless-ppx-<platform> with os/cpu fields; the thin
# main @reventlessdev/reventless-ppx declares them as optionalDependencies, so a
# consumer installs only the matching one.
#
# PREREQUISITE before a publish run: the per-platform package.json files AND the
# main package.json must already carry the SAME (lockstep) version, and the main
# package.json must declare the optionalDependencies (see the cutover runbook in
# docs/plans/prebuilt-binaries-out-of-repo.md). Publishing an existing version is
# a no-op (the registry rejects it), so bump deliberately.

on:
  push:
    branches: [main, beta, alpha]
    paths:
      - "packages/reventless-ppx/src/**"
  pull_request:
    branches: [main, beta, alpha]
    paths:
      - "packages/reventless-ppx/src/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the per-platform + main packages to GitHub Packages"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # linux x64
            target: linux-x64
          - os: macos-14 # arm64 (Apple Silicon)
            target: darwin-arm64
          - os: macos-13 # x64 (Intel) — sunsetting GitHub runner
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.target }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes
        working-directory: packages/reventless-ppx/src

      - name: Build binary
        run: opam exec -- dune build
        working-directory: packages/reventless-ppx/src

      - name: Stage binary into platform package
        run: |
          cp packages/reventless-ppx/src/_build/default/bin/bin.exe \
             packages/reventless-ppx/npm/${{ matrix.target }}/ppx.exe
          chmod +x packages/reventless-ppx/npm/${{ matrix.target }}/ppx.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppx-${{ matrix.target }}
          path: packages/reventless-ppx/npm/${{ matrix.target }}/ppx.exe
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    name: Test PPX
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes
        working-directory: packages/reventless-ppx/src

      - name: Run PPX tests
        run: npm test
        working-directory: packages/reventless-ppx

  # Publish the per-platform binary packages + the thin main package. Runs on a
  # src/** push to a release branch, or a manual dispatch with publish=true.
  # PRs build + test but never publish.
  publish:
    needs: [build, test]
    runs-on: ubuntu-latest
    name: Publish packages
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          registry-url: "https://npm.pkg.github.com"

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: /tmp/ppx-bins

      - name: Place binaries into platform packages
        run: |
          set -euo pipefail
          for target in linux-x64 darwin-arm64 darwin-x64; do
            src="/tmp/ppx-bins/ppx-${target}/ppx.exe"
            dest="packages/reventless-ppx/npm/${target}/ppx.exe"
            if [ ! -f "$src" ]; then
              echo "::error::missing built binary for ${target}"; exit 1
            fi
            cp "$src" "$dest"
            chmod +x "$dest"
            echo "Staged ${dest}"
          done

      - name: Publish per-platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for target in linux-x64 darwin-arm64 darwin-x64; do
            ( cd "packages/reventless-ppx/npm/${target}" && npm publish ) \
              || echo "::warning::publish of ${target} skipped (version may already exist)"
          done

      - name: Publish main (thin) package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ( cd packages/reventless-ppx && npm publish ) \
            || echo "::warning::publish of main skipped (version may already exist)"
