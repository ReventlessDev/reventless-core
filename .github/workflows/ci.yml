name: CI

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main, alpha]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint code
        run: npm run lint || echo "No lint script configured"
        if: always()

      - name: Check formatting
        run: npm run format:check || echo "No format:check script configured"
        if: always()

      - name: Validate package.json files
        run: |
          find packages -name "package.json" -exec npm pkg fix {} \;
          git diff --exit-code || (echo "package.json files need fixing" && exit 1)

  type-check-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run type-check 2>/dev/null || echo "No type-check script configured"
        if: always()

      - name: Build all packages
        run: npm run build

      - name: Validate build artifacts
        run: |
          # Check that all packages have built artifacts
          for package in packages/*/; do
            if [ -f "$package/package.json" ]; then
              package_name=$(basename "$package")
              if [ ! -d "$package/lib" ] && [ ! -d "$package/dist" ] && [ ! -f "$package/index.js" ]; then
                echo "Warning: No build artifacts found for $package_name"
              fi
            fi
          done

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/lib
            packages/*/dist
            packages/*/*.js
            packages/*/*.mjs
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: type-check-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore build artifacts
        uses: actions/cache@v4
        with:
          path: |
            packages/*/lib
            packages/*/dist
            packages/*/*.js
            packages/*/*.mjs
          key: build-${{ runner.os }}-${{ github.sha }}

      - name: Build packages (if cache miss)
        run: npm run build

      - name: Run unit tests
        run: npm run test
        env:
          CI: true

      - name: Run integration tests
        run: npm run test:integration
        if: always()
        continue-on-error: true

      - name: Generate coverage report
        run: npm run test:coverage 2>/dev/null || echo "No test:coverage script configured"
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  security-scan:
    name: Security & Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run security scan with Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          npx audit-ci --config .audit-ci.json
        continue-on-error: true

  dependency-check:
    name: Dependency Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"

      - name: Analyze dependencies
        run: |
          npx depcheck --ignores="@types/*,eslint-*,prettier,@rescript/*,lerna,rescript"
          npx npm-check-updates --target minor

      - name: Check for circular dependencies
        run: |
          npx madge --circular --extensions js,mjs,res packages/ -x '@rescript/std'

  build-matrix:
    name: Build Matrix Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build packages
        run: npm run build

      - name: Run basic tests
        run: npm run test:unit
        continue-on-error: true

  validate-monorepo:
    name: Validate Monorepo Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"

      - name: Validate Lerna configuration
        run: |
          npx lerna list --all
          npx lerna ls --graph

      - name: Check package dependencies
        run: |
          # Validate that internal dependencies use workspace protocol
          # Note: This check is informational only - packages use npm workspaces
          node -e "
            const fs = require('fs');
            const path = require('path');
            const packages = fs.readdirSync('packages');
            let hasErrors = false;
            
            packages.forEach(pkg => {
              const pkgPath = path.join('packages', pkg, 'package.json');
              if (fs.existsSync(pkgPath)) {
                const pkgJson = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                const deps = {...(pkgJson.dependencies || {}), ...(pkgJson.devDependencies || {})};
                
                Object.keys(deps).forEach(dep => {
                  if (dep.startsWith('@reventless/') && !deps[dep].startsWith('workspace:')) {
                    console.warn(\`Package \${pkg} should use workspace protocol for \${dep}\`);
                    hasErrors = true;
                  }
                });
              }
            });
            
            if (hasErrors) {
              console.log('Note: Using npm workspaces instead of workspace: protocol');
            }
          "

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-format,
        type-check-and-build,
        test,
        security-scan,
        dependency-check,
        validate-monorepo,
      ]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "Lint & Format: ${{ needs.lint-and-format.result }}"
          echo "Type Check & Build: ${{ needs.type-check-and-build.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Dependency Check: ${{ needs.dependency-check.result }}"
          echo "Validate Monorepo: ${{ needs.validate-monorepo.result }}"

          if [[ "${{ needs.lint-and-format.result }}" == "failure" || 
                "${{ needs.type-check-and-build.result }}" == "failure" || 
                "${{ needs.test.result }}" == "failure" || 
                "${{ needs.validate-monorepo.result }}" == "failure" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
            echo "✅ CI pipeline passed"
          fi
