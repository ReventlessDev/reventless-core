  type-check-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    # needs: lint-and-format  # Commented out - lint job disabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check
        run: npm run type-check 2>/dev/null || echo "No type-check script configured"
        if: always()

      - name: Build all packages
        run: npm run build

      # Commented out for faster CI - re-enable if needed
      # - name: Validate build artifacts
      #   run: |
      #     # Check that all packages have built artifacts
      #     for package in packages/*/; do
      #       if [ -f "$package/package.json" ]; then
      #         package_name=$(basename "$package")
      #         if [ ! -d "$package/lib" ] && [ ! -d "$package/dist" ] && [ ! -f "$package/index.js" ]; then
      #           echo "Warning: No build artifacts found for $package_name"
      #         fi
      #       fi
      #     done

      - name: Cache build artifacts
        uses: actions/cache/save@v5
        with:
          path: |
            packages/*/lib
            packages/*/dist
            packages/*/*.js
            packages/*/*.mjs
          key: build-${{ runner.os }}-${{ github.sha }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: type-check-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore build artifacts
        uses: actions/cache@v5
        with:
          path: |
            packages/*/lib
            packages/*/dist
            packages/*/*.js
            packages/*/*.mjs
          key: build-${{ runner.os }}-${{ github.sha }}

      - name: Build packages (if cache miss)
        run: npm run build

      - name: Run unit tests
        run: npm run test
        env:
          CI: true

      - name: Run integration tests
        run: npm run test:integration
        if: always()
        continue-on-error: true

