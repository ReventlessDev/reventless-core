          echo "Test: ${{ needs.test.result }}"

          if [[ "${{ needs.type-check-and-build.result }}" == "failure" ||
                "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
