name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'
  pull_request:
    branches: [main, beta, alpha]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect affected test projects
        id: affected
        run: |
          # Map changed paths to Jest --selectProjects names.
          # Framework changes → run all tests. Example/binding changes → scoped.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              echo "select=all" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" 2>/dev/null || echo "")
          if [[ -z "$CHANGED" ]]; then
            echo "select=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Framework changes → run everything
          if echo "$CHANGED" | grep -qE "^reventless/core/|^reventless/spec/|^rescript/|^package\.json|^jest\.config"; then
            echo "select=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECTS=""
          # In-memory adapter
          if echo "$CHANGED" | grep -q "^reventless/local/"; then
            PROJECTS="$PROJECTS --selectProjects reventless-local"
          fi
          # Interop
          if echo "$CHANGED" | grep -q "^reventless/interop/"; then
            PROJECTS="$PROJECTS --selectProjects reventless-interop"
          fi
          # rescript-moment
          if echo "$CHANGED" | grep -q "^rescript/rescript-moment/"; then
            PROJECTS="$PROJECTS --selectProjects rescript-moment"
          fi
          # DCB examples
          if echo "$CHANGED" | grep -q "^examples/online-shop-dcb/catalog/"; then
            PROJECTS="$PROJECTS --selectProjects online-shop-dcb-catalog"
          fi
          if echo "$CHANGED" | grep -q "^examples/online-shop-dcb/ordering/"; then
            PROJECTS="$PROJECTS --selectProjects online-shop-dcb-ordering"
          fi
          # Aggregate examples
          if echo "$CHANGED" | grep -q "^examples/online-shop-aggregates/catalog/"; then
            PROJECTS="$PROJECTS --selectProjects example-aggregate-catalog"
          fi
          if echo "$CHANGED" | grep -q "^examples/online-shop-aggregates/ordering/"; then
            PROJECTS="$PROJECTS --selectProjects example-aggregate-ordering"
          fi
          # Hybrid examples
          if echo "$CHANGED" | grep -q "^examples/online-shop-hybrid/catalog/"; then
            PROJECTS="$PROJECTS --selectProjects online-shop-hybrid-catalog"
          fi
          if echo "$CHANGED" | grep -q "^examples/online-shop-hybrid/ordering/"; then
            PROJECTS="$PROJECTS --selectProjects online-shop-hybrid-ordering"
          fi

          # In-memory changes also affect all example tests (they depend on it)
          if echo "$CHANGED" | grep -q "^reventless/local/"; then
            PROJECTS="$PROJECTS --selectProjects online-shop-dcb-catalog --selectProjects online-shop-dcb-ordering"
            PROJECTS="$PROJECTS --selectProjects example-aggregate-catalog --selectProjects example-aggregate-ordering"
            PROJECTS="$PROJECTS --selectProjects online-shop-hybrid-catalog --selectProjects online-shop-hybrid-ordering"
          fi

          if [[ -z "$PROJECTS" ]]; then
            # Changes outside any test-mapped path (e.g. reventless-aws, rescript bindings with no tests)
            echo "select=none" >> "$GITHUB_OUTPUT"
          else
            # Deduplicate --selectProjects flags
            PROJECTS=$(echo "$PROJECTS" | tr ' ' '\n' | awk '!seen[$0]++' | tr '\n' ' ')
            echo "select=some" >> "$GITHUB_OUTPUT"
            echo "projects=$PROJECTS" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if PPX Linux binary is available
        if: steps.affected.outputs.select != 'none'
        id: ppx_check
        run: |
          # The native PPX is consumed from the published per-platform package
          # @reventlessdev/reventless-ppx-linux-x64 (installed as an
          # optionalDependency, resolved by packages/reventless-ppx/bin). Build
          # from source ONLY when that binary is absent — i.e. the optionalDep
          # was silently skipped (missing/unpublished) — which is the documented
          # "no binary found" failure mode. A committed local .exe also counts.
          # In the healthy case we skip the OCaml build entirely (the PPX is
          # never compiled by a normal framework build — see publish-ppx.yml).
          PKG_BIN="node_modules/@reventlessdev/reventless-ppx-linux-x64/ppx.exe"
          if [ -x "$PKG_BIN" ] || [ -f packages/reventless-ppx/ppx-linux.exe ]; then
            echo "Prebuilt PPX binary present ($PKG_BIN) — skipping from-source build"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Prebuilt PPX binary missing (optionalDependency skipped?) — building from source"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup OCaml (fallback — prebuilt PPX binary missing)
        if: steps.affected.outputs.select != 'none' && steps.ppx_check.outputs.present == 'false'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.x"
          dune-cache: true

      - name: Build reventless-ppx for Linux (fallback)
        if: steps.affected.outputs.select != 'none' && steps.ppx_check.outputs.present == 'false'
        run: |
          opam install . --deps-only --yes
          opam exec -- dune build
          cp _build/default/bin/bin.exe ../ppx-linux.exe
          chmod +x ../ppx-linux.exe
        working-directory: packages/reventless-ppx/src

      - name: Setup pnpm
        if: steps.affected.outputs.select != 'none'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.affected.outputs.select != 'none'
        uses: actions/setup-node@v6
        with:
          node-version: "22.17.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        if: steps.affected.outputs.select != 'none'
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        if: steps.affected.outputs.select != 'none'
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build all packages
        id: build
        if: steps.affected.outputs.select != 'none'
        run: pnpm run build

      - name: Run unit tests (all)
        if: steps.build.outcome == 'success' && steps.affected.outputs.select == 'all'
        run: pnpm run test
        env:
          CI: true

      - name: Run unit tests (affected only)
        if: steps.build.outcome == 'success' && steps.affected.outputs.select == 'some'
        run: |
          echo "Running tests for: ${{ steps.affected.outputs.projects }}"
          NODE_OPTIONS='--experimental-vm-modules --no-warnings --max-old-space-size=4096' npx jest --silent ${{ steps.affected.outputs.projects }}
        env:
          CI: true

      - name: Skip tests (no affected projects)
        if: steps.affected.outputs.select == 'none'
        run: echo "No test-mapped packages changed — skipping tests"

      - name: Run integration tests
        if: success() && steps.affected.outputs.select != 'none'
        run: pnpm run test:integration
        continue-on-error: true

      - name: Run Postgres integration tests
        if: success() && steps.affected.outputs.select != 'none'
        run: pnpm run test:integration:pg
        continue-on-error: true

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "Build & Test: ${{ needs.build-and-test.result }}"

          if [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "❌ CI pipeline failed"
            exit 1
          else
            echo "✅ CI pipeline passed"
          fi
