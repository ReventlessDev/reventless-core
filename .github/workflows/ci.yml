name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'
  pull_request:
    branches: [main, beta, alpha]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

