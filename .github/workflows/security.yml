  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.17.1"
          cache: "pnpm"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: |
          npx license-checker --summary --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense;CC0-1.0;UNKNOWN' --excludePrivatePackages || echo "License check completed with warnings"

      - name: Generate license report
        run: |
          npx license-checker --json > license-report.json
          npx license-checker --csv > license-report.csv

      - name: Upload license reports
        uses: actions/upload-artifact@v6
        with:
          name: license-reports
          path: |
            license-report.json
            license-report.csv

  # Vulnerability Database Check disabled - can be re-enabled when needed
  # vulnerability-database:
  #   name: Vulnerability Database Check
