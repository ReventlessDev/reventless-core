name: Deploy Documentation

on:
  push:
    branches: [main, beta, alpha]
    paths:
      - 'packages/doc/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Multi-Version Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.17.1"
          cache: "pnpm"

      - name: Setup D2 (remark-d2 shells out to the d2 CLI)
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.7.1
          # The installer drops the binary in ~/.local/bin (or /usr/local/bin);
          # expose ~/.local/bin to later steps and verify it resolves now.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          d2 --version

      - name: Create build directory structure
        run: mkdir -p build-output

      - name: Download existing documentation
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        run: |
          echo "🔍 Checking if GitHub Pages is enabled and has existing documentation..."
          PAGES_URL="https://docs.reventless.dev"

          # Check if GitHub Pages URL is accessible with a simple HTTP request
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PAGES_URL}/" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ GitHub Pages is enabled and accessible (HTTP $HTTP_STATUS)"
            echo "📥 Downloading existing documentation to preserve non-updated versions..."

            # Download existing documentation using wget mirror mode
            if wget --mirror --no-parent --no-host-directories \
              --directory-prefix=build-output \
              --cut-dirs=0 \
              --quiet \
              --reject="*.html.tmp" \
              --timeout=30 \
              --tries=3 \
              "${PAGES_URL}/" 2>&1; then

              # Clean up wget artifacts
              rm -f build-output/robots.txt* 2>/dev/null || true

              echo "✓ Successfully downloaded existing documentation"
              echo "📊 Current documentation structure:"
              du -sh build-output/* 2>/dev/null || echo "  (empty)"
            else
              echo "⚠️  wget failed, but continuing with fresh build"
            fi
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "ℹ️  GitHub Pages not yet published (HTTP 404)"
            echo "   This is normal for first deployment - building from scratch"
          elif [ "$HTTP_STATUS" = "000" ]; then
            echo "⚠️  Could not connect to GitHub Pages URL"
            echo "   GitHub Pages might not be enabled yet - building from scratch"
            echo "   💡 Enable it at: https://github.com/${{ github.repository }}/settings/pages"
          else
            echo "⚠️  Unexpected HTTP status: $HTTP_STATUS"
            echo "   Building from scratch anyway"
          fi

          # Ensure build-output directory exists regardless of download outcome
          mkdir -p build-output
          echo "✅ Ready to build documentation"

      - name: Determine branches to build
        id: branches
        run: |
          # Determine which branches to build
          # On workflow_dispatch, build all versions
          # On push, build only the current branch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Building all versions (manual trigger)"
            BUILD_ALL=true
          else
            echo "Building only changed branch: ${{ github.ref_name }}"
            BUILD_ALL=false
          fi

          # Check which branches exist
          MAIN_EXISTS=false
          BETA_EXISTS=false
          ALPHA_EXISTS=false

          if git show-ref --verify --quiet refs/remotes/origin/main; then
            MAIN_EXISTS=true
            echo "✓ main branch exists"
          else
            echo "✗ main branch does not exist"
          fi

          if git show-ref --verify --quiet refs/remotes/origin/beta; then
            BETA_EXISTS=true
            echo "✓ beta branch exists"
          else
            echo "✗ beta branch does not exist"
          fi

          if git show-ref --verify --quiet refs/remotes/origin/alpha; then
            ALPHA_EXISTS=true
            echo "✓ alpha branch exists"
          else
            echo "✗ alpha branch does not exist"
          fi

          # Determine what to build
          if [ "$BUILD_ALL" = "true" ]; then
            echo "build_main=$MAIN_EXISTS" >> $GITHUB_OUTPUT
            echo "build_beta=$BETA_EXISTS" >> $GITHUB_OUTPUT
            echo "build_alpha=$ALPHA_EXISTS" >> $GITHUB_OUTPUT
          else
            # Only build the current branch
            if [ "${{ github.ref_name }}" = "main" ] && [ "$MAIN_EXISTS" = "true" ]; then
              echo "build_main=true" >> $GITHUB_OUTPUT
            else
              echo "build_main=false" >> $GITHUB_OUTPUT
            fi

            if [ "${{ github.ref_name }}" = "beta" ] && [ "$BETA_EXISTS" = "true" ]; then
              echo "build_beta=true" >> $GITHUB_OUTPUT
            else
              echo "build_beta=false" >> $GITHUB_OUTPUT
            fi

            if [ "${{ github.ref_name }}" = "alpha" ] && [ "$ALPHA_EXISTS" = "true" ]; then
              echo "build_alpha=true" >> $GITHUB_OUTPUT
            else
              echo "build_alpha=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Build Main (Latest) Documentation
        if: steps.branches.outputs.build_main == 'true'
        run: |
          echo "Building main documentation..."
          git checkout main
          cd packages/doc
          # Wipe node_modules left over from a previous branch's build in this
          # same job: main uses npm + Docusaurus 3.5.2, alpha uses pnpm + 3.9.2.
          # A stale nested node_modules shadows the current branch's version and
          # trips Docusaurus's "all @docusaurus/* must match core" check.
          rm -rf node_modules ../../node_modules
          if [ -f ../../pnpm-lock.yaml ]; then
            node ../../scripts/workspace-setup.mjs
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
          cat > version-config.js << 'EOF'
          module.exports = {
            version: 'latest',
            label: 'Latest (Main)',
            banner: 'none'
          };
          EOF
          if [ -f ../../pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi
          cd ../..
          cp -r packages/doc/build/* build-output/

      - name: Build Beta Documentation
        if: steps.branches.outputs.build_beta == 'true'
        run: |
          echo "Building beta documentation..."
          git checkout beta
          cd packages/doc
          # Wipe node_modules left over from a previous branch's build in this
          # same job: main uses npm + Docusaurus 3.5.2, alpha uses pnpm + 3.9.2.
          # A stale nested node_modules shadows the current branch's version and
          # trips Docusaurus's "all @docusaurus/* must match core" check.
          rm -rf node_modules ../../node_modules
          if [ -f ../../pnpm-lock.yaml ]; then
            node ../../scripts/workspace-setup.mjs
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

          # Update config for beta version
          sed -i 's|baseUrl: "/",|baseUrl: "/beta/",|g' docusaurus.config.js

          cat > version-config.js << 'EOF'
          module.exports = {
            version: 'beta',
            label: 'Beta',
            banner: 'unreleased'
          };
          EOF
          if [ -f ../../pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi
          cd ../..
          mkdir -p build-output/beta
          cp -r packages/doc/build/* build-output/beta/

      - name: Build Alpha Documentation
        if: steps.branches.outputs.build_alpha == 'true'
        run: |
          echo "Building alpha documentation..."
          git checkout alpha
          cd packages/doc
          # Wipe node_modules left over from a previous branch's build in this
          # same job: main uses npm + Docusaurus 3.5.2, alpha uses pnpm + 3.9.2.
          # A stale nested node_modules shadows the current branch's version and
          # trips Docusaurus's "all @docusaurus/* must match core" check.
          rm -rf node_modules ../../node_modules
          if [ -f ../../pnpm-lock.yaml ]; then
            node ../../scripts/workspace-setup.mjs
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

          # Update config for alpha version
          sed -i 's|baseUrl: "/",|baseUrl: "/alpha/",|g' docusaurus.config.js

          cat > version-config.js << 'EOF'
          module.exports = {
            version: 'alpha',
            label: 'Alpha',
            banner: 'unreleased'
          };
          EOF
          if [ -f ../../pnpm-lock.yaml ]; then
            pnpm run build
          else
            npm run build
          fi
          cd ../..
          mkdir -p build-output/alpha
          cp -r packages/doc/build/* build-output/alpha/

      - name: Generate version manifest, placeholders, and apex
        run: |
          set -euo pipefail
          BASE=""

          # A version counts as published only when REAL (non-placeholder) docs
          # are present in build-output — either freshly built this run or
          # preserved by the wget mirror. Generated placeholders/redirects carry
          # a sentinel meta tag so they are never mistaken for real docs next run.
          is_real() {
            [ -f "$1" ] && ! grep -q 'name="reventless-placeholder"' "$1"
          }

          LATEST_PUB=false; BETA_PUB=false; ALPHA_PUB=false
          [ "${{ steps.branches.outputs.build_main }}" = "true" ] && LATEST_PUB=true
          [ "${{ steps.branches.outputs.build_beta }}" = "true" ] && BETA_PUB=true
          [ "${{ steps.branches.outputs.build_alpha }}" = "true" ] && ALPHA_PUB=true
          is_real build-output/index.html       && LATEST_PUB=true
          is_real build-output/beta/index.html  && BETA_PUB=true
          is_real build-output/alpha/index.html && ALPHA_PUB=true
          echo "Published: latest=$LATEST_PUB beta=$BETA_PUB alpha=$ALPHA_PUB"

          # default = highest published in latest -> beta -> alpha precedence.
          if   [ "$LATEST_PUB" = true ]; then DEFAULT=latest; DEFAULT_PATH="$BASE/";       DEFAULT_LABEL="Latest"
          elif [ "$BETA_PUB"   = true ]; then DEFAULT=beta;   DEFAULT_PATH="$BASE/beta/";  DEFAULT_LABEL="Beta"
          elif [ "$ALPHA_PUB"  = true ]; then DEFAULT=alpha;  DEFAULT_PATH="$BASE/alpha/"; DEFAULT_LABEL="Alpha"
          else DEFAULT=latest; DEFAULT_PATH="$BASE/"; DEFAULT_LABEL="Latest"; fi
          echo "Default version: $DEFAULT ($DEFAULT_PATH)"

          # --- Manifest: single source of truth, fetched at runtime -----------
          cat > build-output/versions.json <<EOF
          {
            "default": "$DEFAULT",
            "versions": [
              { "id": "latest", "label": "Latest", "badge": "STABLE",      "path": "$BASE/",       "published": $LATEST_PUB },
              { "id": "beta",   "label": "Beta",   "badge": "PRE-RELEASE", "path": "$BASE/beta/",  "published": $BETA_PUB },
              { "id": "alpha",  "label": "Alpha",  "badge": "EXPERIMENTAL","path": "$BASE/alpha/", "published": $ALPHA_PUB }
            ]
          }
          EOF

          # --- "Not yet released" placeholders for unpublished sub-paths ------
          write_placeholder() {
          local dir="$1" label="$2"
          mkdir -p "$dir"
          cat > "$dir/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="reventless-placeholder" content="true">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>$label — not yet released | Reventless</title>
          <style>
          :root { color-scheme: light dark; }
          body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center; background: #f6f8fa; }
          .card { max-width: 520px; padding: 40px; text-align: center; background: #fff; border: 1px solid #e1e4e8; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
          .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: #6a737d; }
          h1 { margin: 20px 0 12px; font-size: 22px; color: #24292e; }
          p { color: #586069; line-height: 1.6; }
          .cta { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #1a73e8; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
          .cta:hover { background: #1557b0; }
          </style>
          </head>
          <body>
          <main class="card">
          <span class="badge">$label</span>
          <h1>This version isn't released yet</h1>
          <p>The <strong>$label</strong> documentation hasn't been published yet. It will appear here automatically once it's released.</p>
          <a class="cta" href="$DEFAULT_PATH">View the $DEFAULT_LABEL docs →</a>
          </main>
          </body>
          </html>
          EOF
          }

          [ "$BETA_PUB"  = true ] || write_placeholder build-output/beta  "Beta"
          [ "$ALPHA_PUB" = true ] || write_placeholder build-output/alpha "Alpha"

          # --- Apex/root ------------------------------------------------------
          # When the stable (latest) version is published, its real build already
          # sits at the root. Otherwise redirect the apex to the default version
          # so it is never an empty 404.
          if [ "$LATEST_PUB" != true ]; then
          cat > build-output/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="reventless-placeholder" content="true">
          <meta http-equiv="refresh" content="0; url=$DEFAULT_PATH">
          <link rel="canonical" href="$DEFAULT_PATH">
          <title>Reventless Documentation</title>
          </head>
          <body>
          <p>Redirecting to the <a href="$DEFAULT_PATH">$DEFAULT_LABEL documentation</a>…</p>
          </body>
          </html>
          EOF
          fi

          # The static versions.html chooser is retired in favour of the in-site
          # version switcher; drop any copy preserved by the wget mirror.
          rm -f build-output/versions.html

          # Custom domain: GitHub Pages (Actions deploy) reads the served domain
          # from a CNAME file in the artifact. Write it on every deploy so the
          # custom domain is never dropped.
          echo "docs.reventless.dev" > build-output/CNAME

          echo "✅ versions.json, placeholders, apex, and CNAME generated"
          ls -la build-output

      - name: Setup Pages
        id: setup-pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-output

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deployment status
        run: |
          SETUP_OUTCOME="${{ steps.setup-pages.outcome }}"
          DEPLOY_OUTCOME="${{ steps.deployment.outcome }}"

          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            echo "✅ Documentation deployed successfully!"
            echo "🌐 View at: ${{ steps.deployment.outputs.page_url }}"
          elif [ "$SETUP_OUTCOME" = "failure" ]; then
            echo "⚠️  GitHub Pages setup failed - Pages may not be enabled yet"
            echo ""
            echo "📖 This is expected for the first deployment. To enable Pages:"
            echo ""
            echo "🔧 Setup steps:"
            echo "  1. Go to: https://github.com/${{ github.repository }}/settings/pages"
            echo "  2. Under 'Build and deployment', set Source to 'GitHub Actions'"
            echo "  3. Save the settings"
            echo "  4. Re-run this workflow"
            echo ""
            echo "📦 Documentation artifact was still built and uploaded successfully."
            echo "   Once Pages is enabled, re-running this workflow will deploy it."
            exit 0
          else
            echo "❌ Deployment failed"
            echo ""
            echo "📋 Possible reasons:"
            echo "  1. GitHub Pages is not enabled in repository settings"
            echo "  2. Pages source is not set to 'GitHub Actions'"
            echo "  3. Permissions issue (check workflow permissions)"
            echo ""
            echo "🔧 To fix:"
            echo "  1. Go to: https://github.com/${{ github.repository }}/settings/pages"
            echo "  2. Under 'Build and deployment', set Source to 'GitHub Actions'"
            echo "  3. Verify workflow has 'pages: write' and 'id-token: write' permissions"
            echo "  4. Re-run this workflow"
            exit 1
          fi
