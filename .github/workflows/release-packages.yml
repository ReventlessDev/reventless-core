# Reusable workflow for versioning and publishing a Lerna workspace to npmjs.
#
# It performs, in order: install, optional PPX fallback build, `lerna changed`,
# `lerna version` (prerelease-aware, driven by the branch name), an optional
# documentation-CHANGELOG commit, a clean build, a throttled sequential publish
# in topological order, a tag/commit push and one GitHub release per new tag.
#
# Everything repository-specific is an input: the `--ignore-changes` list, the
# workspace-setup command, the build command, the PPX fallback and the
# documentation CHANGELOG. Post-release side effects (layer builds, deploys) are
# NOT part of this workflow — it reports the tags it created through the `tags`
# output and the caller dispatches whatever it needs.
#
# Callers MUST pin a tag, never a branch: this workflow publishes packages, so a
# moving ref changes release behaviour in every calling repository the moment
# this repository's branch moves.
#
# Caller example:
#   jobs:
#     release:
#       uses: ReventlessDev/reventless-core/.github/workflows/release-packages.yml@v1
#       permissions:
#         contents: write
#         packages: write
#         issues: write
#       with:
#         ref: ${{ github.ref_name }}
#       secrets:
#         NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
name: Release Packages (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch to release. `alpha`/`beta` produce prereleases with that identifier; anything else graduates to a regular release."
        required: true
        type: string
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22.17.1"
      workspace-setup:
        description: "Command run after checkout and before install (e.g. a script that generates pnpm-workspace.yaml). Skipped when empty."
        required: false
        type: string
        default: ""
      build-command:
        description: "Command producing the artifacts that get published. Runs after versioning, on a clean tree."
        required: false
        type: string
        default: "pnpm run clean && pnpm run build"
      ignore-changes:
        description: "Space-separated package directory names. Each is expanded to a `**/<name>/**` glob and passed to `lerna version` as `--ignore-changes` — changes under those directories do not by themselves cause a version bump. Pass names, not globs; the expansion happens in the workflow."
        required: false
        type: string
        default: ""
      private-packages:
        description: "Space-separated package names to skip when creating GitHub releases."
        required: false
        type: string
        default: ""
      changelog-root:
        description: "Directory under which release notes are looked up as <changelog-root>/<package>/CHANGELOG.md. A package whose CHANGELOG is not found there gets a one-line generated note instead."
        required: false
        type: string
        default: "packages"
      publish-delay-seconds:
        description: "Seconds to wait between individual `pnpm publish` calls. The delay exists because a bulk parallel publish trips npmjs' E429 rate limiter."
        required: false
        type: string
        default: "12"
      registry:
        description: "Registry to authenticate against and to query when skipping already-published versions. Where each package actually publishes is still its own `publishConfig.registry`."
        required: false
        type: string
        default: "https://registry.npmjs.org"
      token-env-var:
        description: "Name of the environment variable the caller's .npmrc expands for auth. The NPM_TOKEN secret is exported under this name for install and publish."
        required: false
        type: string
        default: "NPM_TOKEN"
      publish-access:
        description: "Value for `pnpm publish --access`. Empty omits the flag — required for a registry that only accepts restricted packages."
        required: false
        type: string
        default: "public"
      dist-tag-prereleases:
        description: "Publish prereleases under a dist-tag named after the prerelease identifier (alpha/beta) instead of letting them become `latest`."
        required: false
        type: boolean
        default: false
      doc-changelog-file:
        description: "CHANGELOG file that records documentation commits. Skipped when empty."
        required: false
        type: string
        default: ""
      doc-changelog-source:
        description: "git pathspec whose commits are recorded in doc-changelog-file (e.g. `packages/doc/**`). Required when doc-changelog-file is set."
        required: false
        type: string
        default: ""
      ppx-fallback:
        description: "Build the native OCaml PPX from source and stage it at ppx-output-path before the release build, so the build compiles with the from-source PPX rather than the published per-platform binary. This decouples a PPX source change from its optionalDependencies pin (one commit, never red). Only reventless-core needs this."
        required: false
        type: boolean
        default: false
      ppx-binary-paths:
        description: "DEPRECATED / unused. The PPX is now always built from source when ppx-fallback is set (it no longer probes for an existing binary), so this input has no effect. Kept declared so external callers that still pass it do not error."
        required: false
        type: string
        default: ""
      ppx-source-dir:
        description: "Directory holding the PPX dune project (the fallback build's working directory)."
        required: false
        type: string
        default: ""
      ppx-output-path:
        description: "Repository-relative path the fallback build copies the compiled binary to."
        required: false
        type: string
        default: ""
    secrets:
      NPM_TOKEN:
        required: true
    outputs:
      released:
        description: "`true` when packages were versioned and published, `false` when nothing had releasable changes."
        value: ${{ jobs.release.outputs.released }}
      branch:
        description: "The branch that was released."
        value: ${{ jobs.release.outputs.branch }}
      tags:
        description: "Space-separated list of the git tags created by this release (empty when nothing was released)."
        value: ${{ jobs.release.outputs.tags }}

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.changes.outputs.count != '0' }}
      branch: ${{ steps.prerelease.outputs.branch }}
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          registry-url: ${{ inputs.registry }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup workspace
        if: inputs.workspace-setup != ''
        run: ${{ inputs.workspace-setup }}

      - name: Install dependencies
        env:
          TOKEN_ENV_VAR: ${{ inputs.token-env-var }}
          RELEASE_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The caller's .npmrc decides which variable it expands; export the one
          # secret under that name rather than assuming NPM_TOKEN.
          export "${TOKEN_ENV_VAR}=${RELEASE_TOKEN}"
          pnpm install --frozen-lockfile

      # Build the PPX from source and stage it as the bin resolver's local
      # fallback, so the "Build release artifacts" step below compiles with the
      # from-source PPX rather than the published (possibly stale) per-platform
      # binary. This is what lets a PPX source change release in one commit,
      # without the optionalDependencies pin having been bumped first — the
      # previous "is the binary already present?" check found the freshly
      # installed (stale) binary and skipped this build, which is exactly how a
      # stale pin used to reach Release red. The staged .exe is gitignored, so it
      # survives the "Clean uncommitted changes" reset/clean below and reaches
      # the build. Only reventless-core sets ppx-fallback: true.
      - name: Setup reventless-ppx (from source)
        if: inputs.ppx-fallback
        uses: ./.github/actions/setup-ppx
        with:
          source-dir: ${{ inputs.ppx-source-dir }}
          output-path: ${{ inputs.ppx-output-path }}

      - name: Check for releasable changes
        id: changes
        run: |
          # `lerna changed` exits non-zero when no releasable (non-private)
          # packages changed — e.g. a commit that only touches private example
          # packages or the root lockfile. That is a valid "nothing to release"
          # outcome, not an error, so tolerate the exit code and fall through to
          # the skip branch below.
          CHANGED=$(npx lerna changed --json 2>/dev/null || true)
          if [[ -z "$CHANGED" ]]; then
            CHANGED='[]'
          fi
          COUNT=$(echo "$CHANGED" | jq 'length' 2>/dev/null || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "No packages have releasable changes — skipping release"
          else
            echo "Packages to release: $COUNT"
            echo "$CHANGED" | jq -r '.[].name'
          fi

      # No pre-version build: the caller's CI already compiled and tested this
      # commit, and any build output here would be discarded by the "Clean
      # uncommitted changes" git reset/clean below before lerna version runs.
      # The single authoritative build happens in "Build release artifacts"
      # (clean + build) just before publish.

      - name: Determine prerelease identifier
        if: steps.changes.outputs.count != '0'
        id: prerelease
        env:
          BRANCH_NAME: ${{ inputs.ref }}
        run: |
          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          if [ "$BRANCH_NAME" = "alpha" ]; then
            echo "preid=alpha" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH_NAME" = "beta" ]; then
            echo "preid=beta" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "preid=" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean uncommitted changes
        if: steps.changes.outputs.count != '0'
        run: |
          # Discard any uncommitted changes from the install/fallback steps
          # (build artifacts, generated files, deleted files, etc.)
          git status
          git reset --hard HEAD
          git clean -fd
          git status

      - name: Version packages with Lerna
        if: steps.changes.outputs.count != '0'
        timeout-minutes: 10
        env:
          HUSKY: 0
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
          PREID: ${{ steps.prerelease.outputs.preid }}
          BRANCH_NAME: ${{ steps.prerelease.outputs.branch }}
          IGNORE_CHANGES: ${{ inputs.ignore-changes }}
        run: |
          # Disable git hooks to prevent hanging in CI
          git config core.hooksPath /dev/null

          # lerna's --ignore-changes takes minimatch GLOBS matched against changed
          # file paths, not package names — and it matches with matchBase, so a
          # slash-less pattern is compared against the basename only. Passing a
          # bare package name therefore matches nothing and the flag silently does
          # nothing. Wrap each name into a path glob here (quoted, so the shell
          # does not expand it against the working tree) instead of asking every
          # caller to spell the glob correctly.
          IGNORE_ARGS=()
          for pkg in $IGNORE_CHANGES; do
            IGNORE_ARGS+=(--ignore-changes "**/$pkg/**")
          done

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Creating prerelease versions with identifier: $PREID"
            npx lerna version --conventional-commits --conventional-prerelease --preid "$PREID" --allow-branch "$BRANCH_NAME" "${IGNORE_ARGS[@]}" --force-git-tag --yes --no-push --message "chore(release): version packages [skip ci]"
          else
            echo "Creating regular release versions"
            npx lerna version --conventional-commits --conventional-graduate --allow-branch "$BRANCH_NAME" "${IGNORE_ARGS[@]}" --force-git-tag --yes --no-push --message "chore(release): version packages [skip ci]"
          fi

          echo "Lerna version completed successfully"

      - name: Update documentation CHANGELOG
        if: steps.changes.outputs.count != '0' && inputs.doc-changelog-file != ''
        env:
          CHANGELOG_FILE: ${{ inputs.doc-changelog-file }}
          DOC_SOURCE: ${{ inputs.doc-changelog-source }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Get the last commit that modified the CHANGELOG (excluding this workflow)
          LAST_CHANGELOG_COMMIT=$(git log -1 --format="%H" --skip=0 -- "$CHANGELOG_FILE" 2>/dev/null || echo "")

          # Determine the range to search
          if [ -z "$LAST_CHANGELOG_COMMIT" ]; then
            # If CHANGELOG never updated, get commits from last 30 days
            SINCE_DATE=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
            COMMIT_RANGE="--since=$SINCE_DATE"
          else
            COMMIT_RANGE="$LAST_CHANGELOG_COMMIT..HEAD"
          fi

          # Get commits affecting the documentation sources
          COMMITS=$(git log --format="%H|%s|%ad" --date=short $COMMIT_RANGE -- "$DOC_SOURCE" 2>/dev/null || echo "")

          # If no new commits, skip
          if [ -z "$COMMITS" ]; then
            echo "No new documentation changes to record"
            exit 0
          fi

          echo "Found documentation changes to record"

          # Create temporary file for new entries
          TEMP_ENTRIES=$(mktemp)

          # Process commits and group by date
          CURRENT_DATE=""
          while IFS='|' read -r hash subject date; do
            # Skip if empty line
            [ -z "$hash" ] && continue

            # Add date header if new date
            if [ "$date" != "$CURRENT_DATE" ]; then
              if [ -n "$CURRENT_DATE" ]; then
                echo "" >> "$TEMP_ENTRIES"
              fi
              echo "### $date" >> "$TEMP_ENTRIES"
              CURRENT_DATE="$date"
            fi

            # Format entry with commit link (truncate hash to 7 chars)
            SHORT_HASH="${hash:0:7}"
            echo "- $subject ([$SHORT_HASH](https://github.com/$GITHUB_REPO/commit/$hash))" >> "$TEMP_ENTRIES"
          done <<< "$COMMITS"

          # Insert new entries into CHANGELOG after "## Changes" header
          TEMP_CHANGELOG=$(mktemp)

          awk -v new_entries_file="$TEMP_ENTRIES" '
            /^## Changes$/ {
              print $0
              print ""
              while ((getline line < new_entries_file) > 0) {
                print line
              }
              close(new_entries_file)
              # Skip the next empty line if it exists
              getline
              if ($0 != "") {
                print $0
              }
              next
            }
            {print}
          ' "$CHANGELOG_FILE" > "$TEMP_CHANGELOG"

          # Replace original file
          mv "$TEMP_CHANGELOG" "$CHANGELOG_FILE"
          rm -f "$TEMP_ENTRIES"

          # Stage the changes
          git add "$CHANGELOG_FILE"

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit to CHANGELOG"
          else
            git commit -m "docs: update documentation CHANGELOG" -m "[skip ci]"
            echo "Documentation CHANGELOG updated successfully"
          fi

      - name: Build release artifacts
        if: steps.changes.outputs.count != '0'
        run: ${{ inputs.build-command }}

      - name: Restore deleted dev sources
        if: steps.changes.outputs.count != '0'
        run: |
          # A `rescript clean` deletes compiled test files (dev sources) that are
          # checked into git, and a root build does not regenerate them. Restore
          # them before publishing, which requires a clean working tree.
          git checkout -- .

      - name: Publish to npmjs (throttled, sequential, stop on first error)
        if: steps.changes.outputs.count != '0'
        env:
          TOKEN_ENV_VAR: ${{ inputs.token-env-var }}
          RELEASE_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_DELAY_SECONDS: ${{ inputs.publish-delay-seconds }}
          REGISTRY: ${{ inputs.registry }}
          PUBLISH_ACCESS: ${{ inputs.publish-access }}
          DIST_TAG_PRERELEASES: ${{ inputs.dist-tag-prereleases }}
          PREID: ${{ steps.prerelease.outputs.preid }}
        run: |
          set -euo pipefail
          export "${TOKEN_ENV_VAR}=${RELEASE_TOKEN}"

          # if-blocks, not `test && cmd`: under `set -e` a false test makes the
          # whole statement non-zero and aborts the step.
          PUBLISH_ARGS=(--no-git-checks)
          if [ -n "$PUBLISH_ACCESS" ]; then
            PUBLISH_ARGS+=(--access "$PUBLISH_ACCESS")
          fi
          # A prerelease that becomes `latest` is what makes a bare `npm install`
          # resolve a prerelease; a dist-tag keeps `latest` for graduated releases.
          if [ "$DIST_TAG_PRERELEASES" = "true" ] && [ -n "$PREID" ]; then
            PUBLISH_ARGS+=(--tag "$PREID")
          fi
          echo "publish args: ${PUBLISH_ARGS[*]}"
          # Publish one package at a time in dependency (topological) order with
          # a delay between each, instead of lerna's parallel `publish
          # from-package`. The bulk parallel publish previously tripped npmjs'
          # E429 publish rate limiter during the first-time scope publish.
          #
          #   * topo order  -> every workspace dependency is already on the
          #                    registry before its dependents publish, so pnpm's
          #                    `workspace:*` -> exact-version rewrite resolves.
          #   * pnpm publish -> rewrites the `workspace:*` protocol (lerna does
          #                    not understand it on its own).
          #   * set -e + loop in the foreground -> first failed publish aborts
          #                    the whole step (no silent partial release).
          #   * already-on-registry versions are skipped (idempotent re-runs).
          npx lerna list --toposort --json --no-private \
            | jq -r '.[] | "\(.name)\t\(.version)\t\(.location)"' \
            | while IFS=$'\t' read -r name version location; do
                if npm view "$name@$version" version \
                     --registry="$REGISTRY" >/dev/null 2>&1; then
                  echo "skip    $name@$version (already on registry)"
                  continue
                fi
                echo "publish $name@$version"
                ( cd "$location" && pnpm publish "${PUBLISH_ARGS[@]}" )
                echo "waiting ${PUBLISH_DELAY_SECONDS}s before next publish"
                sleep "$PUBLISH_DELAY_SECONDS"
              done

      - name: Push version tags and commits
        if: steps.changes.outputs.count != '0'
        env:
          BRANCH_NAME: ${{ steps.prerelease.outputs.branch }}
        run: |
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH_NAME" && \
            git push --follow-tags origin "$BRANCH_NAME" && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "All push attempts failed"
          exit 1

      - name: Collect released tags
        if: steps.changes.outputs.count != '0'
        id: tags
        run: |
          # Tag names never contain whitespace, so a space-separated list
          # survives the trip through a job output intact.
          echo "list=$(git tag --points-at HEAD | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub releases
        if: steps.changes.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
          BRANCH_NAME: ${{ steps.prerelease.outputs.branch }}
          NEW_TAGS: ${{ steps.tags.outputs.list }}
          PRIVATE_PACKAGES: ${{ inputs.private-packages }}
          CHANGELOG_ROOT: ${{ inputs.changelog-root }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          for tag in $NEW_TAGS; do
            # Extract package name and version from tag
            # Tags are in format: @scope/package-name@version or package-name@version
            package_name=$(echo "$tag" | sed 's/^@[^/]*\///' | sed 's/@.*//')
            version=$(echo "$tag" | sed 's/.*@//')

            skip=false
            for private in $PRIVATE_PACKAGES; do
              if [ "$package_name" = "$private" ]; then
                echo "Skipping private package: $package_name"
                skip=true
                break
              fi
            done
            [ "$skip" = true ] && continue

            echo "Creating release for $package_name@$version"

            # Generate release notes from the changelog when one is found under
            # changelog-root. Packages living elsewhere in the workspace get the
            # generated one-liner instead.
            if [ -f "$CHANGELOG_ROOT/$package_name/CHANGELOG.md" ]; then
              # Extract the latest changelog entry
              CHANGELOG_ENTRY=$(awk '/^## / {if (found) exit; found=1; next} found' "$CHANGELOG_ROOT/$package_name/CHANGELOG.md")

              # Create release notes with changelog link (using printf for proper formatting)
              RELEASE_NOTES=$(printf '%s\n\n**Changelog**: https://github.com/%s/blob/%s/%s/%s/CHANGELOG.md' "$CHANGELOG_ENTRY" "$REPOSITORY" "$BRANCH_NAME" "$CHANGELOG_ROOT" "$package_name")
            else
              RELEASE_NOTES="Release $version of $package_name"
            fi

            # Create GitHub release
            gh release create "$tag" \
              --title "$package_name v$version" \
              --notes "$RELEASE_NOTES" \
              $PRERELEASE_FLAG || echo "Release already exists or failed for $tag"
          done
