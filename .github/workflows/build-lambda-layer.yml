name: Build Lambda Layer

# Registered with the GitHub Actions index so release.yml can dispatch it via
# `gh workflow run build-lambda-layer.yml` (the API resolves filenames through
# that index, not the git tree).
#
# NOTE (2026-06-17): this file existed in git but was never indexed by GitHub
# Actions, so `gh workflow run` returned 404 and release.yml's layer-build step
# failed. A push that modifies the workflow file forces (re-)indexing — keep that
# in mind if it ever drops out of the index again.

on:
  push:
    branches: [main, beta, alpha]
    paths:
      - "reventless/layer-builder/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version of @reventlessdev/reventless-aws to build the layer for"
        required: true
        type: string

concurrency:
  group: build-lambda-layer
  cancel-in-progress: false

jobs:
  build-layer:
    name: Build and Publish Lambda Layer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      actions: write
    strategy:
      matrix:
        region: [eu-west-1]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.17.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Extract version from tag: @reventlessdev/reventless-aws@1.2.3 -> 1.2.3
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG##*@}"
          else
            # Path-triggered build: read current version from package.json
            VERSION=$(node -p "require('./reventless/aws/package.json').version")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building layer for @reventlessdev/reventless-aws@$VERSION"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build layer
        working-directory: reventless/layer-builder
        run: pnpm run build
        env:
          REVENTLESS_AWS_VERSION: ${{ steps.version.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify artifact
        working-directory: reventless/layer-builder/builder
        run: |
          if [ ! -f reventless-layer.zip ]; then
            echo "Error: reventless-layer.zip not found"
            exit 1
          fi
          SIZE=$(stat --printf="%s" reventless-layer.zip 2>/dev/null || stat -f%z reventless-layer.zip)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Layer zip size: ${SIZE_MB}MB (${SIZE} bytes)"
          if [ "$SIZE_MB" -gt 40 ]; then
            echo "Warning: Layer size exceeds 40MB (approaching 50MB Lambda limit)"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_LAYER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_LAYER_SECRET_ACCESS_KEY }}
          aws-region: ${{ matrix.region }}

      - name: Determine layer name and SSM parameter
        id: layer
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            main)  LAYER_NAME="reventless-aws";       STACK="main"  ;;
            beta)  LAYER_NAME="reventless-aws-beta";  STACK="beta"  ;;
            alpha) LAYER_NAME="reventless-aws-alpha"; STACK="alpha" ;;
            *)     LAYER_NAME="reventless-aws-alpha"; STACK="alpha" ;;
          esac
          echo "name=$LAYER_NAME" >> $GITHUB_OUTPUT
          echo "stack=$STACK" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH → layer: $LAYER_NAME → SSM: /reventless/layer-arn/$STACK"

      - name: Publish Lambda layer
        id: publish
        run: |
          LAYER_VERSION=$(aws lambda publish-layer-version \
            --layer-name ${{ steps.layer.outputs.name }} \
            --description "${{ steps.layer.outputs.name }} v${{ steps.version.outputs.version }}" \
            --zip-file fileb://reventless/layer-builder/builder/reventless-layer.zip \
            --compatible-runtimes nodejs20.x nodejs22.x \
            --query 'LayerVersionArn' \
            --output text)
          echo "layer_arn=$LAYER_VERSION" >> $GITHUB_OUTPUT
          echo "Published layer: $LAYER_VERSION"

      - name: Store layer ARN in SSM Parameter Store
        run: |
          # Per-account deploy state lives in AWS, not the repo. The deploy
          # workflow reads this parameter back into REVENTLESS_LAYER_ARN.
          # Parameters are regional — written here in ${{ matrix.region }},
          # read by the deploy job using the manifest's region.
          aws ssm put-parameter \
            --name "/reventless/layer-arn/${{ steps.layer.outputs.stack }}" \
            --type String --overwrite \
            --value "${{ steps.publish.outputs.layer_arn }}"
          echo "Stored /reventless/layer-arn/${{ steps.layer.outputs.stack }} = ${{ steps.publish.outputs.layer_arn }}"

      - name: Dispatch deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Dispatching Deploy Online Shop Hybrid on branch $BRANCH"
          gh workflow run deploy-online-shop-hybrid.yml --ref "$BRANCH"

      - name: Upload zip as release asset and append layer ARN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          LAYER_ARN="${{ steps.publish.outputs.layer_arn }}"
          REGION="${{ matrix.region }}"

          # Determine the release tag to attach to.
          # For tag/dispatch triggers, use the exact version. For path-triggered
          # builds, find the latest @reventlessdev/reventless-aws release tag.
          if [[ "$GITHUB_REF" == refs/tags/* ]] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="@reventlessdev/reventless-aws@${VERSION}"
          else
            TAG=$(gh release list --limit 50 \
              --json tagName --jq '[.[].tagName | select(startswith("@reventlessdev/reventless-aws@"))][0]')
            if [ -z "$TAG" ]; then
              echo "No existing reventless-aws release found — skipping asset upload"
              exit 0
            fi
            echo "Path-triggered build — attaching to latest release: $TAG"
          fi

          # Upload zip as release asset
          gh release upload "$TAG" \
            reventless/layer-builder/builder/reventless-layer.zip#"reventless-layer-${REGION}.zip" \
            --clobber || echo "Could not upload release asset (release may not exist yet)"

          # Append layer ARN to release notes
          EXISTING_NOTES=$(gh release view "$TAG" --json body -q .body 2>/dev/null || echo "")
          NEW_NOTES=$(printf '%s\n\n**Lambda Layer ARN (%s):** `%s`' "$EXISTING_NOTES" "$REGION" "$LAYER_ARN")
          gh release edit "$TAG" --notes "$NEW_NOTES" || echo "Could not update release notes"
