name: Publish Reventless PPX

# Build-once-per-version workflow for the native reventless-ppx binaries.
# (Renamed from build-ppx.yml on 2026-05-26 to bypass a GitHub-side workflow-level
# "disruptive" flag on the old file that was blocking dispatch with HTTP 500.)
#
# Triggered ONLY by changes to the PPX *source* (or manual dispatch) — never by a
# normal framework build. Every other CI job and every developer consumes the
# published, version-pinned package from the registry cache and never compiles
# the PPX.
#
# Publishing model (esbuild/swc style): each platform binary ships as its own
# package @reventlessdev/reventless-ppx-<platform> with os/cpu fields; the thin
# main @reventlessdev/reventless-ppx declares them as optionalDependencies, so a
# consumer installs only the matching one.
#
# Each platform's runner publishes its own per-platform package directly — no
# upload/download-artifact round-trip — so the workflow doesn't depend on the
# org's Actions artifact storage. The main (thin) package is published in a
# small follow-up job after all platforms succeed.
#
# Current matrix: linux-x64 + darwin-arm64. darwin-x64 (Intel macOS) is OUT of CI
# on purpose and published manually from a maintainer's Intel Mac via
# `node scripts/publish-ppx-local.mjs darwin-x64` (see the matrix note below).
# Any platform without a prebuilt falls back to the launcher's local build
# (`pnpm run setup` / `pnpm build:ppx`).
#
# Versioning: the `preflight` job RESOLVES the version — it reads main's, checks it
# against every package in the release (main + all per-platform), and steps forward
# until it finds one free on all of them. A forgotten bump therefore costs nothing,
# and a version half-claimed by an earlier partial publish is stepped over rather
# than reused. The `pin` job commits the resolved version back. Recovery from a
# partial publish is always forward: a published tarball cannot be replaced, so
# completing a half-published version would ship whatever binaries it already has.
# The per-platform scaffolds' versions are generated from the resolved one, so the
# two can never desync (see the cutover runbook in
# docs/plans/prebuilt-binaries-out-of-repo.md). Bump only the main package.
#
# The main package's optionalDependencies pin is what lets EXTERNAL consumers
# install the new binary. It is NOT a prerequisite for keeping this repo green:
# CI, Release, and the example deploys build the PPX from source (via
# .github/actions/setup-ppx) and never resolve the published binary, so a PPX
# source change ships in one commit. The `pin` job automates the pin bump +
# relock after publishing. See docs/plans/done/ppx-republish-single-commit.md.

on:
  push:
    branches: [main, beta, alpha]
    paths:
      - "packages/reventless-ppx/src/**"
      # The manifest too: a change here (a version set by hand, a dependency) is
      # a release of this package, and leaving it out is what let a lone version
      # bump publish nothing at all.
      - "packages/reventless-ppx/package.json"
  pull_request:
    branches: [main, beta, alpha]
    paths:
      - "packages/reventless-ppx/src/**"
      - "packages/reventless-ppx/package.json"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the per-platform + main packages to GitHub Packages"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Choose a version the whole release can publish under, rather than failing on
  # one it cannot. The resolver checks main AND every per-platform package, and
  # steps forward until it finds one free on all of them; the `pin` job commits
  # the result back, so git catches up without a human in the loop.
  #
  # This replaces a hard gate that checked main only. Two failures came out of
  # that: a forgotten bump cost a second push, and a version whose per-platform
  # binaries existed while main did not passed the gate — then either 409'd or,
  # worse, kept the stale binaries and published a main pointing at them.
  #
  # Recovery from a partial publish is always FORWARD, never by completing the
  # half-published version: its binaries are already on the registry and cannot
  # be replaced, so completing it ships whatever they happen to contain.
  preflight:
    runs-on: ubuntu-latest
    name: Preflight (resolve a publishable version)
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve a publishable version
        id: v
        run: |
          VERSION=$(node scripts/resolve-ppx-version.mjs --explain)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "reventless-ppx will publish as: $VERSION"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-22.04 (glibc 2.35) so the published binary runs on
          # older glibc consumers (Debian Bookworm 2.36, Ubuntu 22.04, Amazon Linux
          # 2/2023, …). `ubuntu-latest` (24.04, glibc 2.39) floors users at GLIBC
          # 2.38 and excludes most non-bleeding-edge distros.
          - os: ubuntu-22.04 # linux x64
            target: linux-x64
          - os: macos-14 # arm64 (Apple Silicon)
            target: darwin-arm64
          # darwin-x64 (Intel macOS) is deliberately OUT of this matrix — Intel is
          # a sunsetting target and the macos-13 runner queue starved out our
          # 2026-05-27 dispatch. Instead it is published MANUALLY from an Intel-Mac
          # maintainer whenever the PPX source changes, keeping the version in
          # lockstep with the CI-built packages:
          #   node scripts/publish-ppx-local.mjs darwin-x64
          #   # (or: pnpm --filter @reventlessdev/reventless-ppx run publish:platform)
          # The package is NOT in the main package's optionalDependencies while its
          # CI publish is suspended — pinning a platform CI does not publish would
          # install nothing (optional deps fail silently) and surface as
          # "no binary found", so the `pin` job below leaves it out on purpose.
          # Intel consumers therefore fall back to the launcher's local build, the
          # same path as any platform without a prebuilt: `pnpm run setup` /
          # `pnpm build:ppx`. Re-adding it to optionalDependencies is only correct
          # together with restoring its publish.
    runs-on: ${{ matrix.os }}
    name: Build & publish (${{ matrix.target }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes
        working-directory: packages/reventless-ppx/src

      - name: Build binary
        run: opam exec -- dune build
        working-directory: packages/reventless-ppx/src

      - name: Stage binary into platform package
        run: |
          cp packages/reventless-ppx/src/_build/default/bin/bin.exe \
             packages/reventless-ppx/npm/${{ matrix.target }}/ppx.exe
          chmod +x packages/reventless-ppx/npm/${{ matrix.target }}/ppx.exe

      - name: Setup Node.js (for publish)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          registry-url: "https://registry.npmjs.org"

      - name: Sync per-platform version from main
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Generate the scaffold's version from main immediately before publish
          # so the two can never disagree. lerna bumps only the main package
          # (npm/* is not a workspace member — packages/* is one level deep), so
          # without this the scaffolds drift a version behind after every release.
          cd "packages/reventless-ppx/npm/${{ matrix.target }}"
          npm pkg set version="$VERSION"
          echo "Set ${{ matrix.target }} version to $VERSION"

      - name: Publish per-platform package
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Every error is fatal, the version conflict included. Preflight resolved
          # a version free on every package in this release, so a conflict here
          # means the registry changed under the run — someone published by hand,
          # or two runs raced. Tolerating it used to look harmless and was not: it
          # LEFT THE EXISTING BINARY IN PLACE and let the run publish a main
          # pointing at it, which is how a stale ppx ships under a fresh version.
          # Fail, and let the next run resolve forward.
          set +e
          out=$(cd "packages/reventless-ppx/npm/${{ matrix.target }}" && npm publish --access public 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            if echo "$out" | grep -qiE "cannot publish over|previously published|cannot modify pre-existing version|EPUBLISHCONFLICT"; then
              echo "::error::${{ matrix.target }}@$VERSION already exists — the registry moved after preflight resolved it. Re-run; the resolver will step past it. Do NOT republish over it."
            else
              echo "::error::publish of ${{ matrix.target }} FAILED — see npm error above"
            fi
            exit $code
          fi

  test:
    runs-on: ubuntu-latest
    name: Test PPX
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # Must be NPM_TOKEN (not NODE_AUTH_TOKEN): the project .npmrc references
          # ${NPM_TOKEN}. When that env var is undefined, pnpm discards the entire
          # .npmrc — dropping node-linker=hoisted and falling back to the isolated
          # linker. That un-hoists `sury` from the root node_modules, so the PPX
          # test's temp packages (which symlink to root node_modules) fail
          # rescript's upward traversal: "did not find 'sury'".
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes
        working-directory: packages/reventless-ppx/src

      - name: Run PPX tests
        # `opam exec --` puts the switch (incl. dune) on PATH for the shell
        # script invoked by `npm test` (./test/run.sh calls `dune` directly).
        #
        # Point the fixtures at the FROM-SOURCE binary run.sh builds, not the
        # launcher-resolved installed (pinned, stale) one. Otherwise this job
        # compiles the current spec fixtures with the previously published binary
        # and goes red on any PPX change that adds a new assertion — which is how
        # the Test PPX job used to gate PPX source changes behind a republish.
        # Testing source keeps this job green in the same commit; the drift-guard
        # job separately validates the published artifact.
        run: opam exec -- npm test
        working-directory: packages/reventless-ppx
        env:
          REVENTLESS_PPX_BIN: ${{ github.workspace }}/packages/reventless-ppx/src/_build/default/bin/bin.exe

  # Publish the thin main package after all per-platform builds succeed.
  # Independent of the `test` job so a flaky test doesn't strand a successful
  # per-platform publish without a matching main release.
  publish-main:
    needs: build
    runs-on: ubuntu-latest
    name: Publish main package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          registry-url: "https://registry.npmjs.org"

      - name: Publish main (thin) package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # Set the resolved version rather than publishing whatever the checked-out
          # manifest says. Preflight may have stepped past a claimed version, and the
          # per-platform packages were published under the resolved one — a main that
          # published under the manifest's version would name a different release than
          # its own binaries. This is the exact disagreement that produced a main
          # published at .69 while the platforms went out as .70.
          cd packages/reventless-ppx
          npm pkg set version="$VERSION"
          set +e
          out=$(npm publish --access public 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            echo "::error::publish of main@$VERSION FAILED — see npm error above"
            exit $code
          fi

  # Drift guard: the build job validated the SOURCE (it compiled from source);
  # this validates the PUBLISHED artifact. In-repo builds no longer resolve the
  # published binary (they build from source), so nothing else would notice if the
  # tarball shipped a stale or mis-staged binary. Fetch the just-published
  # linux-x64 package and run the maintained PPX suite through it: if it drifted
  # from source, the suite's assertions (which track source) fail here. This is
  # what buys back the published-artifact validation that building from source
  # everywhere gave up.
  drift-guard:
    name: Drift guard (published binary matches source)
    needs: [preflight, build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        # run.sh's temp fixtures resolve sury / sury-ppx / reventless-spec through
        # the (hoisted) root node_modules. NPM_TOKEN must be set or pnpm discards
        # the .npmrc and un-hoists sury (same reason as the Test PPX job).
        run: pnpm install --frozen-lockfile
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Fetch the just-published linux-x64 binary
        id: fetch
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg="@reventlessdev/reventless-ppx-linux-x64@${VERSION}"
          ok=false
          for i in 1 2 3 4 5; do
            if npm pack "$pkg" --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP"; then ok=true; break; fi
            echo "npm pack $pkg failed (registry may still be propagating) — retrying in 15s"
            sleep 15
          done
          if [ "$ok" != true ]; then echo "::error::could not fetch $pkg after retries"; exit 1; fi
          tar -xzf "$RUNNER_TEMP"/reventlessdev-reventless-ppx-linux-x64-*.tgz -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/package/ppx.exe"
          chmod +x "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - name: Run the PPX suite against the published binary
        # REVENTLESS_PPX_BIN points the fixtures at the published binary;
        # REVENTLESS_PPX_SKIP_SELF_BUILD skips run.sh's source dune build (no OCaml
        # here — we are testing the artifact, not the source).
        env:
          REVENTLESS_PPX_BIN: ${{ steps.fetch.outputs.bin }}
          REVENTLESS_PPX_SKIP_SELF_BUILD: "1"
        run: ./test/run.sh
        working-directory: packages/reventless-ppx

  # Automate the previously-manual second commit. Once the new per-platform
  # binaries and the main package are on the registry, bump main's
  # optionalDependencies pin to the new version and relock, so EXTERNAL consumers
  # (who install the published binary) resolve the fresh one. In-repo builds no
  # longer need this — they build the PPX from source (see
  # docs/plans/done/ppx-republish-single-commit.md) — so this is pure housekeeping;
  # automating it removes the leftover human step that used to trail every PPX
  # source change (e.g. commit 2e8d076fd, done by hand).
  #
  # Loop-safe: the commit touches only packages/reventless-ppx/package.json +
  # pnpm-lock.yaml (never src/**, so it cannot re-trigger this workflow) and
  # carries [skip ci]; a GITHUB_TOKEN push does not trigger workflows anyway.
  pin:
    name: Pin optionalDependencies to the published version
    needs: [preflight, build, publish-main, drift-guard]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump optionalDependencies pin and relock
        id: bump
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          # Must be NPM_TOKEN (not NODE_AUTH_TOKEN): the project .npmrc expands
          # ${NPM_TOKEN}; when it is undefined pnpm discards the whole .npmrc and
          # drops node-linker=hoisted, changing lockfile resolution.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Rewrite every @reventlessdev/reventless-ppx-* optionalDependency to
          # ^$VERSION (only those already listed — darwin-x64 is intentionally
          # absent while its CI publish is suspended).
          node -e '
            const fs = require("fs");
            const p = "packages/reventless-ppx/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            const want = "^" + process.env.VERSION;
            // The version too, not just the pin: preflight may have resolved past
            // a claimed version, and if git never learns the published number the
            // next run starts from a stale one and resolves forward again.
            j.version = process.env.VERSION;
            for (const k of Object.keys(j.optionalDependencies || {})) {
              if (k.startsWith("@reventlessdev/reventless-ppx-")) j.optionalDependencies[k] = want;
            }
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          '
          # Relock so --frozen-lockfile consumers resolve the new pin. Retry to
          # ride out registry propagation of the just-published packages.
          ok=false
          for i in 1 2 3 4 5; do
            if pnpm install --lockfile-only --no-frozen-lockfile; then ok=true; break; fi
            echo "relock attempt $i failed (registry may still be propagating) — retrying in 15s"
            sleep 15
          done
          if [ "$ok" != true ]; then echo "::error::relock failed after retries"; exit 1; fi

          if git diff --quiet -- packages/reventless-ppx/package.json pnpm-lock.yaml; then
            echo "Pin already at ^$VERSION — nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the pin
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          SHORT="${VERSION#*-}"   # 1.0.0-alpha.64 -> alpha.64
          git add packages/reventless-ppx/package.json pnpm-lock.yaml
          git commit -m "chore(ppx): record ${SHORT} as published and pin its binaries" -m "[skip ci]"
          # Rebase-retry in case another [skip ci] commit (e.g. lerna version) landed.
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "push attempt $i failed, retrying…"
            sleep 5
          done
          echo "::error::failed to push the pin commit"
          exit 1
