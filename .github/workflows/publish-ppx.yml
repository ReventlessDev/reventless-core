name: Publish Reventless PPX

# Build-once-per-version workflow for the native reventless-ppx binaries.
# (Renamed from build-ppx.yml on 2026-05-26 to bypass a GitHub-side workflow-level
# "disruptive" flag on the old file that was blocking dispatch with HTTP 500.)
#
# Triggered ONLY by changes to the PPX *source* (or manual dispatch) — never by a
# normal framework build. Every other CI job and every developer consumes the
# published, version-pinned package from the registry cache and never compiles
# the PPX.
#
# Publishing model (esbuild/swc style): each platform binary ships as its own
# package @reventlessdev/reventless-ppx-<platform> with os/cpu fields; the thin
# main @reventlessdev/reventless-ppx declares them as optionalDependencies, so a
# consumer installs only the matching one.
#
# Each platform's runner publishes its own per-platform package directly — no
# upload/download-artifact round-trip — so the workflow doesn't depend on the
# org's Actions artifact storage. The main (thin) package is published in a
# small follow-up job after all platforms succeed.
#
# Current matrix: linux-x64 ONLY. The two macOS targets (darwin-arm64 / darwin-x64)
# are commented out to (a) keep us off paid macOS minutes while the org's CI
# posture stabilises after the disruptive flag, and (b) avoid the unvalidated
# arm64 opam build path on a first run. Re-enable when ready — see the matrix
# entries below. Until then, macOS consumers get no per-platform package and
# fall back to the launcher's local build (`pnpm build:ppx`).
#
# PREREQUISITE before a publish run: the per-platform package.json files AND the
# main package.json must already carry the SAME (lockstep) version, and the main
# package.json must declare the optionalDependencies (see the cutover runbook in
# docs/plans/prebuilt-binaries-out-of-repo.md). Publishing an existing version is
# a no-op (the registry rejects it), so bump deliberately.

on:
  push:
    branches: [main, beta, alpha]
    paths:
      - "packages/reventless-ppx/src/**"
  pull_request:
    branches: [main, beta, alpha]
    paths:
      - "packages/reventless-ppx/src/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the per-platform + main packages to GitHub Packages"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to ubuntu-22.04 (glibc 2.35) so the published binary runs on
          # older glibc consumers (Debian Bookworm 2.36, Ubuntu 22.04, Amazon Linux
          # 2/2023, …). `ubuntu-latest` (24.04, glibc 2.39) floors users at GLIBC
          # 2.38 and excludes most non-bleeding-edge distros.
          - os: ubuntu-22.04 # linux x64
            target: linux-x64
          - os: macos-14 # arm64 (Apple Silicon)
            target: darwin-arm64
          - os: macos-13 # x64 (Intel) — sunsetting GitHub runner
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    name: Build & publish (${{ matrix.target }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes
        working-directory: packages/reventless-ppx/src

      - name: Build binary
        run: opam exec -- dune build
        working-directory: packages/reventless-ppx/src

      - name: Stage binary into platform package
        run: |
          cp packages/reventless-ppx/src/_build/default/bin/bin.exe \
             packages/reventless-ppx/npm/${{ matrix.target }}/ppx.exe
          chmod +x packages/reventless-ppx/npm/${{ matrix.target }}/ppx.exe

      - name: Setup Node.js (for publish)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish per-platform package
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ( cd "packages/reventless-ppx/npm/${{ matrix.target }}" && npm publish ) \
            || echo "::warning::publish of ${{ matrix.target }} skipped (version may already exist)"

  test:
    runs-on: ubuntu-latest
    name: Test PPX
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --yes
        working-directory: packages/reventless-ppx/src

      - name: Run PPX tests
        # `opam exec --` puts the switch (incl. dune) on PATH for the shell
        # script invoked by `npm test` (./test/run.sh calls `dune` directly).
        run: opam exec -- npm test
        working-directory: packages/reventless-ppx

  # Publish the thin main package after all per-platform builds succeed.
  # Independent of the `test` job so a flaky test doesn't strand a successful
  # per-platform publish without a matching main release.
  publish-main:
    needs: build
    runs-on: ubuntu-latest
    name: Publish main package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish main (thin) package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ( cd packages/reventless-ppx && npm publish ) \
            || echo "::warning::publish of main skipped (version may already exist)"
