# Reusable workflow for deploying Reventless applications with per-plugin Pulumi stacks.
#
# Secrets resolution (per-plugin override with platform-wide fallback):
#   - PULUMI_ACCESS_TOKEN passed here is the platform-wide default.
#   - To use a different token for a specific plugin, create a GitHub environment
#     named "deploy-<plugin>" (e.g. "deploy-catalog") and add a PULUMI_ACCESS_TOKEN
#     secret to that environment. It will override the workflow-level default.
#   - Same override mechanism works for the platform job via the "deploy-platform" environment.
#   - AWS credentials follow the same pattern.
#
# Caller example:
#   jobs:
#     deploy:
#       uses: ReventlessDev/reventless-core/.github/workflows/deploy-reventless-aws.yml@main
#       with:
#         manifest: deploy-manifest.yaml
#       secrets:
#         PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
#         AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
#         AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
name: Deploy Reventless (AWS)

on:
  workflow_call:
    inputs:
      manifest:
        description: "Path to deploy-manifest.yaml"
        required: true
        type: string
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      layer-arn:
        description: "Lambda Layer ARN (overrides the SSM /reventless/layer-arn/{stack} lookup)"
        required: false
        type: string
        default: ""
      host-ui-base-domain:
        description: "Base domain for the host-UI shell (e.g. app.reventless.dev). When set together with host-ui-hosted-zone-id, the framework provisions an ACM cert + Route53 alias and serves the shell at https://<derived-fqdn>. When unset, the default *.cloudfront.net URL is retained."
        required: false
        type: string
        default: ""
      host-ui-hosted-zone-id:
        description: "Route53 hosted zone ID for host-ui-base-domain (e.g. Z01234…). Required when host-ui-base-domain is set."
        required: false
        type: string
        default: ""
      host-ui-prod-stacks:
        description: "Comma-separated stack names treated as production for FQDN derivation (no stack suffix). Defaults to 'prod,main'."
        required: false
        type: string
        default: ""
      pulumi-concurrent-updates:
        description: "Whether the Pulumi backend tolerates more than one update in flight. Leave false for a Pulumi Cloud individual account, whose one-update limit is per ACCOUNT, not per stack. Set true for a Pulumi organization or a self-managed (S3/DIY) backend."
        required: false
        type: boolean
        default: false
      build-ppx-from-source:
        description: "Build the reventless-ppx binary from source (via .github/actions/setup-ppx) before the deploy build, so annotated spec sources compile with the from-source PPX instead of the published per-platform binary. Only reventless-core's own example deploys set this — their checkout contains packages/reventless-ppx/src. External callers deploying their own platform must leave it false (they have no PPX source and consume the published binary)."
        required: false
        type: boolean
        default: false
      elevated-groups:
        description: >
          Comma-separated groups exempt from owner scoping, e.g. "Admin". Read by
          the deploy program when it bakes the owner predicate into generated
          resolvers, and copied onto every Lambda so command stamping and
          SQL-backed reads — which run in runtimes the deploy never enters —
          reach the same answer. Leave empty and nothing is exempt: operators see
          only their own rows, and an operator acting on someone's behalf has the
          row stamped with their own id. Only deployments whose domain declares an
          owner field need it.
        required: false
        type: string
        default: ""
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      # Optional. When set, Platform_Stack uses the existing UserPool
      # instead of auto-provisioning one. Forwarded to deploy jobs as
      # REVENTLESS_COGNITO_USER_POOL_ID (read by Util_LocalConfig).
      COGNITO_USER_POOL_ID:
        required: false
      # Optional. Only needs to be DEFINED so the repo .npmrc's ${NPM_TOKEN}
      # reference expands and `node-linker=hoisted` is honoured; the install
      # itself is anonymous (all deps are public on npmjs).
      NPM_TOKEN:
        required: false

# A Pulumi Cloud *individual* account permits one running update per ACCOUNT —
# the "Individual user accounts do not support concurrent updates" 409 names
# whichever stack currently holds the slot, even one this run never referenced.
# So the lock has to be account-wide, not ref-wide: an `alpha` deploy and a
# `pr-verify` deploy touch disjoint stacks and still collide. Backends that do
# lock per stack (Pulumi organization, self-managed S3/DIY) opt back into the
# ref-scoped group via `pulumi-concurrent-updates: true`.
concurrency:
  group: ${{ inputs.pulumi-concurrent-updates && format('deploy-{0}', github.ref) || 'deploy-pulumi-account' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Detect which plugins changed and parse the manifest
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      platform-changed: ${{ steps.changes.outputs.platform-changed }}
      changed-plugins: ${{ steps.changes.outputs.changed-plugins }}
      all-plugins: ${{ steps.changes.outputs.all-plugins }}
      branch: ${{ steps.branch.outputs.name }}
      skip-deploy: ${{ steps.skip.outputs.skip }}
      region: ${{ steps.changes.outputs.region }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branch name
        id: branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, use the target branch for stack name (preview against target env)
            BRANCH="${{ github.base_ref }}"
          else
            # For push events, extract branch from ref
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Branch: ${BRANCH}"

      - name: Check for skip deploy
        id: skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qi '\[skip deploy\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment: [skip deploy] found in commit message"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse manifest and detect changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MANIFEST="${{ inputs.manifest }}"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::Manifest not found: $MANIFEST"
            exit 1
          fi

          # Manifest paths are relative to the manifest file. Derive the parent
          # directory so we can build repo-root-relative paths for git diff matching
          # and Pulumi --cwd.
          MANIFEST_DIR=$(dirname "$MANIFEST")
          if [[ "$MANIFEST_DIR" == "." ]]; then
            MANIFEST_DIR=""
          else
            MANIFEST_DIR="${MANIFEST_DIR}/"
          fi
          echo "Manifest dir: ${MANIFEST_DIR:-(repo root)}"

          # Determine the base commit for diffing.
          # For PRs: diff against the PR base.
          # For everything else (push, workflow_dispatch): diff against the SHA
          # of the last successful run of the *caller* workflow on this branch.
          # GitHub already records which SHA each run deployed, so no repo state
          # (and no commit-back) is needed. Requires `actions: read` permission
          # from the calling workflow.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            # github.workflow_ref → owner/repo/.github/workflows/FILE.yml@refs/heads/BRANCH
            WORKFLOW_REF="${{ github.workflow_ref }}"
            WORKFLOW_FILE="${WORKFLOW_REF%@*}"   # strip @ref
            WORKFLOW_FILE="${WORKFLOW_FILE##*/}" # basename → FILE.yml
            BASE_SHA=$(gh run list --repo "${{ github.repository }}" \
              --workflow "$WORKFLOW_FILE" --branch "${{ steps.branch.outputs.name }}" \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""' 2>/dev/null || echo "")
            # Verify the commit exists in history (it may have been force-pushed away)
            if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
              echo "::warning::No prior successful run of $WORKFLOW_FILE on ${{ steps.branch.outputs.name }} — deploying everything"
              BASE_SHA=$(git rev-list --max-parents=0 HEAD)
            fi
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: ${{ github.sha }}"

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Install yq for YAML parsing
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Parse region from manifest (optional, defaults to empty)
          REGION=$(yq '.region // ""' "$MANIFEST")
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "Region: ${REGION:-(not set)}"

          # Parse platform path from manifest and resolve to repo-root-relative
          PLATFORM_REL=$(yq '.platform.path' "$MANIFEST")
          PLATFORM_PATH="${MANIFEST_DIR}${PLATFORM_REL}"
          echo "Platform path: $PLATFORM_PATH"

          # Check if platform changed (any file under platform path)
          # Use <<< to avoid broken pipe with pipefail when CHANGED_FILES is large
          PLATFORM_CHANGED="false"
          if grep -q "^${PLATFORM_PATH}" <<< "$CHANGED_FILES"; then
            PLATFORM_CHANGED="true"
          fi
          # Also trigger platform deploy if framework packages changed
          if grep -qE "^reventless/|^rescript/" <<< "$CHANGED_FILES"; then
            PLATFORM_CHANGED="true"
          fi
          echo "Platform changed: $PLATFORM_CHANGED"

          # Parse plugins from manifest
          PLUGIN_COUNT=$(yq '.plugins | length' "$MANIFEST")
          ALL_PLUGINS="[]"
          CHANGED_PLUGINS="[]"

          for ((i = 0; i < PLUGIN_COUNT; i++)); do
            PLUGIN_NAME=$(yq ".plugins[$i].name" "$MANIFEST")
            PLUGIN_REL=$(yq ".plugins[$i].path" "$MANIFEST")
            PLUGIN_PATH="${MANIFEST_DIR}${PLUGIN_REL}"
            PLUGIN_DEPS=$(yq -o=json ".plugins[$i].depends-on // []" "$MANIFEST")

            # Build all-plugins entry (store resolved path for --cwd)
            ALL_PLUGINS=$(echo "$ALL_PLUGINS" | jq \
              --arg name "$PLUGIN_NAME" \
              --arg path "$PLUGIN_PATH" \
              --argjson deps "$PLUGIN_DEPS" \
              '. + [{"name": $name, "path": $path, "depends-on": $deps}]')

            # Check if this plugin changed
            PLUGIN_CHANGED="false"
            if grep -q "^${PLUGIN_PATH}" <<< "$CHANGED_FILES"; then
              PLUGIN_CHANGED="true"
            fi
            # Also trigger plugin deploy if framework packages changed
            if grep -qE "^reventless/|^rescript/" <<< "$CHANGED_FILES"; then
              PLUGIN_CHANGED="true"
            fi

            if [[ "$PLUGIN_CHANGED" == "true" ]]; then
              CHANGED_PLUGINS=$(echo "$CHANGED_PLUGINS" | jq \
                --arg name "$PLUGIN_NAME" \
                '. + [$name]')
            fi
          done

          echo "All plugins: $ALL_PLUGINS"
          echo "Changed plugins: $CHANGED_PLUGINS"

          echo "platform-changed=${PLATFORM_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "changed-plugins=$(echo "$CHANGED_PLUGINS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "all-plugins=$(echo "$ALL_PLUGINS" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: Deploy the platform stack (shared resources)
  # ---------------------------------------------------------------------------
  deploy-platform:
    name: Deploy Platform
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.skip-deploy != 'true' &&
      needs.detect-changes.outputs.platform-changed == 'true'
    environment: deploy-platform
    env:
      # Environment "deploy-platform" secrets override these defaults if set.
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ needs.detect-changes.outputs.region }}
      # The groups exempt from owner scoping. The deploy program reads it when it
      # bakes the owner predicate into generated resolvers; the same value is
      # copied onto every Lambda it provisions, because stamping and SQL-backed
      # reads run in runtimes this process never enters and would otherwise
      # conclude that nobody is elevated.
      REVENTLESS_ELEVATED_GROUPS: ${{ inputs.elevated-groups }}
      # Defines NPM_TOKEN for every pnpm step. The repo .npmrc references
      # ${NPM_TOKEN} on its npmjs authToken line; if the var is undefined pnpm
      # fails to parse the whole file and silently drops `node-linker=hoisted`,
      # falling back to isolated linking. That leaves @pulumi/* unhoisted and
      # unreachable from the deploy program -> "Pulumi SDK has not been
      # installed". Install itself stays anonymous (all deps are public), so an
      # empty value is fine — it just has to be defined.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Read by Util_LocalConfig (Platform_Stack.resolveCognitoUserPool).
      # Unset/empty → falls through to Pulumi.local.yaml then Pulumi
      # stack config; if still unset, auto-provisions a fresh UserPool.
      REVENTLESS_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      # Read by Util_LocalConfig (Platform.deployPlatform). When both base
      # domain and hosted-zone ID are set the framework provisions an ACM
      # cert + Route53 alias for the host-UI shell. Unset → cloudfront.net
      # default URL is retained.
      REVENTLESS_HOST_UI_BASE_DOMAIN: ${{ inputs.host-ui-base-domain }}
      REVENTLESS_HOST_UI_HOSTED_ZONE_ID: ${{ inputs.host-ui-hosted-zone-id }}
      REVENTLESS_HOST_UI_PROD_STACKS: ${{ inputs.host-ui-prod-stacks }}
      # TEMPORARY escape hatch (read by Util_LocalConfig → Util_LogRetention).
      # Keeps `alpha` on Lambda/AppSync auto-created log groups instead of
      # Pulumi-managed ones, so the deploy does not race the live stack's
      # heartbeats recreating groups → CreateLogGroup ResourceAlreadyExists.
      # Remove at the deliberate managed-log-group cutover (a local `pulumi up`
      # right after deleting alpha's groups) — see
      # docs/plans/env-tiered-log-retention-and-levels.md Step 8.
      REVENTLESS_UNMANAGED_LOG_GROUP_STACKS: alpha
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Lambda Layer ARN
        run: |
          # Input takes precedence, then the per-stack SSM parameter, then empty
          # (no layer). SSM parameters are regional — read using AWS_REGION (the
          # manifest region), matching where build-lambda-layer.yml wrote it.
          ARN="${{ inputs.layer-arn }}"
          if [[ -z "$ARN" ]]; then
            BRANCH="${{ needs.detect-changes.outputs.branch }}"
            case "$BRANCH" in
              main)  STACK="main"  ;;
              beta)  STACK="beta"  ;;
              alpha) STACK="alpha" ;;
              *)     STACK="alpha" ;;
            esac
            ARN=$(aws ssm get-parameter --name "/reventless/layer-arn/${STACK}" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
          fi
          echo "REVENTLESS_LAYER_ARN=${ARN}" >> "$GITHUB_ENV"
          echo "Layer ARN: ${ARN:-(none)}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        # All @reventlessdev/* deps (and the host-shell tarball) are public on
        # npmjs — anonymous install, no auth token needed.
        run: pnpm install --frozen-lockfile

      # Build the PPX from source and stage it as the bin resolver's local
      # fallback, so the deploy compiles annotated spec sources with the
      # from-source PPX rather than the published (possibly stale) per-platform
      # binary. Without this a PPX source change that added a required field
      # deployed red until the per-platform republish + pin landed (observed on
      # the 2026-08-09 @live republish). Gitignored .exe, ~1 min on a warm cache.
      - name: Setup reventless-ppx (from source)
        if: inputs.build-ppx-from-source
        uses: ./.github/actions/setup-ppx

      - name: Build
        run: pnpm run build

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          # Pinned to the last version that deployed cleanly (Jun 2026). The CLI
          # version is NOT the root cause of the nodejs-provider load failures
          # (3.247.0 reproduces them); pinning is just hygiene to stop
          # setup-pulumi silently floating to newer releases.
          pulumi-version: 3.247.0

      - name: Resolve platform path
        id: platform
        run: |
          MANIFEST="${{ inputs.manifest }}"
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 2>/dev/null || true
          sudo chmod +x /usr/local/bin/yq 2>/dev/null || true
          MANIFEST_DIR=$(dirname "$MANIFEST")
          [[ "$MANIFEST_DIR" == "." ]] && MANIFEST_DIR="" || MANIFEST_DIR="${MANIFEST_DIR}/"
          PLATFORM_REL=$(yq '.platform.path' "$MANIFEST")
          echo "path=${MANIFEST_DIR}${PLATFORM_REL}" >> "$GITHUB_OUTPUT"

      - name: Check stack config exists
        id: check-config
        run: |
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          DEPLOY_DIR="${{ steps.platform.outputs.path }}"
          CONFIG_FILE="${DEPLOY_DIR}/Pulumi.${BRANCH}.yaml"
          if [[ -f "$CONFIG_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Stack config found: $CONFIG_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No stack config at $CONFIG_FILE — skipping platform deployment"
          fi

      - name: Pulumi preview (PR)
        if: |
          github.event_name == 'pull_request' &&
          steps.check-config.outputs.exists == 'true'
        run: |
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          DEPLOY_DIR="${{ steps.platform.outputs.path }}"
          pulumi stack select --create "$BRANCH" --cwd "$DEPLOY_DIR" --non-interactive
          pulumi refresh --stack "$BRANCH" --cwd "$DEPLOY_DIR" --yes --skip-preview --non-interactive
          pulumi preview --stack "$BRANCH" --cwd "$DEPLOY_DIR" --non-interactive

      - name: Pulumi up (push)
        if: |
          github.event_name != 'pull_request' &&
          steps.check-config.outputs.exists == 'true'
        run: |
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          DEPLOY_DIR="${{ steps.platform.outputs.path }}"
          pulumi stack select --create "$BRANCH" --cwd "$DEPLOY_DIR" --non-interactive
          # Surgical recovery for interrupted deploys: cancel any stale lock,
          # selectively clear known-safe pending-creates (e.g. ACM
          # CertificateValidation timing out at 1h15m), then refresh. Fails
          # loud on unknown pending-creates rather than silently orphaning
          # AWS resources the way the prior unconditional
          # `--clear-pending-creates` flag did.
          python3 "${{ github.workspace }}/.github/scripts/clear-safe-pending-creates.py" \
            --stack "$BRANCH" --cwd "$DEPLOY_DIR"
          pulumi up --stack "$BRANCH" --yes --skip-preview --cwd "$DEPLOY_DIR" --non-interactive

      # EventBridge allows 300 rules per bus. The plugin disconnect mechanism
      # creates one per connected plugin, so a broken delete leaks silently
      # until PutRule starts failing. Reported, never enforced: a deploy must
      # not fail over rule count. Runs on the platform job only — rules are
      # account-wide, so the plugin matrix would just repeat this N times.
      - name: Report EventBridge rule count
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/eventbridge-rules.mjs

  # ---------------------------------------------------------------------------
  # Job 3: Deploy changed plugins (matrix, respecting depends-on ordering)
  # ---------------------------------------------------------------------------
  deploy-plugins:
    name: Deploy Plugin (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-platform]
    # Run even if deploy-platform was skipped (platform didn't change)
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.deploy-platform.result == 'success' || needs.deploy-platform.result == 'skipped') &&
      needs.detect-changes.outputs.skip-deploy != 'true' &&
      needs.detect-changes.outputs.changed-plugins != '[]'
    environment: deploy-${{ matrix.plugin }}
    strategy:
      fail-fast: false
      # Each plugin owns a distinct stack, so the matrix is safe to fan out —
      # but only if the backend locks per stack. Against a Pulumi Cloud
      # individual account the second job 409s on the first job's stack (see
      # the workflow-level `concurrency` comment), so the default is serial.
      max-parallel: ${{ inputs.pulumi-concurrent-updates && 4 || 1 }}
      matrix:
        plugin: ${{ fromJson(needs.detect-changes.outputs.changed-plugins) }}
    env:
      # Environment "deploy-<plugin>" secrets override these defaults if set.
      # E.g. "deploy-catalog" can have its own PULUMI_ACCESS_TOKEN.
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ needs.detect-changes.outputs.region }}
      # The groups exempt from owner scoping. The deploy program reads it when it
      # bakes the owner predicate into generated resolvers; the same value is
      # copied onto every Lambda it provisions, because stamping and SQL-backed
      # reads run in runtimes this process never enters and would otherwise
      # conclude that nobody is elevated.
      REVENTLESS_ELEVATED_GROUPS: ${{ inputs.elevated-groups }}
      # Defines NPM_TOKEN for every pnpm step. The repo .npmrc references
      # ${NPM_TOKEN} on its npmjs authToken line; if the var is undefined pnpm
      # fails to parse the whole file and silently drops `node-linker=hoisted`,
      # falling back to isolated linking. That leaves @pulumi/* unhoisted and
      # unreachable from the deploy program -> "Pulumi SDK has not been
      # installed". Install itself stays anonymous (all deps are public), so an
      # empty value is fine — it just has to be defined.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Forwarded for plugin stacks that wire AppSync auth themselves.
      # Unset/empty → falls through to local sidecar / stack config.
      REVENTLESS_COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      # Per-plugin UI bundles read the same host-UI domain config to derive
      # their own subdomain (once per-plugin SPAs ship). Forwarded here so
      # plugin stacks see the same values the platform job sees.
      REVENTLESS_HOST_UI_BASE_DOMAIN: ${{ inputs.host-ui-base-domain }}
      REVENTLESS_HOST_UI_HOSTED_ZONE_ID: ${{ inputs.host-ui-hosted-zone-id }}
      REVENTLESS_HOST_UI_PROD_STACKS: ${{ inputs.host-ui-prod-stacks }}
      # TEMPORARY escape hatch (read by Util_LocalConfig → Util_LogRetention).
      # Keeps `alpha` on Lambda/AppSync auto-created log groups instead of
      # Pulumi-managed ones, so the deploy does not race the live stack's
      # heartbeats recreating groups → CreateLogGroup ResourceAlreadyExists.
      # Remove at the deliberate managed-log-group cutover (a local `pulumi up`
      # right after deleting alpha's groups) — see
      # docs/plans/env-tiered-log-retention-and-levels.md Step 8.
      REVENTLESS_UNMANAGED_LOG_GROUP_STACKS: alpha
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Lambda Layer ARN
        run: |
          # Input takes precedence, then the per-stack SSM parameter, then empty
          # (no layer). SSM parameters are regional — read using AWS_REGION (the
          # manifest region), matching where build-lambda-layer.yml wrote it.
          ARN="${{ inputs.layer-arn }}"
          if [[ -z "$ARN" ]]; then
            BRANCH="${{ needs.detect-changes.outputs.branch }}"
            case "$BRANCH" in
              main)  STACK="main"  ;;
              beta)  STACK="beta"  ;;
              alpha) STACK="alpha" ;;
              *)     STACK="alpha" ;;
            esac
            ARN=$(aws ssm get-parameter --name "/reventless/layer-arn/${STACK}" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
          fi
          echo "REVENTLESS_LAYER_ARN=${ARN}" >> "$GITHUB_ENV"
          echo "Layer ARN: ${ARN:-(none)}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        run: node scripts/workspace-setup.mjs

      - name: Install dependencies
        # All @reventlessdev/* deps (and the host-shell tarball) are public on
        # npmjs — anonymous install, no auth token needed.
        run: pnpm install --frozen-lockfile

      # Build the PPX from source and stage it as the bin resolver's local
      # fallback, so the deploy compiles annotated spec sources with the
      # from-source PPX rather than the published (possibly stale) per-platform
      # binary. Without this a PPX source change that added a required field
      # deployed red until the per-platform republish + pin landed (observed on
      # the 2026-08-09 @live republish). Gitignored .exe, ~1 min on a warm cache.
      - name: Setup reventless-ppx (from source)
        if: inputs.build-ppx-from-source
        uses: ./.github/actions/setup-ppx

      - name: Build
        run: pnpm run build

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          # Pinned to the last version that deployed cleanly (Jun 2026). The CLI
          # version is NOT the root cause of the nodejs-provider load failures
          # (3.247.0 reproduces them); pinning is just hygiene to stop
          # setup-pulumi silently floating to newer releases.
          pulumi-version: 3.247.0

      - name: Resolve plugin path
        id: plugin
        run: |
          MANIFEST="${{ inputs.manifest }}"
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 2>/dev/null || true
          sudo chmod +x /usr/local/bin/yq 2>/dev/null || true
          MANIFEST_DIR=$(dirname "$MANIFEST")
          [[ "$MANIFEST_DIR" == "." ]] && MANIFEST_DIR="" || MANIFEST_DIR="${MANIFEST_DIR}/"
          PLUGIN_REL=$(yq '.plugins[] | select(.name == "${{ matrix.plugin }}") | .path' "$MANIFEST")
          PLUGIN_DEPS=$(yq -o=json '.plugins[] | select(.name == "${{ matrix.plugin }}") | .depends-on // []' "$MANIFEST")
          echo "path=${MANIFEST_DIR}${PLUGIN_REL}" >> "$GITHUB_OUTPUT"
          echo "deps=${PLUGIN_DEPS}" >> "$GITHUB_OUTPUT"

      - name: Wait for dependencies
        if: steps.plugin.outputs.deps != '[]'
        run: |
          echo "Plugin ${{ matrix.plugin }} depends on: ${{ steps.plugin.outputs.deps }}"
          echo "Dependencies are satisfied by deploy-platform completing first."
          echo "Cross-plugin ordering within a single matrix run is handled by"
          echo "Pulumi stack references at deploy time (eventual consistency)."
          #
          # Note: For strict ordering where plugin B must deploy AFTER plugin A,
          # callers should split into separate workflow_call invocations or use
          # the depends-on field to inform a future orchestration enhancement.

      - name: Check stack config exists
        id: check-config
        run: |
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          DEPLOY_DIR="${{ steps.plugin.outputs.path }}"
          CONFIG_FILE="${DEPLOY_DIR}/Pulumi.${BRANCH}.yaml"
          if [[ -f "$CONFIG_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Stack config found: $CONFIG_FILE"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No stack config at $CONFIG_FILE — skipping ${{ matrix.plugin }} deployment"
          fi

      - name: Pulumi preview (PR)
        id: preview
        if: |
          github.event_name == 'pull_request' &&
          steps.check-config.outputs.exists == 'true'
        run: |
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          DEPLOY_DIR="${{ steps.plugin.outputs.path }}"
          pulumi stack select --create "$BRANCH" --cwd "$DEPLOY_DIR" --non-interactive
          pulumi refresh --stack "$BRANCH" --cwd "$DEPLOY_DIR" --yes --skip-preview --non-interactive
          OUTPUT=$(pulumi preview --stack "$BRANCH" --cwd "$DEPLOY_DIR" --non-interactive 2>&1) || true
          echo "$OUTPUT"
          # Save output for PR comment
          {
            echo "preview<<PREVIEW_EOF"
            echo "$OUTPUT"
            echo "PREVIEW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment with preview
        if: |
          github.event_name == 'pull_request' &&
          steps.check-config.outputs.exists == 'true' &&
          steps.preview.outputs.preview != ''
        uses: actions/github-script@v7
        with:
          script: |
            const plugin = '${{ matrix.plugin }}';
            const preview = `${{ steps.preview.outputs.preview }}`;
            const body = [
              `### Pulumi Preview: \`${plugin}\``,
              '',
              '<details>',
              '<summary>Preview output</summary>',
              '',
              '```',
              preview,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Pulumi up (push)
        if: |
          github.event_name != 'pull_request' &&
          steps.check-config.outputs.exists == 'true'
        run: |
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          DEPLOY_DIR="${{ steps.plugin.outputs.path }}"
          pulumi stack select --create "$BRANCH" --cwd "$DEPLOY_DIR" --non-interactive
          # Surgical recovery for interrupted deploys — same as deploy-platform
          # above. See .github/scripts/clear-safe-pending-creates.py for
          # rationale and the maintainable list of known-safe synthetic types.
          python3 "${{ github.workspace }}/.github/scripts/clear-safe-pending-creates.py" \
            --stack "$BRANCH" --cwd "$DEPLOY_DIR"
          pulumi up --stack "$BRANCH" --yes --skip-preview --cwd "$DEPLOY_DIR" --non-interactive

  # ---------------------------------------------------------------------------
  # Job 4: Bake the component manifest (after every plugin stack is up)
  # ---------------------------------------------------------------------------
  # The manifest describes the WHOLE deployment — which plugins exist and which
  # of their components this shop offers — so no single stack's deploy is the
  # moment it is settled. It is baked here, once, after the matrix.
  #
  # It exists so a shell serving a non-elevated audience can discover its
  # surfaces at all: `Platform_ComponentDefinitions` is Admin-gated, so a shopper
  # fails discovery before any individual view's authorization is consulted. The
  # platform writes `manifestUrl` into config.json when it declares a bake; this
  # step is what puts a file at the other end of it.
  #
  # A deployment that declares no bake has no `bakedManifestFunction` output and
  # this job no-ops — the same "absent is inert" contract the declaration has
  # everywhere else.
  bake-manifest:
    name: Bake component manifest
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-platform, deploy-plugins]
    # Runs when either half deployed (or was skipped as unchanged), never on a
    # PR, and never after a failure — baking off a half-deployed platform would
    # publish a shop missing whatever did not land.
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.skip-deploy != 'true' &&
      needs.deploy-platform.result != 'failure' &&
      needs.deploy-plugins.result != 'failure'
    environment: deploy-platform
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ needs.detect-changes.outputs.region }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: 3.247.0

      # Only the stack's outputs are read — `pulumi stack output` queries the
      # backend and never runs the deploy program, so this job needs no install
      # and no build.
      - name: Resolve platform path
        id: platform
        run: |
          MANIFEST="${{ inputs.manifest }}"
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 2>/dev/null || true
          sudo chmod +x /usr/local/bin/yq 2>/dev/null || true
          MANIFEST_DIR=$(dirname "$MANIFEST")
          [[ "$MANIFEST_DIR" == "." ]] && MANIFEST_DIR="" || MANIFEST_DIR="${MANIFEST_DIR}/"
          PLATFORM_REL=$(yq '.platform.path' "$MANIFEST")
          echo "path=${MANIFEST_DIR}${PLATFORM_REL}" >> "$GITHUB_OUTPUT"

      - name: Bake
        env:
          ALL_PLUGINS: ${{ needs.detect-changes.outputs.all-plugins }}
        run: |
          set -euo pipefail
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          DEPLOY_DIR="${{ steps.platform.outputs.path }}"

          if [[ ! -f "${DEPLOY_DIR}/Pulumi.${BRANCH}.yaml" ]]; then
            echo "No stack config for ${BRANCH} — nothing deployed, nothing to bake."
            exit 0
          fi

          pulumi stack select "$BRANCH" --cwd "$DEPLOY_DIR" --non-interactive
          OUTPUTS=$(pulumi stack output --json --cwd "$DEPLOY_DIR" --non-interactive)

          FN=$(echo "$OUTPUTS" | jq -r '.bakedManifestFunction // ""')
          BUCKET=$(echo "$OUTPUTS" | jq -r '.bakedManifestBucket // ""')
          KEY=$(echo "$OUTPUTS" | jq -r '.bakedManifestKey // ""')

          if [[ -z "$FN" || -z "$BUCKET" ]]; then
            echo "This platform declares no baked manifest — skipping."
            exit 0
          fi

          # The structure each plugin stack wrote during this deploy. The Plugin
          # read model the bake scans is updated asynchronously — the stack
          # publishes a re-detect, the plugin answers with its definition, the
          # projection lands — so a bake invoked the moment the last stack finishes
          # can still describe the deploy before this one, and nothing downstream
          # can tell: it is a well-formed manifest of the wrong deployment. Each
          # stack exports the key it wrote, and the handler bakes only once every
          # row matches. A plugin that was not redeployed matches immediately, and
          # a stack deployed before this output existed exports nothing and is not
          # waited for.
          EXPECT='{}'
          while read -r PLUGIN_DIR; do
            [[ -f "${PLUGIN_DIR}/Pulumi.${BRANCH}.yaml" ]] || continue
            pulumi stack select "$BRANCH" --cwd "$PLUGIN_DIR" --non-interactive
            REF=$(pulumi stack output --json --cwd "$PLUGIN_DIR" --non-interactive \
              | jq -c '.pluginStructureRef // empty')
            [[ -n "$REF" ]] || continue
            EXPECT=$(jq -c --argjson ref "$REF" '. + {($ref.plugin): $ref.key}' <<< "$EXPECT")
          done < <(jq -r '.[].path' <<< "$ALL_PLUGINS")
          echo "Expecting: $EXPECT"

          echo "Baking ${BUCKET}/${KEY} via ${FN}"
          PAYLOAD=$(jq -nc --arg b "$BUCKET" --arg k "$KEY" --argjson e "$EXPECT" \
            '{bake: true, bucket: $b, key: $k, expect: $e}')

          # Registration lands within seconds of the stack that triggered it, so
          # the first attempt is the normal case — the retries are for a slow
          # projection, not a broken one, which is why running out of them is an
          # error rather than a shrug.
          PENDING=""
          for attempt in $(seq 1 20); do
            aws lambda invoke \
              --function-name "$FN" \
              --cli-binary-format raw-in-base64-out \
              --payload "$PAYLOAD" \
              --cli-read-timeout 60 \
              response.json > invoke.json

            cat response.json

            # A handler that threw still returns 200 with FunctionError set, so the
            # status code alone would report a bake that wrote nothing as success.
            if jq -e '.FunctionError' invoke.json > /dev/null; then
              echo "::error::Baking the component manifest failed — see the payload above."
              exit 1
            fi

            if ! jq -e '.[0].baked == false' response.json > /dev/null; then
              exit 0
            fi

            PENDING=$(jq -r '.[0].pending | join(", ")' response.json)
            echo "Attempt ${attempt}: registration has not caught up yet — ${PENDING}"
            sleep 15
          done

          echo "::error::Registration never caught up with this deploy (${PENDING}); the manifest would describe the previous one, so nothing was written."
          exit 1

  # The change-detection base SHA is derived from the last successful run of the
  # caller workflow (see the "Parse manifest and detect changes" step), so no
  # deploy state is committed back to the repo.
