# Reusable workflow for deploying Reventless applications with per-plugin Pulumi stacks.
#
# Pulumi state lives on Pulumi Cloud (pass PULUMI_ACCESS_TOKEN) or in a
# self-managed backend (set the pulumi-backend-url input, and usually
# pulumi-secrets-provider and pulumi-concurrent-updates; no token).
#
# Secrets resolution (per-plugin override with platform-wide fallback):
#   - PULUMI_ACCESS_TOKEN passed here is the platform-wide default.
#   - To use a different token for a specific plugin, create a GitHub environment
#     named "deploy-<plugin>" (e.g. "deploy-catalog") and add a PULUMI_ACCESS_TOKEN
#     secret to that environment. It will override the workflow-level default.
#   - Same override mechanism works for the platform job via the "deploy-platform" environment.
#   - AWS credentials follow the same pattern.
#
# Caller example:
#   jobs:
#     deploy:
#       uses: ReventlessDev/reventless-core/.github/workflows/deploy-reventless-aws.yml@main
#       with:
#         manifest: deploy-manifest.yaml
#       secrets:
#         PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
#         AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
#         AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
name: Deploy Reventless (AWS)

on:
  workflow_call:
    inputs:
      manifest:
        description: "Path to deploy-manifest.yaml"
        required: true
        type: string
      environments:
        description: >
          Path to the app's environments.yaml, which says which branch, tags or pull
          requests feed which environment and stack. Defaults to environments.yaml
          beside the manifest. Without the file every branch deploys to the stack of
          its own name and a pull request gets a dry run, as before.
        required: false
        type: string
        default: ""
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      layer-arn:
        description: "Lambda Layer ARN (overrides the SSM /reventless/layer-arn/{stack} lookup)"
        required: false
        type: string
        default: ""
      host-ui-base-domain:
        description: "Base domain for the host-UI shell (e.g. app.reventless.dev). When set together with host-ui-hosted-zone-id, the framework provisions an ACM cert + Route53 alias and serves the shell at https://<derived-fqdn>. When unset, the default *.cloudfront.net URL is retained."
        required: false
        type: string
        default: ""
      host-ui-hosted-zone-id:
        description: "Route53 hosted zone ID for host-ui-base-domain (e.g. Z01234…). Required when host-ui-base-domain is set."
        required: false
        type: string
        default: ""
      host-ui-prod-stacks:
        description: "Comma-separated stack names treated as production for FQDN derivation (no stack suffix). Defaults to 'prod,main'."
        required: false
        type: string
        default: ""
      host-ui-base-name:
        description: "Leading label of the derived host-UI FQDN. Defaults to the Pulumi project name. Set it when another stack in the same estate already publishes the name the project would derive — an alias belongs to one distribution, so the collision fails the deploy rather than picking a winner."
        required: false
        type: string
        default: ""
      pulumi-backend-url:
        description: >
          The self-managed backend the app's Pulumi state lives in, e.g.
          s3://my-app-pulumi-state?region=eu-west-1. Exported as PULUMI_BACKEND_URL
          in every job that runs Pulumi, and no PULUMI_ACCESS_TOKEN is then needed.
          Leave empty for Pulumi Cloud. Set pulumi-concurrent-updates too.
        required: false
        type: string
        default: ""
      pulumi-secrets-provider:
        description: >
          The secrets provider a stack this workflow creates is given (a review
          stack, or an environment deployed for the first time), e.g.
          awskms://alias/my-app-pulumi?region=eu-west-1. "{stack}" is replaced by
          the stack's name, and for a review stack by its base environment's stack,
          so one key per environment works. Leave empty for Pulumi's default, which
          on a self-managed backend is a passphrase this workflow does not have.
          Stacks that already exist keep the provider they have.
        required: false
        type: string
        default: ""
      pulumi-concurrent-updates:
        description: "Whether the Pulumi backend tolerates more than one update in flight. Leave false for a Pulumi Cloud individual account, whose one-update limit is per ACCOUNT, not per stack. Set true for a Pulumi organization or a self-managed (S3/DIY) backend."
        required: false
        type: boolean
        default: false
      build-ppx-from-source:
        description: "Build the reventless-ppx binary from source (via .github/actions/setup-ppx) before the deploy build, so annotated spec sources compile with the from-source PPX instead of the published per-platform binary. Only reventless-core's own example deploys set this — their checkout contains packages/reventless-ppx/src. External callers deploying their own platform must leave it false (they have no PPX source and consume the published binary)."
        required: false
        type: boolean
        default: false
      elevated-groups:
        description: >
          Comma-separated groups exempt from owner scoping, e.g. "Admin". Read by
          the deploy program when it bakes the owner predicate into generated
          resolvers, and copied onto every Lambda so command stamping and
          SQL-backed reads — which run in runtimes the deploy never enters —
          reach the same answer. Leave empty and nothing is exempt: operators see
          only their own rows, and an operator acting on someone's behalf has the
          row stamped with their own id. Only deployments whose domain declares an
          owner field need it.
        required: false
        type: string
        default: ""
    secrets:
      # Pulumi Cloud only. With pulumi-backend-url set it is not needed; a job
      # given neither fails before it runs Pulumi.
      PULUMI_ACCESS_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      # Optional. When set, Platform_Stack uses the existing identity provider
      # (and its derived active-role store) instead of auto-provisioning one.
      # Forwarded to deploy jobs as REVENTLESS_IDENTITY_PROVIDER_ID.
      IDENTITY_PROVIDER_ID:
        required: false
      # Deprecated spelling of the above, still accepted so a repo can rename its
      # secret without a window where neither name resolves.
      #
      # 🚨 An unset provider id does not fail a deploy — it is auto mode, and auto
      # mode CREATES A NEW USER POOL. So this stays until IDENTITY_PROVIDER_ID is
      # confirmed present everywhere; removing it early orphans every account in
      # the existing pool, on a deploy that reports success.
      COGNITO_USER_POOL_ID:
        required: false
      # Optional. A token for a private package registry the caller installs from,
      # given to every install as GITHUB_TOKEN: the name an `.npmrc` line such as
      # `//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}` reads. Unset, installs
      # stay anonymous, which is all the public @reventlessdev/* packages need.
      PACKAGES_TOKEN:
        required: false

# A Pulumi Cloud *individual* account permits one running update per ACCOUNT —
# the "Individual user accounts do not support concurrent updates" 409 names
# whichever stack currently holds the slot, even one this run never referenced.
# So the lock has to be account-wide, not ref-wide: an `alpha` deploy and a
# `pr-verify` deploy touch disjoint stacks and still collide. Backends that do
# lock per stack (Pulumi organization, self-managed S3/DIY) opt back into the
# ref-scoped group via `pulumi-concurrent-updates: true`.
concurrency:
  group: ${{ inputs.pulumi-concurrent-updates && format('deploy-{0}', github.ref) || 'deploy-pulumi-account' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Detect which plugins changed and parse the manifest
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      platform-changed: ${{ steps.changes.outputs.platform-changed }}
      changed-plugins: ${{ steps.changes.outputs.changed-plugins }}
      all-plugins: ${{ steps.changes.outputs.all-plugins }}
      branch: ${{ steps.branch.outputs.name }}
      environments-file: ${{ steps.environments.outputs.file }}
      review-candidate: ${{ steps.environments.outputs.review-candidate }}
      skip-deploy: ${{ steps.skip.outputs.skip }}
      region: ${{ steps.changes.outputs.region }}
      started-at: ${{ steps.started.outputs.at }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read by the bake to date the Plugin read model's rows against this deploy.
      # Taken here because this job runs before any stack does: a row written after
      # it was written by this deploy, and a row written before it is one the deploy
      # has not touched — which is what separates "this plugin re-registered" from
      # "this plugin's structure never changed and matched trivially".
      - name: Record deploy start
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Determine branch name
        id: branch
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, use the target branch for stack name (preview against target env)
            BRANCH="${{ github.base_ref }}"
          else
            # For push events, extract branch from ref
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Branch: ${BRANCH}"

      # Only whether the app declares its environments is decided here. Which
      # environment a ref or a pull request reaches is `resolve-environment`'s
      # answer, asked in each deploy job once the app's packages are installed,
      # so the file is read by one implementation only. A pull request in an app
      # that declares environments may get a review environment, which starts
      # empty — so the next step marks the whole app for deploy; if no review
      # environment matches, the jobs fall back to the dry run.
      - name: Find environments file
        id: environments
        run: |
          FILE="${{ inputs.environments }}"
          if [[ -z "$FILE" ]]; then
            FILE="$(dirname "${{ inputs.manifest }}")/environments.yaml"
          fi
          if [[ -f "$FILE" ]]; then
            echo "file=${FILE}" >> "$GITHUB_OUTPUT"
            echo "Environments: ${FILE}"
            if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" != "closed" ]]; then
              echo "review-candidate=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No environments file at ${FILE}: each branch deploys to the stack of its own name"
          fi

      - name: Check for skip deploy
        id: skip
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$COMMIT_MSG" | grep -qi '\[skip deploy\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment: [skip deploy] found in commit message"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # A caller's own change detection runs on plain node; pin it rather than take the
      # runner's, since a detect step that fails quietly deploys nothing.
      - name: Set up Node
        if: hashFiles('scripts/deploy-affected.mjs') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Parse manifest and detect changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MANIFEST="${{ inputs.manifest }}"

          if [[ ! -f "$MANIFEST" ]]; then
            echo "::error::Manifest not found: $MANIFEST"
            exit 1
          fi

          # Manifest paths are relative to the manifest file. Derive the parent
          # directory so we can build repo-root-relative paths for git diff matching
          # and Pulumi --cwd.
          MANIFEST_DIR=$(dirname "$MANIFEST")
          if [[ "$MANIFEST_DIR" == "." ]]; then
            MANIFEST_DIR=""
          else
            MANIFEST_DIR="${MANIFEST_DIR}/"
          fi
          echo "Manifest dir: ${MANIFEST_DIR:-(repo root)}"

          # Determine the base commit for diffing.
          # For PRs: diff against the PR base.
          # For everything else (push, workflow_dispatch): diff against the SHA
          # of the last successful run of the *caller* workflow on this branch.
          # GitHub already records which SHA each run deployed, so no repo state
          # (and no commit-back) is needed. Requires `actions: read` permission
          # from the calling workflow.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            # github.workflow_ref → owner/repo/.github/workflows/FILE.yml@refs/heads/BRANCH
            WORKFLOW_REF="${{ github.workflow_ref }}"
            WORKFLOW_FILE="${WORKFLOW_REF%@*}"   # strip @ref
            WORKFLOW_FILE="${WORKFLOW_FILE##*/}" # basename → FILE.yml
            BASE_SHA=$(gh run list --repo "${{ github.repository }}" \
              --workflow "$WORKFLOW_FILE" --branch "${{ steps.branch.outputs.name }}" \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""' 2>/dev/null || echo "")
            # Verify the commit exists in history (it may have been force-pushed away)
            if [[ -z "$BASE_SHA" ]] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
              echo "::warning::No prior successful run of $WORKFLOW_FILE on ${{ steps.branch.outputs.name }} — deploying everything"
              BASE_SHA=$(git rev-list --max-parents=0 HEAD)
            fi
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: ${{ github.sha }}"

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Install yq for YAML parsing
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Parse region from manifest (optional, defaults to empty)
          REGION=$(yq '.region // ""' "$MANIFEST")
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"
          echo "Region: ${REGION:-(not set)}"

          # Parse platform path from manifest and resolve to repo-root-relative
          PLATFORM_REL=$(yq '.platform.path' "$MANIFEST")
          PLATFORM_PATH="${MANIFEST_DIR}${PLATFORM_REL}"
          echo "Platform path: $PLATFORM_PATH"

          # Check if platform changed (any file under platform path)
          # Use <<< to avoid broken pipe with pipefail when CHANGED_FILES is large
          PLATFORM_CHANGED="false"
          if grep -q "^${PLATFORM_PATH}" <<< "$CHANGED_FILES"; then
            PLATFORM_CHANGED="true"
          fi
          # Also trigger platform deploy if framework packages changed
          if grep -qE "^reventless/|^rescript/" <<< "$CHANGED_FILES"; then
            PLATFORM_CHANGED="true"
          fi
          echo "Platform changed: $PLATFORM_CHANGED"

          # Parse plugins from manifest
          PLUGIN_COUNT=$(yq '.plugins | length' "$MANIFEST")
          TARGET_ARGS=(--target "__platform__=${PLATFORM_PATH}")
          ALL_PLUGINS="[]"
          CHANGED_PLUGINS="[]"

          for ((i = 0; i < PLUGIN_COUNT; i++)); do
            PLUGIN_NAME=$(yq ".plugins[$i].name" "$MANIFEST")
            PLUGIN_REL=$(yq ".plugins[$i].path" "$MANIFEST")
            PLUGIN_PATH="${MANIFEST_DIR}${PLUGIN_REL}"
            PLUGIN_DEPS=$(yq -o=json ".plugins[$i].depends-on // []" "$MANIFEST")
            PLUGIN_REVIEW=$(yq ".plugins[$i].review != false" "$MANIFEST")

            # Build all-plugins entry (store resolved path for --cwd)
            ALL_PLUGINS=$(echo "$ALL_PLUGINS" | jq \
              --arg name "$PLUGIN_NAME" \
              --arg path "$PLUGIN_PATH" \
              --argjson deps "$PLUGIN_DEPS" \
              --argjson review "$PLUGIN_REVIEW" \
              '. + [{"name": $name, "path": $path, "depends-on": $deps, "review": $review}]')
            TARGET_ARGS+=(--target "${PLUGIN_NAME}=${PLUGIN_PATH}")

            # Check if this plugin changed
            PLUGIN_CHANGED="false"
            if grep -q "^${PLUGIN_PATH}" <<< "$CHANGED_FILES"; then
              PLUGIN_CHANGED="true"
            fi
            # Also trigger plugin deploy if framework packages changed
            if grep -qE "^reventless/|^rescript/" <<< "$CHANGED_FILES"; then
              PLUGIN_CHANGED="true"
            fi

            if [[ "$PLUGIN_CHANGED" == "true" ]]; then
              CHANGED_PLUGINS=$(echo "$CHANGED_PLUGINS" | jq \
                --arg name "$PLUGIN_NAME" \
                '. + [$name]')
            fi
          done

          # A caller that knows its own dependency graph decides instead. The rule above
          # treats any change under reventless/ or rescript/ as reaching every stack, which
          # holds for this repository's framework packages and not for an app's own workspace
          # packages there. The script prints {"affected": [names]}, "__platform__" for the
          # platform; the manifest is passed because no package directory owns it.
          if [[ -f scripts/deploy-affected.mjs ]]; then
            printf '%s\n' "$CHANGED_FILES" > /tmp/changed-files.txt
            AFFECTED=$(node scripts/deploy-affected.mjs --changed /tmp/changed-files.txt \
              --manifest "$MANIFEST" "${TARGET_ARGS[@]}" | jq -c '.affected')
            echo "Affected targets (scripts/deploy-affected.mjs): $AFFECTED"
            if jq -e 'index("__platform__")' <<< "$AFFECTED" > /dev/null; then
              PLATFORM_CHANGED="true"
            else
              PLATFORM_CHANGED="false"
            fi
            CHANGED_PLUGINS=$(jq -c --argjson all "$ALL_PLUGINS" \
              '[.[] | select(. as $n | $all | map(.name) | index($n))]' <<< "$AFFECTED")
          fi

          if [[ "${{ steps.environments.outputs.review-candidate }}" == "true" ]]; then
            echo "A pull request in an app with environments: a review stack starts empty, so all of it deploys"
            PLATFORM_CHANGED="true"
            CHANGED_PLUGINS=$(echo "$ALL_PLUGINS" | jq -c '[.[].name]')
          fi

          echo "All plugins: $ALL_PLUGINS"
          echo "Changed plugins: $CHANGED_PLUGINS"

          echo "platform-changed=${PLATFORM_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "changed-plugins=$(echo "$CHANGED_PLUGINS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "all-plugins=$(echo "$ALL_PLUGINS" | jq -c .)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: Deploy the platform stack (shared resources)
  # ---------------------------------------------------------------------------
  deploy-platform:
    name: Deploy Platform
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event.action != 'closed' &&
      needs.detect-changes.outputs.skip-deploy != 'true' &&
      needs.detect-changes.outputs.platform-changed == 'true'
    environment: deploy-platform
    env:
      # Environment "deploy-platform" secrets override these defaults if set.
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      # Empty → Pulumi Cloud, logged in with the token above.
      PULUMI_BACKEND_URL: ${{ inputs.pulumi-backend-url }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ needs.detect-changes.outputs.region }}
      # The groups exempt from owner scoping. The deploy program reads it when it
      # bakes the owner predicate into generated resolvers; the same value is
      # copied onto every Lambda it provisions, because stamping and SQL-backed
      # reads run in runtimes this process never enters and would otherwise
      # conclude that nobody is elevated.
      REVENTLESS_ELEVATED_GROUPS: ${{ inputs.elevated-groups }}
      # Read by Util_LocalConfig (Platform_Stack.resolveCognitoUserPool).
      # Unset/empty → falls through to Pulumi.local.yaml then Pulumi
      # stack config; if still unset, auto-provisions a fresh UserPool.
      # Either secret spelling resolves it — see the secrets block above.
      REVENTLESS_IDENTITY_PROVIDER_ID:
        ${{ secrets.IDENTITY_PROVIDER_ID || secrets.COGNITO_USER_POOL_ID }}
      # Read by Util_LocalConfig (Platform.deployPlatform). When both base
      # domain and hosted-zone ID are set the framework provisions an ACM
      # cert + Route53 alias for the host-UI shell. Unset → cloudfront.net
      # default URL is retained.
      REVENTLESS_HOST_UI_BASE_DOMAIN: ${{ inputs.host-ui-base-domain }}
      REVENTLESS_HOST_UI_HOSTED_ZONE_ID: ${{ inputs.host-ui-hosted-zone-id }}
      REVENTLESS_HOST_UI_PROD_STACKS: ${{ inputs.host-ui-prod-stacks }}
      REVENTLESS_HOST_UI_BASE_NAME: ${{ inputs.host-ui-base-name }}
    steps:
      # A review environment runs the pull request's head, not the merge commit
      # GitHub makes; everything else checks out as before.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.review-candidate == 'true' && github.event.pull_request.head.sha || '' }}

      # Pulumi Cloud needs the token; a self-managed backend needs only its URL.
      # Neither, and every Pulumi command below fails with a login prompt it
      # cannot answer, so say which is missing before anything is installed.
      - name: Check the Pulumi backend
        run: |
          if [[ -z "${PULUMI_ACCESS_TOKEN:-}" && -z "${PULUMI_BACKEND_URL:-}" ]]; then
            echo "::error::No Pulumi backend: pass the PULUMI_ACCESS_TOKEN secret for Pulumi Cloud, or set the pulumi-backend-url input to a self-managed backend (s3://…)."
            exit 1
          fi
          echo "Pulumi backend: ${PULUMI_BACKEND_URL:-Pulumi Cloud}"

      - name: Resolve Lambda Layer ARN
        run: |
          # Input takes precedence, then the per-stack SSM parameter, then empty
          # (no layer). SSM parameters are regional — read using AWS_REGION (the
          # manifest region), matching where build-lambda-layer.yml wrote it.
          ARN="${{ inputs.layer-arn }}"
          if [[ -z "$ARN" ]]; then
            BRANCH="${{ needs.detect-changes.outputs.branch }}"
            case "$BRANCH" in
              main)  STACK="main"  ;;
              beta)  STACK="beta"  ;;
              alpha) STACK="alpha" ;;
              *)     STACK="alpha" ;;
            esac
            ARN=$(aws ssm get-parameter --name "/reventless/layer-arn/${STACK}" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
          fi
          echo "REVENTLESS_LAYER_ARN=${ARN}" >> "$GITHUB_ENV"
          echo "Layer ARN: ${ARN:-(none)}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        # This repository's own; a caller without one keeps its workspace as it is.
        run: |
          if [[ -f scripts/workspace-setup.mjs ]]; then
            node scripts/workspace-setup.mjs
          else
            echo "No scripts/workspace-setup.mjs: the workspace is used as checked out"
          fi

      - name: Install dependencies
        # All @reventlessdev/* deps (and the host-shell tarball) are public on
        # npmjs — anonymous install, no auth token needed. A caller's private
        # scope reads PACKAGES_TOKEN.
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # Build the PPX from source and stage it as the bin resolver's local
      # fallback, so the deploy compiles annotated spec sources with the
      # from-source PPX rather than the published (possibly stale) per-platform
      # binary. Without this a PPX source change that added a required field
      # deployed red until the per-platform republish + pin landed (observed on
      # the 2026-08-09 @live republish). Gitignored .exe, ~1 min on a warm cache.
      - name: Setup reventless-ppx (from source)
        if: inputs.build-ppx-from-source
        uses: ./.github/actions/setup-ppx

      - name: Build
        run: pnpm run build

      # Compile every resolver template against AppSync before Pulumi attaches
      # one. AppSync refuses a resolver whose code does not type-check, and
      # reports it as "The code contains one or more errors" — with no line and
      # no rule, against the one resource it happened to reach first, after the
      # stack is already half-updated. This asks the same compiler about all of
      # them up front, and names the template that produced the bad one. It runs
      # here rather than in CI because it needs the AWS credentials this job
      # already has, and skips itself where there are none. The templates are
      # shared with the plugin deploys, so validating them once covers those too.
      - name: Validate AppSync resolver code
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['check:resolvers'] ? 0 : 1)"; then
            pnpm run check:resolvers
          else
            echo "No check:resolvers script: the published templates were validated where they were built"
          fi

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          # Pinned to the last version that deployed cleanly (Jun 2026). The CLI
          # version is NOT the root cause of the nodejs-provider load failures
          # (3.247.0 reproduces them); pinning is just hygiene to stop
          # setup-pulumi silently floating to newer releases.
          pulumi-version: 3.247.0

      - name: Resolve platform path
        id: platform
        run: |
          MANIFEST="${{ inputs.manifest }}"
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 2>/dev/null || true
          sudo chmod +x /usr/local/bin/yq 2>/dev/null || true
          MANIFEST_DIR=$(dirname "$MANIFEST")
          [[ "$MANIFEST_DIR" == "." ]] && MANIFEST_DIR="" || MANIFEST_DIR="${MANIFEST_DIR}/"
          PLATFORM_REL=$(yq '.platform.path' "$MANIFEST")
          echo "path=${MANIFEST_DIR}${PLATFORM_REL}" >> "$GITHUB_OUTPUT"

      # Which stack this run deploys. Without an environments file the stack is
      # the branch, as it always was. With one, `resolve-environment` answers:
      # `deploy` for a branch or tag an environment names, `review` for a pull
      # request into a branch with a review environment, `branch` for any other
      # pull request (the dry run against its base, as before), and `none` for a
      # push nothing names. It also hands the deploy what it records about itself.
      - name: Resolve environment
        id: env
        working-directory: ${{ steps.platform.outputs.path }}
        run: |
          set -euo pipefail
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          FILE="${{ needs.detect-changes.outputs.environments-file }}"
          if [[ -z "$FILE" ]]; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "stack=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILE="${GITHUB_WORKSPACE}/${FILE}"
          field() { sed -n "s/^$1=//p" <<< "$2"; }
          record() {
            echo "REVENTLESS_ENVIRONMENT=$(field environment "$1")" >> "$GITHUB_ENV"
            echo "REVENTLESS_ENVIRONMENT_PURPOSE=$(field purpose "$1")" >> "$GITHUB_ENV"
          }
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              echo "::notice::A pull request from a fork runs without this repository's secrets: no review environment, the dry run only"
              echo "mode=branch" >> "$GITHUB_OUTPUT"
              echo "stack=${BRANCH}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DRAFT=""
            if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then DRAFT="--draft"; fi
            OUT=$(pnpm exec resolve-environment --file "$FILE" \
              --pull-request "${{ github.event.pull_request.number }}" --base "${{ github.base_ref }}" $DRAFT)
            if [[ "$(field matched "$OUT")" == "true" ]]; then
              BASE_OUT=$(pnpm exec resolve-environment --file "$FILE" --ref "refs/heads/${{ github.base_ref }}")
              echo "mode=review" >> "$GITHUB_OUTPUT"
              echo "stack=$(field stack "$OUT")" >> "$GITHUB_OUTPUT"
              echo "base-stack=$(field stack "$BASE_OUT")" >> "$GITHUB_OUTPUT"
              record "$OUT"
              echo "REVENTLESS_PULL_REQUEST=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
              echo "REVENTLESS_COMMIT=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            else
              echo "mode=branch" >> "$GITHUB_OUTPUT"
              echo "stack=${BRANCH}" >> "$GITHUB_OUTPUT"
            fi
          else
            OUT=$(pnpm exec resolve-environment --file "$FILE" --ref "${GITHUB_REF}")
            if [[ "$(field matched "$OUT")" == "true" ]]; then
              echo "mode=deploy" >> "$GITHUB_OUTPUT"
              echo "stack=$(field stack "$OUT")" >> "$GITHUB_OUTPUT"
              record "$OUT"
            else
              echo "::notice::${GITHUB_REF} feeds no environment in ${FILE}: nothing deploys"
              echo "mode=none" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "$OUT"

      # The secrets provider a stack created below is given. `{stack}` names the
      # stack whose key it uses: a review stack shares its base environment's,
      # so `config cp` from the base stays within one key.
      - name: Resolve secrets provider
        id: secrets
        env:
          TEMPLATE: ${{ inputs.pulumi-secrets-provider }}
          KEY_STACK: ${{ steps.env.outputs.base-stack || steps.env.outputs.stack }}
        run: |
          if [[ -n "$TEMPLATE" && -n "$KEY_STACK" ]]; then
            PROVIDER="${TEMPLATE//\{stack\}/$KEY_STACK}"
            echo "provider=${PROVIDER}" >> "$GITHUB_OUTPUT"
            echo "A stack this run creates is encrypted with ${PROVIDER}"
          fi

      - name: Check stack config exists
        id: check-config
        run: |
          STACK="${{ steps.env.outputs.stack }}"
          DEPLOY_DIR="${{ steps.platform.outputs.path }}"
          CONFIG_FILE="${DEPLOY_DIR}/Pulumi.${STACK}.yaml"
          if [[ "${{ steps.env.outputs.mode }}" == "none" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [[ -f "$CONFIG_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Stack config found: $CONFIG_FILE"
          elif [[ "${{ steps.env.outputs.mode }}" == "review" && -f "${DEPLOY_DIR}/Pulumi.${{ steps.env.outputs.base-stack }}.yaml" ]]; then
            # A review stack takes its settings from the stack of the branch it
            # targets, through Pulumi so its secrets are re-encrypted for it.
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Review stack ${STACK} will take its config from ${{ steps.env.outputs.base-stack }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No stack config at $CONFIG_FILE — skipping platform deployment"
          fi

      - name: Pulumi preview (PR)
        if: |
          github.event_name == 'pull_request' &&
          steps.env.outputs.mode != 'review' &&
          steps.check-config.outputs.exists == 'true'
        run: |
          STACK="${{ steps.env.outputs.stack }}"
          DEPLOY_DIR="${{ steps.platform.outputs.path }}"
          PROVIDER="${{ steps.secrets.outputs.provider }}"
          pulumi stack select --create "$STACK" ${PROVIDER:+--secrets-provider "$PROVIDER"} --cwd "$DEPLOY_DIR" --non-interactive
          pulumi refresh --stack "$STACK" --cwd "$DEPLOY_DIR" --yes --skip-preview --non-interactive
          pulumi preview --stack "$STACK" --cwd "$DEPLOY_DIR" --non-interactive

      - name: Pulumi up (push)
        if: |
          (github.event_name != 'pull_request' || steps.env.outputs.mode == 'review') &&
          steps.check-config.outputs.exists == 'true'
        run: |
          STACK="${{ steps.env.outputs.stack }}"
          DEPLOY_DIR="${{ steps.platform.outputs.path }}"
          PROVIDER="${{ steps.secrets.outputs.provider }}"
          # Asked before the select: creating a stack with any secrets provider
          # but Pulumi Cloud's writes its config file, salt or key in it.
          COPY_CONFIG=false
          if [[ "${{ steps.env.outputs.mode }}" == "review" && ! -f "${DEPLOY_DIR}/Pulumi.${STACK}.yaml" ]]; then
            COPY_CONFIG=true
          fi
          pulumi stack select --create "$STACK" ${PROVIDER:+--secrets-provider "$PROVIDER"} --cwd "$DEPLOY_DIR" --non-interactive
          if [[ "$COPY_CONFIG" == "true" ]]; then
            pulumi config cp --stack "${{ steps.env.outputs.base-stack }}" --dest "$STACK" --cwd "$DEPLOY_DIR" --non-interactive
            # A copied reference to a stack of this app (`platform:stack`,
            # `interstack:dependencies`, …) still names the base environment's,
            # and would deploy this review against it. Point each at the review's.
            # References to stacks the review does not deploy stay shared.
            MANIFEST="${{ inputs.manifest }}"
            PROJECTS=$(for p in $(yq '.platform.path, (.plugins[] | select(.review != false) | .path)' "$MANIFEST"); do
              yq '.name' "$(dirname "$MANIFEST")/${p}/Pulumi.yaml"; done | paste -sd, -)
            pulumi config --stack "$STACK" --cwd "$DEPLOY_DIR" --json |
              PROJECTS="$PROJECTS" BASE="${{ steps.env.outputs.base-stack }}" REVIEW="$STACK" python3 -c '
          import json, os, re, sys
          projects = "|".join(re.escape(p) for p in os.environ["PROJECTS"].split(",") if p)
          ref = re.compile(r"([^\s\"\x27/\[\],]+/(?:%s)/)%s(?![\w.-])" % (projects, re.escape(os.environ["BASE"])))
          for key, entry in json.load(sys.stdin).items():
              value = entry.get("value")
              if projects and not entry.get("secret") and isinstance(value, str):
                  retargeted = ref.sub(lambda m: m.group(1) + os.environ["REVIEW"], value)
                  if retargeted != value:
                      print(key + "\t" + retargeted)
          ' |
              while IFS=$'\t' read -r key value; do
                echo "${key}: ${value}"
                pulumi config set "$key" "$value" --stack "$STACK" --cwd "$DEPLOY_DIR" --non-interactive < /dev/null
              done
          fi
          # Recovery for an interrupted deploy: cancel a stale lock, drop the
          # pending creates with nothing in AWS behind them (an ACM validation
          # that timed out), refuse any other rather than orphan it, refresh.
          # From reventless-aws, so a caller of this workflow has it too.
          (cd "$DEPLOY_DIR" && pnpm exec clear-pending-creates --stack "$STACK")
          pulumi up --stack "$STACK" --yes --skip-preview --cwd "$DEPLOY_DIR" --non-interactive

      # EventBridge allows 300 rules per bus. The plugin disconnect mechanism
      # creates one per connected plugin, so a broken delete leaks silently
      # until PutRule starts failing. Reported, never enforced: a deploy must
      # not fail over rule count. Runs on the platform job only — rules are
      # account-wide, so the plugin matrix would just repeat this N times.
      - name: Report EventBridge rule count
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          if [[ -f scripts/eventbridge-rules.mjs ]]; then
            node scripts/eventbridge-rules.mjs
          else
            echo "No scripts/eventbridge-rules.mjs: the rule count is not reported"
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Deploy changed plugins (matrix, respecting depends-on ordering)
  # ---------------------------------------------------------------------------
  deploy-plugins:
    name: Deploy Plugin (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-platform]
    # Run even if deploy-platform was skipped (platform didn't change)
    if: |
      always() &&
      github.event.action != 'closed' &&
      needs.detect-changes.result == 'success' &&
      (needs.deploy-platform.result == 'success' || needs.deploy-platform.result == 'skipped') &&
      needs.detect-changes.outputs.skip-deploy != 'true' &&
      needs.detect-changes.outputs.changed-plugins != '[]'
    environment: deploy-${{ matrix.plugin }}
    strategy:
      fail-fast: false
      # Each plugin owns a distinct stack, so the matrix is safe to fan out —
      # but only if the backend locks per stack. Against a Pulumi Cloud
      # individual account the second job 409s on the first job's stack (see
      # the workflow-level `concurrency` comment), so the default is serial.
      max-parallel: ${{ inputs.pulumi-concurrent-updates && 4 || 1 }}
      matrix:
        plugin: ${{ fromJson(needs.detect-changes.outputs.changed-plugins) }}
    env:
      # Environment "deploy-<plugin>" secrets override these defaults if set.
      # E.g. "deploy-catalog" can have its own PULUMI_ACCESS_TOKEN.
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      # Empty → Pulumi Cloud, logged in with the token above.
      PULUMI_BACKEND_URL: ${{ inputs.pulumi-backend-url }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ needs.detect-changes.outputs.region }}
      # The groups exempt from owner scoping. The deploy program reads it when it
      # bakes the owner predicate into generated resolvers; the same value is
      # copied onto every Lambda it provisions, because stamping and SQL-backed
      # reads run in runtimes this process never enters and would otherwise
      # conclude that nobody is elevated.
      REVENTLESS_ELEVATED_GROUPS: ${{ inputs.elevated-groups }}
      # Forwarded for plugin stacks that wire AppSync auth themselves.
      # Unset/empty → falls through to local sidecar / stack config.
      REVENTLESS_IDENTITY_PROVIDER_ID:
        ${{ secrets.IDENTITY_PROVIDER_ID || secrets.COGNITO_USER_POOL_ID }}
      # Per-plugin UI bundles read the same host-UI domain config to derive
      # their own subdomain (once per-plugin SPAs ship). Forwarded here so
      # plugin stacks see the same values the platform job sees.
      REVENTLESS_HOST_UI_BASE_DOMAIN: ${{ inputs.host-ui-base-domain }}
      REVENTLESS_HOST_UI_HOSTED_ZONE_ID: ${{ inputs.host-ui-hosted-zone-id }}
      REVENTLESS_HOST_UI_PROD_STACKS: ${{ inputs.host-ui-prod-stacks }}
      REVENTLESS_HOST_UI_BASE_NAME: ${{ inputs.host-ui-base-name }}
    steps:
      # A review environment runs the pull request's head, not the merge commit
      # GitHub makes; everything else checks out as before.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.review-candidate == 'true' && github.event.pull_request.head.sha || '' }}

      # Pulumi Cloud needs the token; a self-managed backend needs only its URL.
      # Neither, and every Pulumi command below fails with a login prompt it
      # cannot answer, so say which is missing before anything is installed.
      - name: Check the Pulumi backend
        run: |
          if [[ -z "${PULUMI_ACCESS_TOKEN:-}" && -z "${PULUMI_BACKEND_URL:-}" ]]; then
            echo "::error::No Pulumi backend: pass the PULUMI_ACCESS_TOKEN secret for Pulumi Cloud, or set the pulumi-backend-url input to a self-managed backend (s3://…)."
            exit 1
          fi
          echo "Pulumi backend: ${PULUMI_BACKEND_URL:-Pulumi Cloud}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        # This repository's own; a caller without one keeps its workspace as it is.
        run: |
          if [[ -f scripts/workspace-setup.mjs ]]; then
            node scripts/workspace-setup.mjs
          else
            echo "No scripts/workspace-setup.mjs: the workspace is used as checked out"
          fi

      - name: Install dependencies
        # All @reventlessdev/* deps (and the host-shell tarball) are public on
        # npmjs — anonymous install, no auth token needed. A caller's private
        # scope reads PACKAGES_TOKEN.
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # Build the PPX from source and stage it as the bin resolver's local
      # fallback, so the deploy compiles annotated spec sources with the
      # from-source PPX rather than the published (possibly stale) per-platform
      # binary. Without this a PPX source change that added a required field
      # deployed red until the per-platform republish + pin landed (observed on
      # the 2026-08-09 @live republish). Gitignored .exe, ~1 min on a warm cache.
      - name: Setup reventless-ppx (from source)
        if: inputs.build-ppx-from-source
        uses: ./.github/actions/setup-ppx

      - name: Build
        run: pnpm run build

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          # Pinned to the last version that deployed cleanly (Jun 2026). The CLI
          # version is NOT the root cause of the nodejs-provider load failures
          # (3.247.0 reproduces them); pinning is just hygiene to stop
          # setup-pulumi silently floating to newer releases.
          pulumi-version: 3.247.0

      - name: Resolve plugin path
        id: plugin
        run: |
          MANIFEST="${{ inputs.manifest }}"
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 2>/dev/null || true
          sudo chmod +x /usr/local/bin/yq 2>/dev/null || true
          MANIFEST_DIR=$(dirname "$MANIFEST")
          [[ "$MANIFEST_DIR" == "." ]] && MANIFEST_DIR="" || MANIFEST_DIR="${MANIFEST_DIR}/"
          PLUGIN_REL=$(yq '.plugins[] | select(.name == "${{ matrix.plugin }}") | .path' "$MANIFEST")
          PLUGIN_DEPS=$(yq -o=json '.plugins[] | select(.name == "${{ matrix.plugin }}") | .depends-on // []' "$MANIFEST")
          # A plugin's own `region` overrides the manifest's for this stack.
          PLUGIN_REGION=$(yq '.plugins[] | select(.name == "${{ matrix.plugin }}") | .region // ""' "$MANIFEST")
          echo "path=${MANIFEST_DIR}${PLUGIN_REL}" >> "$GITHUB_OUTPUT"
          echo "deps=${PLUGIN_DEPS}" >> "$GITHUB_OUTPUT"
          echo "region=${PLUGIN_REGION:-${{ needs.detect-changes.outputs.region }}}" >> "$GITHUB_OUTPUT"
          # `review: false` keeps the stack out of a pull request's review environment.
          echo "review=$(yq '.plugins[] | select(.name == "${{ matrix.plugin }}") | .review != false' "$MANIFEST")" >> "$GITHUB_OUTPUT"

      - name: Resolve Lambda Layer ARN
        env:
          AWS_REGION: ${{ steps.plugin.outputs.region }}
        run: |
          # Input takes precedence, then the per-stack SSM parameter, then empty
          # (no layer). SSM parameters are regional — read in the plugin's region,
          # so a plugin in a region with no layer deploys without one.
          ARN="${{ inputs.layer-arn }}"
          if [[ -z "$ARN" ]]; then
            BRANCH="${{ needs.detect-changes.outputs.branch }}"
            case "$BRANCH" in
              main)  STACK="main"  ;;
              beta)  STACK="beta"  ;;
              alpha) STACK="alpha" ;;
              *)     STACK="alpha" ;;
            esac
            ARN=$(aws ssm get-parameter --name "/reventless/layer-arn/${STACK}" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
          fi
          echo "REVENTLESS_LAYER_ARN=${ARN}" >> "$GITHUB_ENV"
          echo "Layer ARN: ${ARN:-(none)}"

      - name: Wait for dependencies
        if: steps.plugin.outputs.deps != '[]'
        run: |
          echo "Plugin ${{ matrix.plugin }} depends on: ${{ steps.plugin.outputs.deps }}"
          echo "Dependencies are satisfied by deploy-platform completing first."
          echo "Cross-plugin ordering within a single matrix run is handled by"
          echo "Pulumi stack references at deploy time (eventual consistency)."
          #
          # Note: For strict ordering where plugin B must deploy AFTER plugin A,
          # callers should split into separate workflow_call invocations or use
          # the depends-on field to inform a future orchestration enhancement.

      # Which stack this run deploys: the same step as in deploy-platform.
      - name: Resolve environment
        id: env
        working-directory: ${{ steps.plugin.outputs.path }}
        run: |
          set -euo pipefail
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          FILE="${{ needs.detect-changes.outputs.environments-file }}"
          if [[ -z "$FILE" ]]; then
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "stack=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILE="${GITHUB_WORKSPACE}/${FILE}"
          field() { sed -n "s/^$1=//p" <<< "$2"; }
          record() {
            echo "REVENTLESS_ENVIRONMENT=$(field environment "$1")" >> "$GITHUB_ENV"
            echo "REVENTLESS_ENVIRONMENT_PURPOSE=$(field purpose "$1")" >> "$GITHUB_ENV"
          }
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
              echo "::notice::A pull request from a fork runs without this repository's secrets: no review environment, the dry run only"
              echo "mode=branch" >> "$GITHUB_OUTPUT"
              echo "stack=${BRANCH}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            DRAFT=""
            if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then DRAFT="--draft"; fi
            OUT=$(pnpm exec resolve-environment --file "$FILE" \
              --pull-request "${{ github.event.pull_request.number }}" --base "${{ github.base_ref }}" $DRAFT)
            if [[ "$(field matched "$OUT")" == "true" ]]; then
              BASE_OUT=$(pnpm exec resolve-environment --file "$FILE" --ref "refs/heads/${{ github.base_ref }}")
              echo "mode=review" >> "$GITHUB_OUTPUT"
              echo "stack=$(field stack "$OUT")" >> "$GITHUB_OUTPUT"
              echo "base-stack=$(field stack "$BASE_OUT")" >> "$GITHUB_OUTPUT"
              record "$OUT"
              echo "REVENTLESS_PULL_REQUEST=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
              echo "REVENTLESS_COMMIT=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            else
              echo "mode=branch" >> "$GITHUB_OUTPUT"
              echo "stack=${BRANCH}" >> "$GITHUB_OUTPUT"
            fi
          else
            OUT=$(pnpm exec resolve-environment --file "$FILE" --ref "${GITHUB_REF}")
            if [[ "$(field matched "$OUT")" == "true" ]]; then
              echo "mode=deploy" >> "$GITHUB_OUTPUT"
              echo "stack=$(field stack "$OUT")" >> "$GITHUB_OUTPUT"
              record "$OUT"
            else
              echo "::notice::${GITHUB_REF} feeds no environment in ${FILE}: nothing deploys"
              echo "mode=none" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "$OUT"

      # The secrets provider a stack created below is given. `{stack}` names the
      # stack whose key it uses: a review stack shares its base environment's,
      # so `config cp` from the base stays within one key.
      - name: Resolve secrets provider
        id: secrets
        env:
          TEMPLATE: ${{ inputs.pulumi-secrets-provider }}
          KEY_STACK: ${{ steps.env.outputs.base-stack || steps.env.outputs.stack }}
        run: |
          if [[ -n "$TEMPLATE" && -n "$KEY_STACK" ]]; then
            PROVIDER="${TEMPLATE//\{stack\}/$KEY_STACK}"
            echo "provider=${PROVIDER}" >> "$GITHUB_OUTPUT"
            echo "A stack this run creates is encrypted with ${PROVIDER}"
          fi

      - name: Check stack config exists
        id: check-config
        run: |
          STACK="${{ steps.env.outputs.stack }}"
          DEPLOY_DIR="${{ steps.plugin.outputs.path }}"
          CONFIG_FILE="${DEPLOY_DIR}/Pulumi.${STACK}.yaml"
          if [[ "${{ steps.env.outputs.mode }}" == "none" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.env.outputs.mode }}" == "review" && "${{ steps.plugin.outputs.review }}" == "false" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.plugin }} says review: false — the review uses the base environment's stack"
          elif [[ -f "$CONFIG_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Stack config found: $CONFIG_FILE"
          elif [[ "${{ steps.env.outputs.mode }}" == "review" && -f "${DEPLOY_DIR}/Pulumi.${{ steps.env.outputs.base-stack }}.yaml" ]]; then
            # A review stack takes its settings from the stack of the branch it
            # targets, through Pulumi so its secrets are re-encrypted for it.
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Review stack ${STACK} will take its config from ${{ steps.env.outputs.base-stack }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No stack config at $CONFIG_FILE — skipping ${{ matrix.plugin }} deployment"
          fi

      - name: Pulumi preview (PR)
        id: preview
        if: |
          github.event_name == 'pull_request' &&
          steps.env.outputs.mode != 'review' &&
          steps.check-config.outputs.exists == 'true'
        env:
          AWS_REGION: ${{ steps.plugin.outputs.region }}
        run: |
          STACK="${{ steps.env.outputs.stack }}"
          DEPLOY_DIR="${{ steps.plugin.outputs.path }}"
          PROVIDER="${{ steps.secrets.outputs.provider }}"
          pulumi stack select --create "$STACK" ${PROVIDER:+--secrets-provider "$PROVIDER"} --cwd "$DEPLOY_DIR" --non-interactive
          pulumi refresh --stack "$STACK" --cwd "$DEPLOY_DIR" --yes --skip-preview --non-interactive
          OUTPUT=$(pulumi preview --stack "$STACK" --cwd "$DEPLOY_DIR" --non-interactive 2>&1) || true
          echo "$OUTPUT"
          # Save output for PR comment
          {
            echo "preview<<PREVIEW_EOF"
            echo "$OUTPUT"
            echo "PREVIEW_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment with preview
        if: |
          github.event_name == 'pull_request' &&
          steps.env.outputs.mode != 'review' &&
          steps.check-config.outputs.exists == 'true' &&
          steps.preview.outputs.preview != ''
        uses: actions/github-script@v7
        with:
          script: |
            const plugin = '${{ matrix.plugin }}';
            const preview = `${{ steps.preview.outputs.preview }}`;
            const body = [
              `### Pulumi Preview: \`${plugin}\``,
              '',
              '<details>',
              '<summary>Preview output</summary>',
              '',
              '```',
              preview,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Pulumi up (push)
        if: |
          (github.event_name != 'pull_request' || steps.env.outputs.mode == 'review') &&
          steps.check-config.outputs.exists == 'true'
        env:
          AWS_REGION: ${{ steps.plugin.outputs.region }}
        run: |
          STACK="${{ steps.env.outputs.stack }}"
          DEPLOY_DIR="${{ steps.plugin.outputs.path }}"
          PROVIDER="${{ steps.secrets.outputs.provider }}"
          # Asked before the select: creating a stack with any secrets provider
          # but Pulumi Cloud's writes its config file, salt or key in it.
          COPY_CONFIG=false
          if [[ "${{ steps.env.outputs.mode }}" == "review" && ! -f "${DEPLOY_DIR}/Pulumi.${STACK}.yaml" ]]; then
            COPY_CONFIG=true
          fi
          pulumi stack select --create "$STACK" ${PROVIDER:+--secrets-provider "$PROVIDER"} --cwd "$DEPLOY_DIR" --non-interactive
          if [[ "$COPY_CONFIG" == "true" ]]; then
            pulumi config cp --stack "${{ steps.env.outputs.base-stack }}" --dest "$STACK" --cwd "$DEPLOY_DIR" --non-interactive
            # A copied reference to a stack of this app (`platform:stack`,
            # `interstack:dependencies`, …) still names the base environment's,
            # and would deploy this review against it. Point each at the review's.
            # References to stacks the review does not deploy stay shared.
            MANIFEST="${{ inputs.manifest }}"
            PROJECTS=$(for p in $(yq '.platform.path, (.plugins[] | select(.review != false) | .path)' "$MANIFEST"); do
              yq '.name' "$(dirname "$MANIFEST")/${p}/Pulumi.yaml"; done | paste -sd, -)
            pulumi config --stack "$STACK" --cwd "$DEPLOY_DIR" --json |
              PROJECTS="$PROJECTS" BASE="${{ steps.env.outputs.base-stack }}" REVIEW="$STACK" python3 -c '
          import json, os, re, sys
          projects = "|".join(re.escape(p) for p in os.environ["PROJECTS"].split(",") if p)
          ref = re.compile(r"([^\s\"\x27/\[\],]+/(?:%s)/)%s(?![\w.-])" % (projects, re.escape(os.environ["BASE"])))
          for key, entry in json.load(sys.stdin).items():
              value = entry.get("value")
              if projects and not entry.get("secret") and isinstance(value, str):
                  retargeted = ref.sub(lambda m: m.group(1) + os.environ["REVIEW"], value)
                  if retargeted != value:
                      print(key + "\t" + retargeted)
          ' |
              while IFS=$'\t' read -r key value; do
                echo "${key}: ${value}"
                pulumi config set "$key" "$value" --stack "$STACK" --cwd "$DEPLOY_DIR" --non-interactive < /dev/null
              done
          fi
          # Recovery for an interrupted deploy — same as deploy-platform above.
          (cd "$DEPLOY_DIR" && pnpm exec clear-pending-creates --stack "$STACK")
          pulumi up --stack "$STACK" --yes --skip-preview --cwd "$DEPLOY_DIR" --non-interactive

  # ---------------------------------------------------------------------------
  # Job 4: Bake the component manifest (after every plugin stack is up)
  # ---------------------------------------------------------------------------
  # The manifest describes the WHOLE deployment — which plugins exist and which
  # of their components this shop offers — so no single stack's deploy is the
  # moment it is settled. It is baked here, once, after the matrix.
  #
  # It exists so a shell serving a non-elevated audience can discover its
  # surfaces at all: `Platform_ComponentDefinitions` is Admin-gated, so a shopper
  # fails discovery before any individual view's authorization is consulted. The
  # platform writes `manifestUrl` into config.json when it declares a bake; this
  # step is what puts a file at the other end of it.
  #
  # A deployment that declares no bake has no `bakedManifestFunction` output and
  # this job no-ops — the same "absent is inert" contract the declaration has
  # everywhere else.
  bake-manifest:
    name: Bake component manifest
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-platform, deploy-plugins]
    # Runs when either half deployed (or was skipped as unchanged), never on a
    # PR, and never after a failure — baking off a half-deployed platform would
    # publish a shop missing whatever did not land.
    if: |
      always() &&
      github.event.action != 'closed' &&
      (github.event_name != 'pull_request' || needs.detect-changes.outputs.review-candidate == 'true') &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.skip-deploy != 'true' &&
      needs.deploy-platform.result != 'failure' &&
      needs.deploy-plugins.result != 'failure'
    environment: deploy-platform
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      # Empty → Pulumi Cloud, logged in with the token above.
      PULUMI_BACKEND_URL: ${{ inputs.pulumi-backend-url }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ needs.detect-changes.outputs.region }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-changes.outputs.review-candidate == 'true' && github.event.pull_request.head.sha || '' }}

      # Without an environments file the stack is the branch and is known now.
      # With one, which stack was deployed is only known once `resolve-environment`
      # can run, so the job installs first and decides after.
      - name: Resolve platform path
        id: platform
        run: |
          MANIFEST="${{ inputs.manifest }}"
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 2>/dev/null || true
          sudo chmod +x /usr/local/bin/yq 2>/dev/null || true
          MANIFEST_DIR=$(dirname "$MANIFEST")
          [[ "$MANIFEST_DIR" == "." ]] && MANIFEST_DIR="" || MANIFEST_DIR="${MANIFEST_DIR}/"
          PLATFORM_PATH="${MANIFEST_DIR}$(yq '.platform.path' "$MANIFEST")"
          echo "path=${PLATFORM_PATH}" >> "$GITHUB_OUTPUT"
          if [[ -n "${{ needs.detect-changes.outputs.environments-file }}" ]]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          elif [[ -f "${PLATFORM_PATH}/Pulumi.${BRANCH}.yaml" ]]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No stack config for ${BRANCH} — nothing deployed, nothing to bake."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      # The bake is `bake-manifest` from @reventlessdev/reventless-aws — the same
      # command a hand deploy runs — so the job installs the app's dependencies.
      # Nothing is built: the command ships compiled.
      # Pulumi Cloud needs the token; a self-managed backend needs only its URL.
      # Neither, and every Pulumi command below fails with a login prompt it
      # cannot answer, so say which is missing before anything is installed.
      - name: Check the Pulumi backend
        if: steps.platform.outputs.deployed == 'true'
        run: |
          if [[ -z "${PULUMI_ACCESS_TOKEN:-}" && -z "${PULUMI_BACKEND_URL:-}" ]]; then
            echo "::error::No Pulumi backend: pass the PULUMI_ACCESS_TOKEN secret for Pulumi Cloud, or set the pulumi-backend-url input to a self-managed backend (s3://…)."
            exit 1
          fi
          echo "Pulumi backend: ${PULUMI_BACKEND_URL:-Pulumi Cloud}"

      - name: Setup pnpm
        if: steps.platform.outputs.deployed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.platform.outputs.deployed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        if: steps.platform.outputs.deployed == 'true'
        # This repository's own; a caller without one keeps its workspace as it is.
        run: |
          if [[ -f scripts/workspace-setup.mjs ]]; then
            node scripts/workspace-setup.mjs
          else
            echo "No scripts/workspace-setup.mjs: the workspace is used as checked out"
          fi

      - name: Install dependencies
        if: steps.platform.outputs.deployed == 'true'
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Install Pulumi CLI
        if: steps.platform.outputs.deployed == 'true'
        uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: 3.247.0

      # Which stack was deployed: the same step as in deploy-platform. Without an
      # environments file it is the branch, and the check above already stands.
      - name: Resolve environment
        id: env
        if: steps.platform.outputs.deployed == 'true'
        working-directory: ${{ steps.platform.outputs.path }}
        run: |
          set -euo pipefail
          BRANCH="${{ needs.detect-changes.outputs.branch }}"
          FILE="${{ needs.detect-changes.outputs.environments-file }}"
          if [[ -z "$FILE" ]]; then
            echo "bake=true" >> "$GITHUB_OUTPUT"
            echo "stack=${BRANCH}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILE="${GITHUB_WORKSPACE}/${FILE}"
          field() { sed -n "s/^$1=//p" <<< "$2"; }
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DRAFT=""
            if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then DRAFT="--draft"; fi
            OUT=$(pnpm exec resolve-environment --file "$FILE" \
              --pull-request "${{ github.event.pull_request.number }}" --base "${{ github.base_ref }}" $DRAFT)
          else
            OUT=$(pnpm exec resolve-environment --file "$FILE" --ref "${GITHUB_REF}")
          fi
          STACK="$(field stack "$OUT")"
          if [[ "$(field matched "$OUT")" != "true" ]]; then
            echo "Nothing was deployed for this run: nothing to bake."
            echo "bake=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]] || [[ -f "Pulumi.${STACK}.yaml" ]]; then
            echo "bake=true" >> "$GITHUB_OUTPUT"
            echo "stack=${STACK}" >> "$GITHUB_OUTPUT"
          else
            echo "No stack config for ${STACK} — nothing deployed, nothing to bake."
            echo "bake=false" >> "$GITHUB_OUTPUT"
          fi

      # Reads the bake function from the platform stack and each plugin's
      # structure key from its stack, then asks the function to bake until every
      # plugin's registration has arrived. It reports each plugin's state on every
      # attempt, and stops at once on a registration that cannot arrive by waiting.
      - name: Bake
        if: steps.platform.outputs.deployed == 'true' && steps.env.outputs.bake == 'true'
        working-directory: ${{ steps.platform.outputs.path }}
        env:
          DEPLOY_STARTED_AT: ${{ needs.detect-changes.outputs.started-at }}
        run: |
          pnpm exec bake-manifest \
            --manifest "${GITHUB_WORKSPACE}/${{ inputs.manifest }}" \
            --stack "${{ steps.env.outputs.stack }}" \
            --since "${DEPLOY_STARTED_AT:-}"

  # ---------------------------------------------------------------------------
  # Job 5: Remove a pull request's review environment when it closes
  # ---------------------------------------------------------------------------
  # A review environment lives as long as its pull request. Merged or not, the
  # close removes every stack it had, plugins first and the platform last, the
  # reverse of how they were deployed. A caller subscribes to `closed` in its
  # own `pull_request` trigger for this to run. A failed removal fails the job,
  # so a lingering stack is visible rather than silently billed.
  destroy-review:
    name: Remove review environment
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      needs.detect-changes.outputs.environments-file != ''
    environment: deploy-platform
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      # Empty → Pulumi Cloud, logged in with the token above.
      PULUMI_BACKEND_URL: ${{ inputs.pulumi-backend-url }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ needs.detect-changes.outputs.region }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Pulumi Cloud needs the token; a self-managed backend needs only its URL.
      # Neither, and every Pulumi command below fails with a login prompt it
      # cannot answer, so say which is missing before anything is installed.
      - name: Check the Pulumi backend
        run: |
          if [[ -z "${PULUMI_ACCESS_TOKEN:-}" && -z "${PULUMI_BACKEND_URL:-}" ]]; then
            echo "::error::No Pulumi backend: pass the PULUMI_ACCESS_TOKEN secret for Pulumi Cloud, or set the pulumi-backend-url input to a self-managed backend (s3://…)."
            exit 1
          fi
          echo "Pulumi backend: ${PULUMI_BACKEND_URL:-Pulumi Cloud}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup workspace (pnpm-workspace.yaml)
        # This repository's own; a caller without one keeps its workspace as it is.
        run: |
          if [[ -f scripts/workspace-setup.mjs ]]; then
            node scripts/workspace-setup.mjs
          else
            echo "No scripts/workspace-setup.mjs: the workspace is used as checked out"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
        with:
          pulumi-version: 3.247.0

      - name: Remove the review stacks
        run: |
          set -uo pipefail
          MANIFEST="${{ inputs.manifest }}"
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 2>/dev/null || true
          sudo chmod +x /usr/local/bin/yq 2>/dev/null || true
          MANIFEST_DIR=$(dirname "$MANIFEST")
          [[ "$MANIFEST_DIR" == "." ]] && MANIFEST_DIR="" || MANIFEST_DIR="${MANIFEST_DIR}/"
          PLATFORM_PATH="${MANIFEST_DIR}$(yq '.platform.path' "$MANIFEST")"

          # A draft is asked about as ready, so a pull request that was reviewed
          # and then turned back into a draft still has its stacks found.
          OUT=$(cd "$PLATFORM_PATH" && pnpm exec resolve-environment \
            --file "${GITHUB_WORKSPACE}/${{ needs.detect-changes.outputs.environments-file }}" \
            --pull-request "${{ github.event.pull_request.number }}" --base "${{ github.base_ref }}")
          echo "$OUT"
          STACK=$(sed -n "s/^stack=//p" <<< "$OUT")
          if [[ -z "$STACK" ]]; then
            echo "No review environment for pull requests into ${{ github.base_ref }}: nothing to remove."
            exit 0
          fi

          FAILED=""
          remove() {
            local dir="$1"
            if pulumi stack select "$STACK" --cwd "$dir" --non-interactive 2>/dev/null; then
              echo "Removing ${STACK} in ${dir}"
              if pulumi destroy --stack "$STACK" --cwd "$dir" --yes --skip-preview --non-interactive &&
                 pulumi stack rm "$STACK" --cwd "$dir" --yes --non-interactive; then
                return 0
              fi
              FAILED="${FAILED} ${dir}"
            else
              echo "No ${STACK} stack in ${dir}"
            fi
          }
          while read -r plugin_path; do
            [[ -n "$plugin_path" ]] && remove "$plugin_path"
          done < <(echo '${{ needs.detect-changes.outputs.all-plugins }}' | jq -r 'reverse | .[] | select(.review) | .path')
          remove "$PLATFORM_PATH"

          if [[ -n "$FAILED" ]]; then
            echo "::error::${STACK} could not be removed in:${FAILED}"
            exit 1
          fi

  # The change-detection base SHA is derived from the last successful run of the
  # caller workflow (see the "Parse manifest and detect changes" step), so no
  # deploy state is committed back to the repo.
