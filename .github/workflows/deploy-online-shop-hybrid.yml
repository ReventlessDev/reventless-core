# Deploy the online-shop-hybrid example to AWS.
#
# Triggered by:
#   - workflow_dispatch from release.yml when the release does NOT include reventless-aws
#   - workflow_dispatch from build-lambda-layer.yml after a new layer is published
#   - Manual dispatch
#
# The Lambda Layer ARN is read from .github/layer-arn[-branch].txt at deploy time.
# build-lambda-layer.yml commits the fresh ARN before dispatching this workflow,
# so the ARN file is always up-to-date when the deploy reads it.

name: Deploy Online Shop Hybrid

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-online-shop-hybrid-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  # Required so the auto-issued GITHUB_TOKEN can read from
  # npm.pkg.github.com during `pnpm install` (e.g. the
  # @reventlessdev/reventless-host-shell tarball used by platform-aws).
  packages: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reventless-aws.yml
    with:
      manifest: examples/online-shop-hybrid/deploy-manifest.yaml
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Optional: when set, Platform_Stack uses the existing UserPool
      # instead of auto-provisioning a fresh one. Create the secret in
      # the repository or environment settings to enable; leave unset to
      # let each deploy provision its own pool.
      COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
