# Deploy the online-shop-hybrid example to AWS.
#
# Triggered by:
#   - Release completion   → deploys immediately UNLESS a layer build is in
#     progress (in which case it skips — the layer build completion will
#     trigger its own deploy with the fresh ARN).
#   - Build Lambda Layer completion → always deploys with the new layer ARN.
#   - Manual dispatch → always deploys.

name: Deploy Online Shop Hybrid

on:
  workflow_run:
    workflows: ["Release", "Build Lambda Layer"]
    types: [completed]
    branches: [main, alpha]
  # Allow manual trigger (e.g. after setting REVENTLESS_LAYER_ARN manually)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Check deploy gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      layer-arn: ${{ steps.read-arn.outputs.arn }}
    steps:
      - name: Decide whether to deploy
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TRIGGER="${{ github.event.workflow_run.name }}"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — deploying"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$TRIGGER" == "Build Lambda Layer" ]]; then
            echo "Layer build completed — deploying"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Triggered by Release — check if the release included reventless-aws.
          # If so, a layer build was dispatched; defer to its completion trigger
          # to deploy with the fresh ARN.
          RELEASE_SHA="${{ github.event.workflow_run.head_sha }}"
          AWS_TAGS=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/@reventlessdev/reventless-aws@" \
            --jq "[.[] | select(.object.sha == \"$RELEASE_SHA\")] | length" 2>/dev/null || echo "0")
          if [ "$AWS_TAGS" -gt 0 ]; then
            echo "Release includes reventless-aws — deferring to layer build trigger"
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Also check if a layer build is active (queued, waiting, or in progress).
          IN_PROGRESS=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "Build Lambda Layer" \
            --status in_progress \
            --json databaseId --jq 'length')
          QUEUED=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "Build Lambda Layer" \
            --status queued \
            --json databaseId --jq 'length')
          WAITING=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "Build Lambda Layer" \
            --status waiting \
            --json databaseId --jq 'length')
          ACTIVE=$((IN_PROGRESS + QUEUED + WAITING))

          if [ "$ACTIVE" -gt 0 ]; then
            echo "Release triggered deploy, but $ACTIVE layer build(s) active — skipping (layer build will trigger deploy)"
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release triggered deploy, no active layer builds — deploying"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read latest layer ARN from repository
        if: steps.check.outputs.should-deploy == 'true'
        id: read-arn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch from branch HEAD to pick up any ARN committed after github.sha.
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          ARN=$(gh api "repos/${{ github.repository }}/contents/.github/layer-arn.txt?ref=${BRANCH}" \
            --jq '.content' | base64 -d | tr -d '[:space:]') || ARN=""
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"
          echo "Layer ARN: ${ARN:-(none)}"

  deploy:
    needs: gate
    if: needs.gate.outputs.should-deploy == 'true'
    uses: ./.github/workflows/deploy-reventless-aws.yml
    with:
      manifest: examples/online-shop-hybrid/deploy-manifest.yaml
      layer-arn: ${{ needs.gate.outputs.layer-arn }}
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
