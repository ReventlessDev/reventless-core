# Deploy the online-shop-hybrid example to AWS.
# Triggers on push to alpha/main branches.
# Uses the reusable deploy-reventless-aws workflow.

name: Deploy Online Shop Hybrid

on:
  push:
    branches: [main, alpha]
  pull_request:
    branches: [main]

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reventless-aws.yml
    with:
      manifest: examples/online-shop-hybrid/deploy-manifest.yaml
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
