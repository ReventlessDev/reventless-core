# Deploy the online-shop-hybrid example to AWS.
#
# Triggered by:
#   - Release completion   → deploys immediately UNLESS the release included
#     reventless-aws OR reventless-layer-builder was changed (in both cases
#     build-lambda-layer.yml will dispatch this workflow with a fresh ARN).
#   - Manual dispatch → always deploys.

name: Deploy Online Shop Hybrid

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main, alpha]
  # Allow manual trigger (e.g. after setting REVENTLESS_LAYER_ARN manually,
  # or dispatched automatically by build-lambda-layer.yml).
  workflow_dispatch: {}

concurrency:
  group: deploy-online-shop-hybrid-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: Check deploy gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      layer-arn: ${{ steps.read-arn.outputs.arn }}
    steps:
      - name: Decide whether to deploy
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch — deploying"
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Triggered by Release — skip if build-lambda-layer.yml will also run
          # (it dispatches this workflow with a fresh ARN when done).
          # Two cases where it runs:
          #   1. reventless-aws was released → a new layer is published after release
          #   2. reventless-layer-builder/** was changed → path-triggered layer build
          #
          # NOTE: head_sha is the commit that triggered Release, but Lerna pushes a
          # NEW version commit during the release. Tags point to that new commit, not
          # head_sha. Resolve the current branch HEAD to find the version commit.
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          VERSION_SHA=$(gh api "repos/${{ github.repository }}/git/ref/heads/${BRANCH}" \
            --jq '.object.sha' 2>/dev/null || echo "")

          if [ -n "$VERSION_SHA" ]; then
            AWS_CHANGES=$(gh api "repos/${{ github.repository }}/commits/$VERSION_SHA" \
              --jq '[.files[]?.filename | select(startswith("reventless/reventless-aws/"))] | length' \
              2>/dev/null || echo "0")
            if [ "$AWS_CHANGES" -gt 0 ]; then
              echo "Release includes reventless-aws — layer build will dispatch deploy with fresh ARN"
              echo "should-deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            LAYER_BUILDER_CHANGES=$(gh api "repos/${{ github.repository }}/commits/$VERSION_SHA" \
              --jq '[.files[]?.filename | select(startswith("reventless/reventless-layer-builder/"))] | length' \
              2>/dev/null || echo "0")
            if [ "$LAYER_BUILDER_CHANGES" -gt 0 ]; then
              echo "Layer builder changed — build-lambda-layer.yml will dispatch deploy with fresh ARN"
              echo "should-deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Release triggered deploy, no layer build needed — deploying"
          echo "should-deploy=true" >> "$GITHUB_OUTPUT"

      - name: Read latest layer ARN from repository
        if: steps.check.outputs.should-deploy == 'true'
        id: read-arn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch from branch HEAD to pick up any ARN committed after github.sha.
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          ARN=$(gh api "repos/${{ github.repository }}/contents/.github/layer-arn.txt?ref=${BRANCH}" \
            --jq '.content' | base64 -d | tr -d '[:space:]') || ARN=""
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"
          echo "Layer ARN: ${ARN:-(none)}"

  deploy:
    needs: gate
    if: needs.gate.outputs.should-deploy == 'true'
    uses: ./.github/workflows/deploy-reventless-aws.yml
    with:
      manifest: examples/online-shop-hybrid/deploy-manifest.yaml
      layer-arn: ${{ needs.gate.outputs.layer-arn }}
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
