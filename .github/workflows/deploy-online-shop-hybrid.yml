# Deploy the online-shop-hybrid example to AWS.
#
# Runs after the Release workflow completes on alpha/main — this ensures
# packages are published before Pulumi runs.
#
# The Lambda Layer ARN is read from .github/layer-arn.txt (committed by
# build-lambda-layer.yml). On the first deploy after a new release, the
# layer may still be building; subsequent deploys will pick it up.

name: Deploy Online Shop Hybrid

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main, alpha]
  # Allow manual trigger (e.g. after setting REVENTLESS_LAYER_ARN manually)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    # Only deploy if the release succeeded (or on manual trigger)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-reventless-aws.yml
    with:
      manifest: examples/online-shop-hybrid/deploy-manifest.yaml
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
