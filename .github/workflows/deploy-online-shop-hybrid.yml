# Deploy the online-shop-hybrid example to AWS.
#
# Runs after the Release workflow completes on alpha/main — this ensures
# packages are published before Pulumi runs.
#
# The Lambda Layer ARN is read from .github/layer-arn.txt (committed by
# build-lambda-layer.yml). If a layer build is in progress, the deploy
# waits for it to complete before proceeding.

name: Deploy Online Shop Hybrid

on:
  workflow_run:
    workflows: ["Release", "Build Lambda Layer"]
    types: [completed]
    branches: [main, alpha]
  # Allow manual trigger (e.g. after setting REVENTLESS_LAYER_ARN manually)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  wait-for-layer:
    name: Wait for Lambda Layer
    runs-on: ubuntu-latest
    # Skip if the triggering workflow failed (but always run on manual dispatch)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      layer-arn: ${{ steps.read-arn.outputs.arn }}
    steps:
      - name: Wait for in-progress layer builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # When triggered by Release, a layer build may have just been dispatched.
          # When triggered by Build Lambda Layer, another build could be queued.
          # Wait for any in-progress or queued "Build Lambda Layer" runs to finish.
          MAX_WAIT=600  # 10 minutes
          INTERVAL=15
          WAITED=0

          while [ $WAITED -lt $MAX_WAIT ]; do
            IN_PROGRESS=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Build Lambda Layer" \
              --status in_progress \
              --json databaseId \
              --jq 'length')
            QUEUED=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Build Lambda Layer" \
              --status queued \
              --json databaseId \
              --jq 'length')

            ACTIVE=$((IN_PROGRESS + QUEUED))
            if [ "$ACTIVE" -eq 0 ]; then
              echo "No active layer builds — proceeding"
              break
            fi

            echo "Waiting for $ACTIVE layer build(s) to finish... (${WAITED}s elapsed)"
            sleep $INTERVAL
            WAITED=$((WAITED + INTERVAL))
          done

          if [ $WAITED -ge $MAX_WAIT ]; then
            echo "::warning::Timed out waiting for layer build after ${MAX_WAIT}s — deploying with current layer ARN"
          fi

      - name: Read latest layer ARN from repository
        id: read-arn
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The layer build commits layer-arn.txt after github.sha was set,
          # so fetch the file from the branch HEAD rather than the checkout.
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          ARN=$(gh api "repos/${{ github.repository }}/contents/.github/layer-arn.txt?ref=${BRANCH}" \
            --jq '.content' | base64 -d | tr -d '[:space:]') || ARN=""
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"
          echo "Layer ARN: ${ARN:-(none)}"

  deploy:
    needs: wait-for-layer
    uses: ./.github/workflows/deploy-reventless-aws.yml
    with:
      manifest: examples/online-shop-hybrid/deploy-manifest.yaml
      layer-arn: ${{ needs.wait-for-layer.outputs.layer-arn }}
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
