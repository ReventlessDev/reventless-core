# Deploy the online-shop-hybrid example to AWS.
#
# Registered with the GitHub Actions index so release.yml / build-lambda-layer.yml
# can dispatch it via `gh workflow run deploy-online-shop-hybrid.yml`.
#
# NOTE (2026-06-17): this file existed in git but was never indexed by GitHub
# Actions, so `gh workflow run` would 404. A push modifying the workflow file
# forces (re-)indexing.
#
# Triggered by:
#   - workflow_dispatch from release.yml when the release does NOT include reventless-aws
#   - workflow_dispatch from build-lambda-layer.yml after a new layer is published
#   - Manual dispatch
#
# The Lambda Layer ARN is resolved from SSM Parameter Store
# (/reventless/layer-arn/{stack}) at deploy time. build-lambda-layer.yml writes
# the fresh ARN there before dispatching this workflow, so the parameter is
# always up-to-date when the deploy reads it.

name: Deploy Online Shop Hybrid

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-online-shop-hybrid-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  # Read-only: the deploy no longer commits state back to the repo.
  contents: read
  # Required so detect-changes can derive the base SHA from the last successful
  # run of this workflow via `gh run list` (the GitHub Actions API).
  actions: read
  # Dependencies — including the @reventlessdev/reventless-host-shell tarball
  # used by platform-aws — are public on npmjs, so `pnpm install` is anonymous.
  # No `packages: read` scope or GitHub Packages cross-repo linking is needed
  # (host-shell is published to public npmjs from the sibling reventless-ui repo).

jobs:
  deploy:
    uses: ./.github/workflows/deploy-reventless-aws.yml
    with:
      manifest: examples/online-shop-hybrid/deploy-manifest.yaml
      # Optional repo VARIABLES (not secrets — none are sensitive). When both
      # base domain and hosted-zone ID are set the framework provisions an
      # ACM cert (us-east-1) + Route53 alias for the host-UI shell and serves
      # it at a derived FQDN. Leave the variables unset to keep the default
      # *.cloudfront.net URL. HOST_UI_PROD_STACKS only needs to be set when
      # the team uses prod-stack names other than the default "prod,main".
      host-ui-base-domain: ${{ vars.HOST_UI_BASE_DOMAIN }}
      host-ui-hosted-zone-id: ${{ vars.HOST_UI_HOSTED_ZONE_ID }}
      host-ui-prod-stacks: ${{ vars.HOST_UI_PROD_STACKS }}
    secrets:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Optional: when set, Platform_Stack uses the existing UserPool
      # instead of auto-provisioning a fresh one. Create the secret in
      # the repository or environment settings to enable; leave unset to
      # let each deploy provision its own pool.
      COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
      # Defined so the repo .npmrc's ${NPM_TOKEN} expands and pnpm honours
      # node-linker=hoisted during the deploy install (see deploy-reventless-aws.yml).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
