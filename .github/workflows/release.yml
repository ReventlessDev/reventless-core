name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main, beta, alpha]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Packages
    # While npm publishing is blocked, push-triggered releases are gated behind
    # the PUBLISHING_ENABLED repo variable. Manual workflow_dispatch still runs.
    if: github.event_name == 'workflow_dispatch' || (vars.PUBLISHING_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success')
    # Local path, so the pipeline that releases this repository is always the one
    # committed alongside the code being released. Repositories calling this
    # workflow from outside pin a TAG — never a branch; see the header of
    # release-packages.yml.
    uses: ./.github/workflows/release-packages.yml
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
      checks: read
      actions: write
    with:
      ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      node-version: "22.17.1"
      workspace-setup: node scripts/workspace-setup.mjs
      build-command: pnpm run clean && pnpm run build
      # doc and reventless-layer-builder are private; reventless-ppx is released
      # by its own workflow (publish-ppx.yml).
      ignore-changes: doc reventless-layer-builder reventless-ppx
      private-packages: doc reventless-layer-builder
      changelog-root: packages
      doc-changelog-file: packages/doc/CHANGELOG.md
      doc-changelog-source: packages/doc/**
      # The PPX is consumed from the published per-platform package
      # @reventlessdev/reventless-ppx-linux-x64 (an optionalDependency resolved
      # by packages/reventless-ppx/bin). It is compiled here only when that
      # binary is absent — see publish-ppx.yml.
      ppx-fallback: true
      ppx-binary-paths: node_modules/@reventlessdev/reventless-ppx-linux-x64/ppx.exe packages/reventless-ppx/ppx-linux.exe
      ppx-source-dir: packages/reventless-ppx/src
      ppx-output-path: packages/reventless-ppx/ppx-linux.exe
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  post-release:
    name: Post-release Dispatch
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger Lambda Layer build if reventless-aws was released
        id: layer-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAGS: ${{ needs.release.outputs.tags }}
        run: |
          TRIGGERED=false
          for tag in $NEW_TAGS; do
            if [[ "$tag" == @reventlessdev/reventless-aws@* ]]; then
              VERSION="${tag##*@}"
              echo "Triggering Lambda Layer build for version $VERSION"
              gh workflow run build-lambda-layer.yml \
                -R "${{ github.repository }}" \
                -f version="$VERSION"
              TRIGGERED=true
              break
            fi
          done
          echo "triggered=$TRIGGERED" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy if no layer build needed
        if: steps.layer-build.outputs.triggered == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ needs.release.outputs.branch }}
        run: |
          echo "No reventless-aws release — dispatching deploy directly on $BRANCH_NAME"
          gh workflow run deploy-online-shop-hybrid.yml \
            -R "${{ github.repository }}" \
            --ref "$BRANCH_NAME"

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    # post-release is included so a failed dispatch still fails the summary — it
    # used to be a step of the release job, where its failure was visible.
    needs: [release, post-release]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Release workflow completed"
          echo "Release status: ${{ needs.release.result }}"
          echo "Post-release status: ${{ needs.post-release.result }}"

          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "✅ Packages released successfully"
          elif [[ "${{ needs.release.result }}" == "skipped" ]]; then
            echo "⏭️ No changes to release"
          else
            echo "❌ Release failed"
            exit 1
          fi

          if [[ "${{ needs.post-release.result }}" == "failure" ]]; then
            echo "❌ Post-release dispatch failed"
            exit 1
          fi
