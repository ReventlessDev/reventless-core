name: Release

on:
  push:
    branches: [main, beta, alpha]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
      checks: read
      actions: read
    steps:
      - name: Wait for CI and Security Scan
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          check-regexp: "(CI|Security Scan).*"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success
          fail-on-no-checks: false
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all packages
        run: npm run build

      # Tests already run in CI workflow - no need to run again
      # - name: Run tests
      #   run: npm run test

      - name: Determine prerelease identifier
        id: prerelease
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [ "$BRANCH_NAME" = "alpha" ]; then
            echo "preid=alpha" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_NAME" = "beta" ]; then
            echo "preid=beta" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "preid=" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Clean uncommitted changes
        run: |
          # Discard any uncommitted changes from build process
          # (build artifacts, generated files, deleted files, etc.)
          git status
          git reset --hard HEAD
          git clean -fd
          git status

      - name: Version packages with Lerna
        timeout-minutes: 10
        env:
          HUSKY: 0
        run: |
          IS_PRERELEASE="${{ steps.prerelease.outputs.is_prerelease }}"
          PREID="${{ steps.prerelease.outputs.preid }}"
          BRANCH_NAME="${{ steps.prerelease.outputs.branch }}"

          # Disable git hooks to prevent hanging in CI
          git config core.hooksPath /dev/null

          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Creating prerelease versions with identifier: $PREID"
            npx lerna version --conventional-commits --conventional-prerelease --preid "$PREID" --allow-branch "$BRANCH_NAME" --ignore-changes doc --ignore-changes reventless-layer-builder --force-git-tag --yes --no-push
          else
            echo "Creating regular release versions"
            npx lerna version --conventional-commits --conventional-graduate --allow-branch "$BRANCH_NAME" --ignore-changes doc --ignore-changes reventless-layer-builder --force-git-tag --yes --no-push
          fi

          echo "Lerna version completed successfully"

      - name: Update documentation CHANGELOG
        run: |
          CHANGELOG_FILE="packages/doc/CHANGELOG.md"
          GITHUB_REPO="ReventlessDev/reventless-core"

          # Get the last commit that modified the CHANGELOG (excluding this workflow)
          LAST_CHANGELOG_COMMIT=$(git log -1 --format="%H" --skip=0 -- "$CHANGELOG_FILE" 2>/dev/null || echo "")

          # Determine the range to search
          if [ -z "$LAST_CHANGELOG_COMMIT" ]; then
            # If CHANGELOG never updated, get commits from last 30 days
            SINCE_DATE=$(date -u -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-30d +%Y-%m-%d)
            COMMIT_RANGE="--since=$SINCE_DATE"
          else
            COMMIT_RANGE="$LAST_CHANGELOG_COMMIT..HEAD"
          fi

          # Get commits affecting doc package
          COMMITS=$(git log --format="%H|%s|%ad" --date=short $COMMIT_RANGE -- "packages/doc/**" 2>/dev/null || echo "")

          # If no new commits, skip
          if [ -z "$COMMITS" ]; then
            echo "No new documentation changes to record"
            exit 0
          fi

          echo "Found documentation changes to record"

          # Create temporary file for new entries
          TEMP_ENTRIES=$(mktemp)

          # Process commits and group by date
          CURRENT_DATE=""
          while IFS='|' read -r hash subject date; do
            # Skip if empty line
            [ -z "$hash" ] && continue

            # Add date header if new date
            if [ "$date" != "$CURRENT_DATE" ]; then
              if [ -n "$CURRENT_DATE" ]; then
                echo "" >> "$TEMP_ENTRIES"
              fi
              echo "### $date" >> "$TEMP_ENTRIES"
              CURRENT_DATE="$date"
            fi

            # Format entry with commit link (truncate hash to 7 chars)
            SHORT_HASH="${hash:0:7}"
            echo "- $subject ([$SHORT_HASH](https://github.com/$GITHUB_REPO/commit/$hash))" >> "$TEMP_ENTRIES"
          done <<< "$COMMITS"

          # Insert new entries into CHANGELOG after "## Changes" header
          TEMP_CHANGELOG=$(mktemp)

          awk -v new_entries_file="$TEMP_ENTRIES" '
            /^## Changes$/ {
              print $0
              print ""
              while ((getline line < new_entries_file) > 0) {
                print line
              }
              close(new_entries_file)
              # Skip the next empty line if it exists
              getline
              if ($0 != "") {
                print $0
              }
              next
            }
            {print}
          ' "$CHANGELOG_FILE" > "$TEMP_CHANGELOG"

          # Replace original file
          mv "$TEMP_CHANGELOG" "$CHANGELOG_FILE"
          rm -f "$TEMP_ENTRIES"

          # Stage the changes
          git add "$CHANGELOG_FILE"

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes to commit to CHANGELOG"
          else
            git commit -m "docs: update documentation CHANGELOG" -m "[skip ci]"
            echo "Documentation CHANGELOG updated successfully"
          fi

      - name: Build release artifacts
        run: |
          npm run clean
          npm run build

      - name: Publish to GitHub Package Registry
        run: |
          npx lerna publish from-package \
            --registry=https://npm.pkg.github.com \
            --yes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version tags and commits
        run: |
          BRANCH_NAME="${{ steps.prerelease.outputs.branch }}"
          git push --follow-tags origin $BRANCH_NAME

      - name: Create GitHub releases
        run: |
          IS_PRERELEASE="${{ steps.prerelease.outputs.is_prerelease }}"
          BRANCH_NAME="${{ steps.prerelease.outputs.branch }}"
          PRERELEASE_FLAG=""

          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Get all new tags created by Lerna
          NEW_TAGS=$(git tag --points-at HEAD)

          for tag in $NEW_TAGS; do
            # Extract package name and version from tag
            # Tags are in format: @reventlessdev/package-name@version or package-name@version
            package_name=$(echo $tag | sed 's/@reventlessdev\///' | sed 's/@.*//')
            version=$(echo $tag | sed 's/.*@//')

            # Skip private packages (doc, aws-lambda-layer)
            if [ "$package_name" = "doc" ] || [ "$package_name" = "reventless-layer-builder" ]; then
              echo "Skipping private package: $package_name"
              continue
            fi

            echo "Creating release for $package_name@$version"

            # Generate release notes from changelog if it exists
            if [ -f "packages/$package_name/CHANGELOG.md" ]; then
              # Extract the latest changelog entry
              CHANGELOG_ENTRY=$(awk '/^## / {if (found) exit; found=1; next} found' "packages/$package_name/CHANGELOG.md")
              
              # Create release notes with changelog link (using printf for proper formatting)
              RELEASE_NOTES=$(printf '%s\n\n**Changelog**: https://github.com/${{ github.repository }}/blob/%s/packages/%s/CHANGELOG.md' "$CHANGELOG_ENTRY" "$BRANCH_NAME" "$package_name")
            else
              RELEASE_NOTES="Release $version of $package_name"
            fi

            # Create GitHub release
            gh release create "$tag" \
              --title "$package_name v$version" \
              --notes "$RELEASE_NOTES" \
              $PRERELEASE_FLAG || echo "Release already exists or failed for $tag"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Release workflow completed"
          echo "Status: ${{ needs.release.result }}"

          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "✅ Packages released successfully"
          elif [[ "${{ needs.release.result }}" == "skipped" ]]; then
            echo "⏭️ No changes to release"
          else
            echo "❌ Release failed"
            exit 1
          fi
