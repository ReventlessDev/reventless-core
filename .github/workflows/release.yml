name: Release

on:
  workflow_run:
    workflows: ["CI", "Security Scan"]
    types: [completed]
    branches: [main, beta, alpha]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Release with semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"

      - name: Publish packages to GitHub Package Registry
        run: |
          # Publish all packages that were versioned by semantic-release
          # Uses 'from-package' to publish based on package.json versions
          npx lerna publish from-package \
            --registry=https://npm.pkg.github.com \
            --yes \
            --no-verify-access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Release workflow completed"
          echo "Status: ${{ needs.release.result }}"

          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "✅ Packages released successfully"
          elif [[ "${{ needs.release.result }}" == "skipped" ]]; then
            echo "⏭️ No changes to release"
          else
            echo "❌ Release failed"
            exit 1
          fi
