name: Release

on:
  push:
    branches: [main, beta, alpha]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - prerelease

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Packages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/alpha'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Analyze commits for version bumps
        id: version-check
        run: |
          # Determine branch type
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [ "$BRANCH_NAME" = "alpha" ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "prerelease_id=alpha" >> $GITHUB_OUTPUT
          elif [ "$BRANCH_NAME" = "beta" ]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "prerelease_id=beta" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "prerelease_id=" >> $GITHUB_OUTPUT
          fi

          # Get commits since last release
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tags found, this will be the first release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "release_type=minor" >> $GITHUB_OUTPUT
          else
            echo "Last tag: $LAST_TAG"
            COMMITS=$(git log $LAST_TAG..HEAD --oneline)
            if [ -z "$COMMITS" ]; then
              echo "No commits since last release"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "Commits since last release:"
              echo "$COMMITS"
              echo "has_changes=true" >> $GITHUB_OUTPUT

              # Determine release type based on conventional commits
              if echo "$COMMITS" | grep -q "BREAKING CHANGE\|!:"; then
                echo "release_type=major" >> $GITHUB_OUTPUT
              elif echo "$COMMITS" | grep -q "^feat"; then
                echo "release_type=minor" >> $GITHUB_OUTPUT
              else
                echo "release_type=patch" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Version packages
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          RELEASE_TYPE="${{ github.event.inputs.release_type || steps.version-check.outputs.release_type }}"
          IS_PRERELEASE="${{ steps.version-check.outputs.is_prerelease }}"
          PRERELEASE_ID="${{ steps.version-check.outputs.prerelease_id }}"
          BRANCH_NAME="${{ steps.version-check.outputs.branch }}"

          echo "Branch: $BRANCH_NAME"
          echo "Release type: $RELEASE_TYPE"
          echo "Is prerelease: $IS_PRERELEASE"
          echo "Prerelease ID: $PRERELEASE_ID"

          if [ "$RELEASE_TYPE" = "auto" ]; then
            RELEASE_TYPE="${{ steps.version-check.outputs.release_type }}"
          fi

          # Use Lerna to version packages
          if [ "$IS_PRERELEASE" = "true" ]; then
            # For alpha/beta branches, create prerelease versions
            if [ "$RELEASE_TYPE" = "prerelease" ]; then
              npx lerna version prerelease --preid $PRERELEASE_ID --conventional-commits --yes --no-push
            else
              # Prerelease with specific version bump (e.g., preminor, prepatch, premajor)
              npx lerna version pre$RELEASE_TYPE --preid $PRERELEASE_ID --conventional-commits --yes --no-push
            fi
          else
            # For main branch, create regular versions
            if [ "$RELEASE_TYPE" = "prerelease" ]; then
              npx lerna version prerelease --conventional-commits --yes --no-push
            else
              npx lerna version $RELEASE_TYPE --conventional-commits --yes --no-push
            fi
          fi

      - name: Generate changelogs
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          # Generate changelog for each package that was versioned
          npx lerna exec --since -- "conventional-changelog -p angular -i CHANGELOG.md -s"

      - name: Build release artifacts
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          # Clean build to ensure fresh artifacts
          npm run clean
          npm run build

          # Validate all packages have proper build artifacts
          for package in packages/*/; do
            if [ -f "$package/package.json" ]; then
              package_name=$(basename "$package")
              echo "Validating build artifacts for $package_name"
              
              # Check if package has main/module/types fields and corresponding files exist
              node -e "
                const fs = require('fs');
                const path = require('path');
                const pkg = require('./$package/package.json');
                
                if (pkg.main && !fs.existsSync(path.join('$package', pkg.main))) {
                  console.error('Main file missing for $package_name: ' + pkg.main);
                  process.exit(1);
                }
                
                if (pkg.module && !fs.existsSync(path.join('$package', pkg.module))) {
                  console.error('Module file missing for $package_name: ' + pkg.module);
                  process.exit(1);
                }
                
                if (pkg.types && !fs.existsSync(path.join('$package', pkg.types))) {
                  console.warn('Types file missing for $package_name: ' + pkg.types);
                }
              "
            fi
          done

      - name: Publish to GitHub Packages (Tier 0)
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          # Publish Tier 0 packages (no dependencies)
          TIER_0_PACKAGES=(
            "rescript-hash-obj"
            "rescript-node-streams" 
            "rescript-pulumi-pulumi"
            "rescript-uuid"
          )

          for package in "${TIER_0_PACKAGES[@]}"; do
            if [ -d "packages/$package" ]; then
              echo "Publishing $package (Tier 0)"
              cd "packages/$package"
              npm publish --registry=https://npm.pkg.github.com
              cd ../..
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (Tier 1)
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          # Publish Tier 1 packages (depend on Tier 0)
          TIER_1_PACKAGES=(
            "rescript-aws-sdk"
            "rescript-fast-csv"
            "rescript-pulumi-aws"
            "rescript-ssh2"
          )

          for package in "${TIER_1_PACKAGES[@]}"; do
            if [ -d "packages/$package" ]; then
              echo "Publishing $package (Tier 1)"
              cd "packages/$package"
              npm publish --registry=https://npm.pkg.github.com
              cd ../..
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (Tier 2)
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          # Publish Tier 2 packages (depend on Tier 0 & 1)
          TIER_2_PACKAGES=(
            "reventless"
            "reventless-aws"
            "reventless-spec"
            "reventless-ui"
            "reventless-ci"
          )

          for package in "${TIER_2_PACKAGES[@]}"; do
            if [ -d "packages/$package" ]; then
              echo "Publishing $package (Tier 2)"
              cd "packages/$package"
              npm publish --registry=https://npm.pkg.github.com
              cd ../..
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version tags
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          BRANCH_NAME="${{ steps.version-check.outputs.branch }}"
          git push --follow-tags origin $BRANCH_NAME

      - name: Create GitHub releases
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          IS_PRERELEASE="${{ steps.version-check.outputs.is_prerelease }}"
          PRERELEASE_FLAG=""

          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Get all new tags created by Lerna
          NEW_TAGS=$(git tag --points-at HEAD)

          for tag in $NEW_TAGS; do
            package_name=$(echo $tag | sed 's/@reventless\///' | sed 's/@.*//')
            version=$(echo $tag | sed 's/.*@//')

            echo "Creating release for $package_name@$version"

            # Generate release notes from changelog
            if [ -f "packages/$package_name/CHANGELOG.md" ]; then
              # Extract the latest changelog entry
              RELEASE_NOTES=$(awk '/^## / {if (found) exit; found=1; next} found' "packages/$package_name/CHANGELOG.md")
            else
              RELEASE_NOTES="Release $version of $package_name"
            fi

            # Create GitHub release
            gh release create "$tag" \
              --title "$package_name v$version" \
              --notes "$RELEASE_NOTES" \
              --generate-notes \
              $PRERELEASE_FLAG
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update documentation
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          # Update root README with latest versions
          node -e "
            const fs = require('fs');
            const path = require('path');
            
            // Read all package.json files and extract versions
            const packages = fs.readdirSync('packages');
            const versions = {};
            
            packages.forEach(pkg => {
              const pkgPath = path.join('packages', pkg, 'package.json');
              if (fs.existsSync(pkgPath)) {
                const pkgJson = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
                if (pkgJson.name && pkgJson.version) {
                  versions[pkgJson.name] = pkgJson.version;
                }
              }
            });
            
            console.log('Updated package versions:', JSON.stringify(versions, null, 2));
          "

      - name: Notify stakeholders
        if: steps.version-check.outputs.has_changes == 'true'
        run: |
          echo "Release completed successfully!"
          echo "Published packages:"
          git tag --points-at HEAD
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [release]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Release workflow completed"
          echo "Status: ${{ needs.release.result }}"

          if [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "✅ Packages released successfully"
          elif [[ "${{ needs.release.result }}" == "skipped" ]]; then
            echo "⏭️ No changes to release"
          else
            echo "❌ Release failed"
            exit 1
          fi
