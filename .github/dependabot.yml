version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 10
    assignees:
      - "reventless-team"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "@rescript/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lerna"
        update-types: ["version-update:semver-major"]
    groups:
      # Group ReScript-related updates
      rescript:
        patterns:
          - "@rescript/*"
          - "rescript*"
          - "bs-*"
      # Group AWS SDK updates
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
          - "aws-*"
      # Group testing dependencies
      testing:
        patterns:
          - "jest*"
          - "@testing-library/*"
          - "vitest*"
          - "cypress*"
      # Group linting and formatting
      linting:
        patterns:
          - "eslint*"
          - "prettier*"
          - "@typescript-eslint/*"
      # Group build tools
      build-tools:
        patterns:
          - "webpack*"
          - "rollup*"
          - "vite*"
          - "esbuild*"
          - "babel*"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    assignees:
      - "reventless-team"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "github-actions"
      - "ci/cd"
      - "automated"

  # Enable version updates for Docker (if any Dockerfiles exist)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 3
    assignees:
      - "reventless-team"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
    labels:
      - "docker"
      - "automated"